000", "Dr Service Revenue 90,000 / Cr Rent Expense 30,000 / Cr Salaries Expense 40,000 / Cr Retained Earnings 20,000"], "answer": 3}, {"id": "T3-M18", "topic": "T3", "priority": 3, "template": "false-statement", "weak_spot": true, "stem": "Which statement about closing entries is FALSE?", "explanation": "Revenue is closed with a DEBIT to revenue and a CREDIT to Retained Earnings; the false option has it backwards. The other three are correct descriptions of the purpose and mechanics of closing.", "trap": "Trap: 'close revenue' = debit revenue. The student got this wrong on the midterm.", "klp": "T3: Closing entries; why we close", "source": "original (student weak spot: closing revenue)", "options": ["To close a revenue account, the company credits the revenue account and debits Retained Earnings.", "Closing entries reset revenue, expense and dividend accounts to zero so the next period starts fresh.", "After closing, the net effect of the closing entries equals net income minus dividends, transferred to Retained Earnings.", "To close the Dividends account, the company debits Retained Earnings and credits Dividends."], "answer": 0}, {"id": "T3-M19", "topic": "T3", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following accounts is NOT closed at the end of the accounting period?", "explanation": "Accumulated Depreciation is a contra-asset (balance sheet) account, so it is permanent and carries forward. Dividends, revenue and contra-revenue accounts are temporary and are closed to Retained Earnings.", "trap": "Trap: contra accounts on the balance sheet (allowance, accumulated depreciation) are permanent; contra-revenue accounts (sales discounts, returns) are temporary.", "klp": "T3: Temporary vs permanent accounts", "source": "Sample final Q45 / midterm MT5 style, original", "options": ["Dividends", "Accumulated Depreciation", "Interest Revenue", "Sales Discounts"], "answer": 1}, {"id": "T3-M20", "topic": "T3", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which account is temporary and is therefore closed to Retained Earnings at year-end?", "explanation": "Expenses, revenues and dividends are temporary (nominal) accounts. Unearned Revenue (liability), Prepaid Rent (asset) and Share Capital (equity) are permanent (real) accounts that are never closed.", "trap": "Trap: 'Unearned Revenue' contains the word revenue but it is a liability and stays open.", "klp": "T3: Temporary vs permanent accounts", "source": "Midterm MT5 / E4-15 style, original", "options": ["Unearned Revenue", "Prepaid Rent", "Utilities Expense", "Share Capital"], "answer": 2}, {"id": "T3-M21", "topic": "T3", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Why does a company close its temporary accounts at the end of each year?", "explanation": "The income statement reports one period's performance, so the flow accounts must be emptied each year; their balances are carried into Retained Earnings. Balance sheet accounts are permanent and never reset. Closing has nothing to do with making the trial balance balance, and no cash moves anywhere.", "trap": "Trap: closing moves balances, not cash.", "klp": "T3: Why should we close those accounts?", "source": "Week 3 review (prof: 'to start afresh'), original", "options": ["So that the balance sheet accounts are reset to zero for the new year.", "So that the trial balance will balance.", "So that cash can be transferred to Retained Earnings.", "So that revenue, expense and dividend accounts start the new year at zero and measure only the new period's performance, while Retained Earnings accumulates the results."], "answer": 3}, {"id": "T3-M22", "topic": "T3", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following is a 'cash later' transaction that requires an ACCRUAL adjusting entry at year-end?", "explanation": "Accrued expense: the cost was incurred before cash is paid. The other three are deferrals (cash first): prepaid insurance, unearned revenue, and supplies on hand.", "trap": "Trap: 'cash first' = deferral (prepaid, unearned); 'cash later' = accrual (accrued expense, accrued revenue).", "klp": "T3: Cash first vs cash later transactions", "source": "Sample final Q50 style, original", "options": ["Interest on a note payable incurred this year but payable next year", "A two-year insurance premium paid at the start of the year", "A customer deposit received for goods to be delivered next year", "Office supplies bought for cash and still on hand"], "answer": 0}, {"id": "T3-M23", "topic": "T3", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which pairing of adjustment types with their cash timing is correct?", "explanation": "Deferrals (prepaid expenses, unearned revenue) happen when cash moves first and the revenue or expense follows. Accruals (accrued expenses, accrued revenue) happen when the revenue or expense comes first and cash follows. The other options flip at least one of these.", "trap": "Trap: the word 'accrued' always means cash LATER.", "klp": "T3: Cash first vs cash later", "source": "Sample midterm SM17 style, original", "options": ["Prepaid expense: cash later; accrued expense: cash first", "Prepaid expense: cash first; accrued revenue: cash later", "Unearned revenue: cash later; accrued revenue: cash first", "Accrued expense: cash first; unearned revenue: cash first"], "answer": 1}, {"id": "T3-M24", "topic": "T3", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which situation results in recognizing an ACCRUED REVENUE at period-end?", "explanation": "Accrued revenue = earned now, cash later (Dr Interest Receivable / Cr Interest Revenue). Rent received in advance is unearned revenue; prepaid insurance is a prepaid expense; unpaid wages are an accrued expense.", "trap": "Trap: 'earned but not received' = accrued revenue; 'received but not earned' = unearned revenue.", "klp": "T3: Examples of the four adjustment types", "source": "Midterm MT34 style, original", "options": ["Rent collected in advance from a tenant for next quarter", "A one-year insurance premium paid in advance", "Interest earned on a bank deposit during December that will be received in January", "Wages earned by staff in December, to be paid in January"], "answer": 2}, {"id": "T3-M25", "topic": "T3", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Accrual accounting, the revenue recognition principle and the matching principle exist mainly because of which assumption?", "explanation": "Because we cut the life of a business into periods, we must decide which period each revenue and expense belongs to; that is exactly what accrual accounting, revenue recognition and matching do. The other assumptions do not create this need.", "trap": "Trap: 'why do we need adjusting entries' = time-period assumption.", "klp": "T3: We need accrual accounting mainly because of the time period assumption", "source": "Sample final Q46 style, original", "options": ["Going-concern assumption", "Monetary unit assumption", "Economic entity assumption", "Time-period assumption"], "answer": 3}, {"id": "T3-M26", "topic": "T3", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A plumber repairs a customer's pipes on December 28, 2026 and receives payment on January 10, 2027. Under accrual accounting, when is the revenue recognized?", "explanation": "Revenue is recognized when earned (control of the service transfers), regardless of when cash arrives. Recognizing on receipt of cash is cash-basis. The booking date and a 50/50 split have no basis in the revenue recognition principle.", "trap": "Trap: cash timing never decides revenue timing under accrual accounting.", "klp": "T3: When is revenue recognized under accrual vs cash accounting?", "source": "Midterm MT23 style, original", "options": ["In December 2026, when the service is performed", "In January 2027, when the cash is received", "In the month the customer first called for the appointment", "Half in December and half in January"], "answer": 0}, {"id": "T3-M27", "topic": "T3", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Which statement best describes the matching principle?", "explanation": "Matching ties expenses to the revenue of the same period (for example COGS at the time of sale, bad debt expense estimated in the period of the credit sale). Matching cash flows is cash-basis accounting. 'Assets match liabilities' is not a principle. Recording on payment ignores accruals.", "trap": "Trap: matching is about revenue and expense timing, not about cash.", "klp": "T3: Describe the matching principle with examples", "source": "Sample midterm SM16 / midterm bonus question style, original", "options": ["Cash outflows are matched against cash inflows to compute net income.", "Expenses are recognized in the same period as the revenues they helped to generate, regardless of when cash is paid.", "Total assets must always be matched with total liabilities.", "Expenses are recorded only when the supplier is paid."], "answer": 1}, {"id": "T3-M28", "topic": "T3", "priority": 2, "template": "plug", "weak_spot": false, "stem": "In 2026 Dawn Services billed clients $120,000 for work performed, collecting $95,000 of it in 2026. It also collected $10,000 in 2026 for work done in 2025. Expenses incurred in 2026 were $70,000, of which $60,000 was paid in 2026; Dawn also paid $5,000 in 2026 for expenses accrued in 2025. What is 2026 net income under ACCRUAL accounting?", "explanation": "Accrual NI = revenue earned 120,000 - expenses incurred 70,000 = 50,000. $40,000 is cash-basis income (105,000 received - 65,000 paid). $35,000 uses only this year's collections and payments. $55,000 mixes accrual revenue with cash expenses.", "trap": "Trap: under accrual, ignore every number about WHEN cash moved.", "klp": "T3: Accrual vs cash basis", "source": "Sample final Q19 style, original numbers", "options": ["$35,000", "$40,000", "$50,000", "$55,000"], "answer": 2}, {"id": "T3-M29", "topic": "T3", "priority": 2, "template": "plug", "weak_spot": false, "stem": "Ember Ltd earned $80,000 of revenue in its first year and collected $60,000 of it. It paid $45,000 cash for expenses incurred during the year and still owes $6,000 of salaries for December. What is the difference between accrual-basis net income and cash-basis net income?", "explanation": "Accrual NI = 80,000 - (45,000 + 6,000) = 29,000. Cash NI = 60,000 - 45,000 = 15,000. Difference = 14,000, accrual higher. The reversed option has the wrong direction. $20,000 counts only the uncollected revenue and forgets the unpaid salaries. They are not equal because timing differs.", "trap": "Trap: unpaid salaries reduce accrual income but not cash income.", "klp": "T3: Accrual vs cash basis", "source": "Week 2 Karas Brothers style, original numbers", "options": ["Cash-basis net income is $14,000 higher than accrual net income", "Accrual net income is $20,000 higher than cash-basis net income", "Accrual net income is $14,000 higher than cash-basis net income", "They are equal because the same transactions are recorded under both methods"], "answer": 2}, {"id": "T3-M30", "topic": "T3", "priority": 2, "template": "plug", "weak_spot": false, "stem": "Supplies on hand were $1,500 at the start of the year. Supplies costing $6,200 were bought during the year, and a year-end count shows $2,300 on hand. What is supplies expense for the year?", "explanation": "Beginning 1,500 + purchases 6,200 - ending 2,300 = 5,400 used. $6,200 treats all purchases as expense. $2,300 is the asset left, not the expense. $7,700 is the total available, forgetting the supplies still on hand.", "trap": "Trap: Beginning + additions - ending = amount used.", "klp": "T3: Prepaid expenses (supplies); account analysis", "source": "E4-12 style, original numbers", "options": ["$2,300", "$5,400", "$6,200", "$7,700"], "answer": 1}, {"id": "T3-M31", "topic": "T3", "priority": 2, "template": "plug", "weak_spot": false, "stem": "Unearned Revenue had a balance of $12,000 at the start of the year and $15,000 at the end. Revenue recognized from advance payments during the year was $40,000. How much cash was collected in advance from customers during the year?", "explanation": "Beginning 12,000 + collections - revenue earned 40,000 = ending 15,000, so collections = 15,000 + 40,000 - 12,000 = 43,000. $37,000 subtracts the increase instead of adding it. $40,000 assumes the liability did not change. $52,000 forgets the ending balance.", "trap": "Trap: the liability grew by 3,000, so collections must exceed revenue by 3,000.", "klp": "T3: Unearned revenue; account analysis", "source": "E4-12 style, original numbers", "options": ["$37,000", "$40,000", "$43,000", "$52,000"], "answer": 2}, {"id": "T3-M32", "topic": "T3", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which statement about adjusting entries is FALSE?", "explanation": "Accrued salaries are credited to Salaries Payable, not Cash; adjusting entries never involve cash because the cash either moved earlier (deferrals) or will move later (accruals). The other three statements are true features of adjusting entries.", "trap": "Trap: any adjusting entry option containing Cash is wrong.", "klp": "T3: Purpose of adjusting entries; four types", "source": "Week 2 In-Class Activity 1 framework, original", "options": ["Adjusting entries are needed to bring the accounts up to date under accrual accounting before statements are prepared.", "Every adjusting entry affects at least one income statement account and one balance sheet account.", "An adjusting entry for supplies used debits Supplies Expense and credits Supplies.", "An adjusting entry for accrued salaries debits Salaries Expense and credits Cash."], "answer": 3}, {"id": "T4-M01", "topic": "T4", "priority": 3, "template": "aging", "weak_spot": false, "stem": "Maple Supply uses an aging schedule. Before adjustment the Allowance for Bad Debts has a $2,500 CREDIT balance. The aging shows: 0-30 days $200,000 at 1%; 31-60 days $50,000 at 5%; 61-90 days $20,000 at 20%; over 90 days $10,000 at 50%. What is bad debt expense for the year?", "explanation": "Desired ending allowance = 2,000 + 2,500 + 4,000 + 5,000 = 13,500. Expense = desired 13,500 - existing credit 2,500 = 11,000. $13,500 is the ending allowance balance, not the expense. $16,000 wrongly treats the credit balance as a debit and adds it. $2,500 is just the existing balance.", "trap": "Trap: aging total = ENDING allowance; the expense is the top-up from the existing balance.", "klp": "T4: Aging schedule -> desired balance -> bad debt expense", "source": "Sample final Q33 / Easy Card style, original numbers", "options": ["$2,500", "$11,000", "$13,500", "$16,000"], "answer": 1}, {"id": "T4-M02", "topic": "T4", "priority": 3, "template": "aging", "weak_spot": false, "stem": "Before adjustment, Ridge Ltd's Allowance for Bad Debts has a $1,200 DEBIT balance (write-offs during the year exceeded the opening allowance). Its aging schedule shows: 0-30 days $150,000 at 2%; 31-90 days $40,000 at 10%; over 90 days $5,000 at 40%. What bad debt expense should Ridge record?", "explanation": "Desired allowance = 3,000 + 4,000 + 2,000 = 9,000 credit. From a 1,200 debit, the company must add 9,000 + 1,200 = 10,200. $7,800 treats the debit as a credit. $9,000 is the ending balance, not the expense. $1,200 is the existing balance.", "trap": "Trap: a DEBIT pre-adjustment balance is ADDED to the desired balance.", "klp": "T4: Bad debt expense = desired ending balance - current balance", "source": "E7-3 style, original numbers", "options": ["$1,200", "$7,800", "$9,000", "$10,200"], "answer": 3}, {"id": "T4-M03", "topic": "T4", "priority": 3, "template": "aging", "weak_spot": false, "stem": "Falcon Ltd's aging of receivables at December 31: not yet due $120,000 at 1%; 1-30 days overdue $30,000 at 4%; 31-60 days overdue $15,000 at 10%; over 60 days overdue $6,000 at 50%. The allowance has a $2,100 credit balance before adjustment. What should the ENDING balance of the Allowance for Bad Debts be after adjustment?", "explanation": "Ending allowance = 1,200 + 1,200 + 1,500 + 3,000 = 6,900. $4,800 is the bad debt EXPENSE (desired minus existing), not the balance. $164,100 is net realizable value. $171,000 is gross receivables.", "trap": "Trap: read whether the question asks for the ending BALANCE or the EXPENSE.", "klp": "T4: Aging schedule gives the desired ending balance", "source": "Midterm MT31 style, original numbers", "options": ["$4,800", "$6,900", "$164,100", "$171,000"], "answer": 1}, {"id": "T4-M04", "topic": "T4", "priority": 2, "template": "aging", "weak_spot": false, "stem": "Vale Ltd estimates bad debts at 2% of net credit sales. Net credit sales for the year were $600,000, and the Allowance for Bad Debts has a $1,500 DEBIT balance before adjustment. What bad debt expense should Vale record?", "explanation": "Under the percentage-of-sales method the expense is simply 2% x 600,000 = 12,000; the existing allowance balance is ignored. $13,500 wrongly adds the debit balance (aging-method thinking). $10,500 wrongly subtracts it. $1,500 is just the existing balance.", "trap": "Trap: percentage-of-sales ignores the existing balance; aging uses it.", "klp": "T4: Bad debt expense methods", "source": "Midterm MT33 style, original numbers", "options": ["$1,500", "$10,500", "$12,000", "$13,500"], "answer": 2}, {"id": "T4-M05", "topic": "T4", "priority": 3, "template": "aging", "weak_spot": false, "stem": "Quarry Ltd began the year with a $5,000 credit balance in its Allowance for Bad Debts. During the year it wrote off $4,200 of customer accounts. The year-end aging indicates the allowance should be $9,000. Gross accounts receivable at year-end is $150,000. What are bad debt expense for the year and accounts receivable, net, at year-end?", "explanation": "Unadjusted allowance = 5,000 - 4,200 = 800 credit. Expense = 9,000 - 800 = 8,200. Net A/R = 150,000 - ending allowance 9,000 = 141,000. 'Expense 9,000' uses the desired balance as the expense. 'Net 141,800' subtracts the expense instead of the ending allowance. The last option makes both errors.", "trap": "Trap: net A/R = gross - ENDING allowance, never gross - expense.", "klp": "T4: A/R net and bad debt expense", "source": "Sample final Q35 style, original numbers", "options": ["Bad debt expense $8,200; accounts receivable, net $141,000", "Bad debt expense $9,000; accounts receivable, net $141,000", "Bad debt expense $8,200; accounts receivable, net $141,800", "Bad debt expense $9,000; accounts receivable, net $132,800"], "answer": 0}, {"id": "T4-M06", "topic": "T4", "priority": 3, "template": "principle", "weak_spot": true, "stem": "A company uses the aging method. All else equal, which change would INCREASE this year's bad debt expense?", "explanation": "A bigger A/R balance means a bigger desired allowance and therefore a bigger top-up (expense). Fewer write-offs leave the existing allowance HIGHER, so the top-up is smaller. A lower percentage lowers the desired balance. Better collections shrink A/R and the desired balance.", "trap": "Trap: fewer write-offs REDUCE the expense under aging because the existing balance stays higher.", "klp": "T4: Aging schedule and bad debt expense", "source": "Midterm MT1 (student error), original", "options": ["Writing off fewer customer accounts during the year", "A larger ending balance of accounts receivable than last year", "Lowering the estimated uncollectible percentage for the over-90-day bucket", "Collecting a higher proportion of receivables before year-end"], "answer": 1}, {"id": "T4-M07", "topic": "T4", "priority": 3, "template": "principle", "weak_spot": true, "stem": "Under the aging method, two companies have identical aging schedules and identical desired ending allowances of $20,000. Company X has a $4,000 credit balance in its allowance before adjustment; Company Y has a $4,000 debit balance. Which statement is correct?", "explanation": "X: expense = 20,000 - 4,000 = 16,000. Y: expense = 20,000 + 4,000 = 24,000. The ending balance is the same, but the top-up differs. 'Same expense of 20,000' confuses the ending balance with the expense. X still needs a 16,000 top-up.", "trap": "Trap: the expense depends on where the allowance STARTS; a debit start means a bigger top-up.", "klp": "T4: Bad debt expense = desired ending balance - current balance", "source": "original (student weak spot: aging direction)", "options": ["Company X records a larger bad debt expense than Company Y.", "Both companies record the same bad debt expense of $20,000.", "Company Y records a larger bad debt expense than Company X.", "Company X records no bad debt expense because it already has a credit balance."], "answer": 2}, {"id": "T4-M08", "topic": "T4", "priority": 3, "template": "principle", "weak_spot": true, "stem": "Under the aging method, which event during the year would DECREASE the bad debt expense recorded at year-end, all else equal?", "explanation": "A recovery credits the allowance (Dr A/R / Cr Allowance), raising the existing balance, so a smaller top-up is needed. Older receivables raise the desired balance. Larger write-offs reduce the existing balance, so a BIGGER top-up is needed. More outstanding sales raise A/R and the desired balance.", "trap": "Trap: anything that raises the existing allowance lowers the expense; anything that raises the desired balance raises the expense.", "klp": "T4: Aging method; recovery entry", "source": "original (student weak spot: aging direction)", "options": ["An increase in the proportion of receivables that are more than 90 days old", "A larger write-off of uncollectible accounts during the year", "An increase in credit sales that are still outstanding at year-end", "Recovery of an account that had been written off earlier in the year"], "answer": 3}, {"id": "T4-M09", "topic": "T4", "priority": 3, "template": "transaction-je", "weak_spot": true, "stem": "A customer whose $700 account was written off last year unexpectedly pays in full this year. Under the allowance method, which is the correct accounting?", "explanation": "First reverse the write-off (reinstate A/R and the allowance), then record the collection. Crediting Bad Debt Expense or a revenue account is wrong because the recovery is not income; the expense was an estimate recorded earlier. The last option repeats the write-off instead of reversing it.", "trap": "Trap: a recovery INCREASES (credits) the allowance; net income is not affected.", "klp": "T4: Journal entries for write-off and recovery", "source": "Midterm MT4 (student error), original", "options": ["Dr Accounts Receivable 700 / Cr Allowance for Bad Debts 700; then Dr Cash 700 / Cr Accounts Receivable 700", "Dr Cash 700 / Cr Bad Debt Expense 700", "Dr Cash 700 / Cr Bad Debt Recovery Revenue 700", "Dr Allowance for Bad Debts 700 / Cr Accounts Receivable 700; then Dr Cash 700 / Cr Accounts Receivable 700"], "answer": 0}, {"id": "T4-M10", "topic": "T4", "priority": 3, "template": "no-change", "weak_spot": true, "stem": "Under the allowance method, what is the effect of recording the recovery of an account previously written off?", "explanation": "The reinstating entry credits (increases) the allowance; the cash collection then reduces A/R. No income statement account is touched. 'Allowance decreases' describes a write-off. The expense is not reduced. Net A/R ends up unchanged after the two entries (A/R up then down; allowance up offsets).", "trap": "Trap: recovery = credit the allowance back; no effect on net income.", "klp": "T4: Recovery of a written-off account", "source": "original (student weak spot: recovery)", "options": ["Allowance for Bad Debts decreases; net income is unchanged", "Allowance for Bad Debts increases; net income is unchanged", "Bad Debt Expense decreases; net income increases", "Accounts Receivable, net increases permanently by the amount recovered"], "answer": 1}, {"id": "T4-M11", "topic": "T4", "priority": 3, "template": "false-statement", "weak_spot": true, "stem": "Which statement about writing off and recovering accounts under the allowance method is FALSE?", "explanation": "A recovery goes back through the allowance (Dr A/R / Cr Allowance), not through expense or income. The other three correctly describe write-offs and recoveries.", "trap": "Trap: neither a write-off nor a recovery touches the income statement.", "klp": "T4: Write-off and recovery entries", "source": "original (student weak spot: recovery)", "options": ["A write-off is recorded by debiting Allowance for Bad Debts and crediting Accounts Receivable.", "A write-off does not change net income because the expense was estimated earlier.", "A recovery is recorded by debiting Cash and crediting Bad Debt Expense, which increases net income.", "A recovery is recorded by first reversing the write-off entry and then recording the cash collection."], "answer": 2}, {"id": "T4-M12", "topic": "T4", "priority": 3, "template": "no-change", "weak_spot": false, "stem": "When a specific customer's account is written off under the allowance method, what is the effect on net income and on the net realizable value (NRV) of accounts receivable, respectively?", "explanation": "Dr Allowance / Cr A/R reduces gross A/R and the allowance by the same amount, so NRV is unchanged; no expense is recorded, so net income is unchanged. The expense hit income earlier when it was estimated. The other options assume the write-off itself is an expense or reduces NRV.", "trap": "Trap: the write-off only uses up the allowance that was already set aside.", "klp": "T4: Journal entry to write off a bad debt", "source": "Midterm MT22 style, original", "options": ["Decrease / Decrease", "Decrease / No effect", "No effect / Decrease", "No effect / No effect"], "answer": 3}, {"id": "T4-M13", "topic": "T4", "priority": 3, "template": "no-change", "weak_spot": false, "stem": "Before writing off a $800 customer account, Lark Ltd had Accounts Receivable of $50,000 and an Allowance for Bad Debts of $3,000. What is the net realizable value of receivables immediately BEFORE and AFTER the write-off?", "explanation": "Before: 50,000 - 3,000 = 47,000. After: (50,000 - 800) - (3,000 - 800) = 49,200 - 2,200 = 47,000. '46,200 after' reduces only A/R and forgets the allowance also falls. Using 50,000 ignores the allowance entirely. The last option deducts the write-off from both before and after.", "trap": "Trap: both A/R and the allowance fall, so NRV does not move.", "klp": "T4: NRV of A/R; write-off entry", "source": "Practice AP14 style, original numbers", "options": ["$47,000 before; $47,000 after", "$47,000 before; $46,200 after", "$50,000 before; $49,200 after", "$46,200 before; $46,200 after"], "answer": 0}, {"id": "T4-M14", "topic": "T4", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which statement about the Allowance for Bad Debts is FALSE?", "explanation": "A credit balance does not make the allowance a liability; it is a contra-asset shown as a deduction from A/R. The other three are correct descriptions of why and how the allowance works.", "trap": "Trap: contra-asset accounts have credit balances but are still part of assets.", "klp": "T4: Allowance is a contra-asset with a credit balance", "source": "Sample final Q20 style, original", "options": ["The allowance is a contra-asset account that is deducted from gross accounts receivable.", "Because the allowance has a credit balance, it is reported among current liabilities.", "The allowance is used because the company does not yet know which customers will fail to pay.", "Recording the year-end estimate of bad debts increases the allowance."], "answer": 1}, {"id": "T4-M15", "topic": "T4", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A balance sheet shows: 'Accounts receivable, net of allowance of $4,500 ... $120,000'. Which statement is correct?", "explanation": "Net = gross - allowance, so gross is 124,500, the allowance is 4,500 and the expected collection (NRV) is 120,000. '115,500' treats the net figure as gross. The allowance is an estimate of future uncollectibles, not the write-offs of the year. '124,500' is gross, not what is expected to be collected.", "trap": "Trap: 'A/R, net' is already the amount expected to be collected.", "klp": "T4: What does accounts receivable, net mean?", "source": "Practice AP12 style, original numbers", "options": ["Gross accounts receivable are $120,000 and the company expects to collect $115,500.", "The company wrote off $4,500 of receivables during the year.", "The company expects to collect $120,000 and expects $4,500 of the amounts owed to be uncollectible.", "The company expects to collect $124,500 from its customers."], "answer": 2}, {"id": "T4-M16", "topic": "T4", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "On September 1, 2026 Birch Ltd accepted a $90,000, 6-month, 8% note receivable from a customer; principal and interest are due at maturity. What adjusting entry is required on December 31, 2026?", "explanation": "September to December = 4 months: 90,000 x 8% x 4/12 = 2,400 earned but not received. $3,600 is the full 6 months' interest. Debiting Notes Receivable is the wrong account; the accrued interest goes to Interest Receivable. The last option is reversed.", "trap": "Trap: accrue only the months elapsed, and use Interest Receivable, not Notes Receivable.", "klp": "T4: Adjusting entry for interest earned on notes receivable", "source": "Sample final Q15 style, original numbers", "options": ["Dr Interest Receivable 3,600 / Cr Interest Revenue 3,600", "Dr Notes Receivable 2,400 / Cr Interest Revenue 2,400", "Dr Interest Revenue 2,400 / Cr Interest Receivable 2,400", "Dr Interest Receivable 2,400 / Cr Interest Revenue 2,400"], "answer": 3}, {"id": "T4-M17", "topic": "T4", "priority": 3, "template": "formula", "weak_spot": false, "stem": "A $40,000, 90-day, 9% note receivable is collected in full at maturity. Assuming a 360-day year, how much interest revenue does the company earn on the note?", "explanation": "Interest = 40,000 x 9% x 90/360 = 900. $3,600 is a full year's interest. $300 uses 30 days. $1,800 uses 180 days.", "trap": "Trap: the rate is always annual; multiply by the fraction of the year.", "klp": "T4: Interest = principal x rate x time", "source": "Week 3 slide 22 style, original numbers", "options": ["$300", "$900", "$1,800", "$3,600"], "answer": 1}, {"id": "T4-M18", "topic": "T4", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "Ash Ltd holds a $12,000, 120-day, 10% note receivable. At maturity the customer fails to pay. No interest was accrued earlier. Using a 360-day year, what entry does Ash record at maturity?", "explanation": "Interest = 12,000 x 10% x 120/360 = 400. A dishonored note is moved to A/R at principal plus interest earned (12,400); the company still earned the interest. Transferring only 12,000 forgets the interest. The customer has not yet been judged uncollectible, so neither Bad Debt Expense nor the Allowance is used at this point.", "trap": "Trap: dishonored means 'not paid on time', not 'uncollectible'; keep the interest and move everything to A/R.", "klp": "T4: When a note is dishonored, principal and interest are transferred to A/R", "source": "Sample final Q18 / E7-14 style, original numbers", "options": ["Dr Accounts Receivable 12,400 / Cr Notes Receivable 12,000 / Cr Interest Revenue 400", "Dr Accounts Receivable 12,000 / Cr Notes Receivable 12,000", "Dr Bad Debt Expense 12,400 / Cr Notes Receivable 12,000 / Cr Interest Revenue 400", "Dr Allowance for Bad Debts 12,000 / Cr Notes Receivable 12,000"], "answer": 0}, {"id": "T4-M19", "topic": "T4", "priority": 2, "template": "plug", "weak_spot": false, "stem": "The Allowance for Bad Debts began the year with a $6,000 credit balance. During the year the company wrote off $7,500 of accounts and recovered $500 of accounts previously written off. The year-end aging requires an ending allowance of $8,000. What bad debt expense was recorded for the year?", "explanation": "Beginning 6,000 - write-offs 7,500 + recoveries 500 + expense = ending 8,000, so expense = 8,000 - 6,000 + 7,500 - 500 = 9,000. $8,000 is the ending balance. $9,500 ignores the recovery (which credited the allowance). $7,500 is the write-offs, which are realized losses, not the estimate.", "trap": "Trap: recoveries credit the allowance and reduce the top-up needed.", "klp": "T4: Allowance roll-forward: Beginning - write-offs + recoveries + expense = Ending", "source": "Mail Time in-class sheet style, original numbers", "options": ["$7,500", "$8,000", "$9,000", "$9,500"], "answer": 2}, {"id": "T4-M20", "topic": "T4", "priority": 1, "template": "false-statement", "weak_spot": false, "stem": "Which statement about receivables is FALSE?", "explanation": "Trade accounts receivable are interest-free credit; only notes receivable carry stated interest. The other three statements are correct.", "trap": "Trap: A/R = free credit; N/R = interest-bearing written promise.", "klp": "T4: Accounts receivable vs notes receivable", "source": "Week 3 slide 6, original", "options": ["Accounts receivable arise from credit sales and normally carry no interest.", "Both accounts receivable and notes receivable earn interest from the date of sale.", "A note receivable is a written promise to pay a fixed amount on a fixed date, usually with interest.", "Both accounts receivable and notes receivable are reported at the amount the company expects to collect."], "answer": 1}, {"id": "T5-M01", "topic": "T5", "priority": 3, "template": "inventory-costing", "weak_spot": false, "stem": "Use the following information for this question and the next. Solace Audio uses a perpetual inventory system. Its April records for one speaker model: Apr 1 beginning inventory 150 units at $20; Apr 6 purchase 250 units at $24; Apr 12 sale 300 units; Apr 20 purchase 200 units at $27; Apr 27 sale 180 units. Using the moving-average (perpetual average) method, what is ending inventory at April 30?", "explanation": "After Apr 6: 400 units costing 3,000 + 6,000 = 9,000, average $22.50. Apr 12 sale: 300 x 22.50 = 6,750; 100 units (2,250) left. After Apr 20: 300 units costing 2,250 + 5,400 = 7,650, average $25.50. Apr 27 sale: 180 x 25.50 = 4,590; 120 units left x 25.50 = 3,060. Check: COGS 11,340 + EI 3,060 = 14,400 cost available. $2,880 is the periodic average (14,400/600 = $24 x 120). $3,240 is FIFO (120 x 27). $2,540 is perpetual LIFO (100 x 20 + 20 x 27).", "trap": "Trap: recompute the average after EVERY purchase; one overall average is the periodic answer.", "klp": "T5: Average cost, FIFO, LIFO under the perpetual system", "source": "Sample final Q8 style (linked pair), original numbers", "options": ["$2,540", "$2,880", "$3,060", "$3,240"], "answer": 2}, {"id": "T5-M02", "topic": "T5", "priority": 3, "template": "inventory-costing", "weak_spot": false, "stem": "Refer to the Solace Audio information in the previous question. Using perpetual LIFO, what is cost of goods sold for April?", "explanation": "Apr 12 sale (only layers on hand: 150 at $20, 250 at $24): 250 x 24 + 50 x 20 = 6,000 + 1,000 = 7,000; 100 units at $20 remain. Apr 27 sale: 180 x 27 = 4,860 (from the Apr 20 layer); 100 at $20 + 20 at $27 remain. COGS = 7,000 + 4,860 = 11,860; EI = 2,540; total 14,400 checks. $11,160 is FIFO. $11,340 is moving average. $12,000 is PERIODIC LIFO (uses the Apr 20 layer for the Apr 12 sale, which did not exist yet).", "trap": "Trap: under perpetual LIFO you may only use layers that exist on the sale date.", "klp": "T5: Perpetual LIFO", "source": "Sample final Q9 style (linked pair), original numbers", "options": ["$11,160", "$11,340", "$11,860", "$12,000"], "answer": 2}, {"id": "T5-M03", "topic": "T5", "priority": 3, "template": "inventory-costing", "weak_spot": false, "stem": "Use the following information for this question and the next. Trailhead Gear sells one model of backpack and uses a perpetual system. January: beginning inventory 80 units at $50; Jan 3-9 sold 60 units; Jan 10 bought 50 units at $54; Jan 11-18 sold 55 units; Jan 19 bought 70 units at $60; Jan 20-28 sold 60 units; Jan 30 bought 20 units at $62. Using perpetual FIFO, what is the cost of ending inventory at January 31?", "explanation": "Units: 80 + 50 + 70 + 20 = 220 available; 60 + 55 + 60 = 175 sold; 45 left. Under FIFO the newest costs remain: 20 x 62 + 25 x 60 = 1,240 + 1,500 = 2,740. (Cost available 12,140; FIFO COGS = 9,400.) $2,590 is perpetual LIFO ending inventory (15 x 50 + 10 x 60 + 20 x 62). $2,483 is periodic weighted average (12,140/220 x 45). $2,250 wrongly values the 45 units at the OLDEST cost of $50.", "trap": "Trap: FIFO ending inventory is made of the NEWEST purchases.", "klp": "T5: Perpetual FIFO", "source": "Midterm MT14 style (linked pair), original numbers", "options": ["$2,250", "$2,483", "$2,590", "$2,740"], "answer": 3}, {"id": "T5-M04", "topic": "T5", "priority": 3, "template": "inventory-costing", "weak_spot": false, "stem": "Refer to the Trailhead Gear information in the previous question. Using perpetual LIFO, what is cost of goods sold for January?", "explanation": "Sale 1: 60 x 50 = 3,000 (20 at $50 left). Sale 2: 50 x 54 + 5 x 50 = 2,700 + 250 = 2,950 (15 at $50 left). Sale 3: 60 x 60 = 3,600 (15 at $50 and 10 at $60 left). COGS = 3,000 + 2,950 + 3,600 = 9,550. EI = 750 + 600 + 1,240 = 2,590; 9,550 + 2,590 = 12,140 checks. $9,400 is FIFO. $9,657 is periodic average. $9,890 is periodic LIFO, which wrongly charges the Jan 30 purchase to sales made earlier.", "trap": "Trap: the Jan 30 purchase arrives after all sales, so under perpetual LIFO it cannot be in COGS.", "klp": "T5: Perpetual LIFO", "source": "Midterm MT2 style (linked pair), original numbers", "options": ["$9,400", "$9,550", "$9,657", "$9,890"], "answer": 1}, {"id": "T5-M05", "topic": "T5", "priority": 3, "template": "inventory-costing", "weak_spot": false, "stem": "A shop had 4 lamps costing $30 each and then bought 6 more at $35 each. It sold 7 lamps for $60 each. Using FIFO, what is cost of goods sold?", "explanation": "FIFO: 4 x 30 + 3 x 35 = 120 + 105 = 225. $231 is average cost (330/10 = $33 x 7). $240 is LIFO (6 x 35 + 1 x 30). $420 is sales revenue, not cost.", "trap": "Trap: FIFO sends the OLDEST costs to COGS first.", "klp": "T5: FIFO / LIFO / average cost", "source": "Week 4 shirts example style, original numbers", "options": ["$225", "$231", "$240", "$420"], "answer": 0}, {"id": "T5-M06", "topic": "T5", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which statement about inventory accounting under the perpetual system is FALSE?", "explanation": "Freight-out (delivery to customers) is a selling expense; only freight-in is capitalized. The other three statements are correct perpetual-system treatments.", "trap": "Trap: freight-IN goes into Inventory; freight-OUT is Delivery Expense.", "klp": "T5: Cost of inventory; perpetual entries", "source": "Sample final Q10 style, original", "options": ["Freight paid by the buyer to bring goods into its warehouse is added to the cost of inventory.", "When goods are sold, the company debits Cost of Goods Sold and credits Inventory.", "Freight paid to deliver goods to customers is added to the cost of inventory.", "A purchase return reduces the Inventory account."], "answer": 2}, {"id": "T5-M07", "topic": "T5", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which cost should be capitalized as part of the cost of inventory?", "explanation": "Inventory cost includes all costs to bring goods to their present location and condition, so import duties (like freight-in) are capitalized. Advertising is a selling expense, storage after receipt and abnormal spoilage are period expenses.", "trap": "Trap: 'getting the goods here and ready' = inventory; 'selling or holding them afterwards' = expense.", "klp": "T5: The cost of inventories includes purchase costs and other costs to bring to present location and condition", "source": "Midterm MT19 style, original", "options": ["Advertising to promote the goods", "Warehouse storage costs after the goods have been received and are ready for sale", "Abnormal spoilage caused by a warehouse accident", "Import duties paid to bring purchased goods into the country"], "answer": 3}, {"id": "T5-M08", "topic": "T5", "priority": 3, "template": "transaction-je", "weak_spot": true, "stem": "Rivera Ltd (perpetual system) bought goods on account for $5,000. Some arrived scratched, and the supplier granted a $300 allowance; Rivera keeps the goods. Which entry records the allowance?", "explanation": "Under the perpetual system every change in the cost of goods goes through Inventory: the allowance lowers what is owed (debit A/P) and the cost of the goods (credit Inventory). 'Purchase Returns and Allowances' is a periodic-system account. Debiting Inventory would raise the cost. The last option is both the wrong account and the wrong direction.", "trap": "Trap: perpetual = no Purchases, no Purchase Returns accounts. Everything hits Inventory.", "klp": "T5: Perpetual entries for purchase returns and allowances", "source": "Midterm MT27 (student error), original numbers", "options": ["Dr Accounts Payable 300 / Cr Inventory 300", "Dr Accounts Payable 300 / Cr Purchase Returns and Allowances 300", "Dr Inventory 300 / Cr Accounts Payable 300", "Dr Purchase Returns and Allowances 300 / Cr Accounts Payable 300"], "answer": 0}, {"id": "T5-M09", "topic": "T5", "priority": 3, "template": "transaction-je", "weak_spot": true, "stem": "Under a perpetual inventory system, a retailer returns $1,200 of unsuitable goods to its supplier before paying for them. The correct entry is:", "explanation": "Returning goods reduces the payable and removes the goods from Inventory. COGS is not involved because nothing was sold. 'Purchase Returns' is periodic. Crediting Cash is wrong because no cash moves; the supplier simply owes less.", "trap": "Trap: purchase returns, allowances AND discounts all CREDIT Inventory under perpetual.", "klp": "T5: Perpetual purchase returns", "source": "Sample midterm SM33 style, original", "options": ["Dr Accounts Payable 1,200 / Cr Cost of Goods Sold 1,200", "Dr Accounts Payable 1,200 / Cr Inventory 1,200", "Dr Purchase Returns 1,200 / Cr Accounts Payable 1,200", "Dr Accounts Payable 1,200 / Cr Cash 1,200"], "answer": 1}, {"id": "T5-M10", "topic": "T5", "priority": 3, "template": "false-statement", "weak_spot": true, "stem": "Lumen Retail uses a perpetual inventory system. Which statement is FALSE?", "explanation": "Under perpetual there is no Purchase Returns and Allowances account; allowances, returns and discounts all reduce Inventory, and freight-in increases it. The false statement uses the periodic account.", "trap": "Trap: if you see 'Purchase Returns' or 'Purchases' in a perpetual-system question, it is the wrong option.", "klp": "T5: Record purchase, transportation, returns, discounts under perpetual", "source": "Practice AP15 style, original", "options": ["A purchase allowance received from a supplier is credited to Inventory.", "A purchase discount taken for early payment is credited to Inventory.", "A purchase allowance received from a supplier is credited to Purchase Returns and Allowances.", "Freight-in paid on goods purchased is debited to Inventory."], "answer": 2}, {"id": "T5-M11", "topic": "T5", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "Hollis Ltd (perpetual) owes a supplier $6,000 with terms 2/10, n/30 and pays within the discount period. Which entry is correct?", "explanation": "Discount = 2% x 6,000 = 120. The whole payable is cleared, cash of 5,880 goes out, and the discount lowers the cost of the goods (credit Inventory). 'Purchase Discounts' is a periodic account. Debiting A/P for only 5,880 leaves 120 wrongly owing. The discount is a cost reduction, not revenue.", "trap": "Trap: a purchase discount reduces Inventory, not income.", "klp": "T5: Perpetual purchase discounts", "source": "Week 4 slide example (E), original numbers", "options": ["Dr Accounts Payable 6,000 / Cr Purchase Discounts 120 / Cr Cash 5,880", "Dr Accounts Payable 5,880 / Cr Cash 5,880", "Dr Accounts Payable 6,000 / Cr Discount Revenue 120 / Cr Cash 5,880", "Dr Accounts Payable 6,000 / Cr Inventory 120 / Cr Cash 5,880"], "answer": 3}, {"id": "T5-M12", "topic": "T5", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "A customer keeps slightly damaged goods and the seller grants a $250 price reduction on the unpaid invoice. What does the seller record?", "explanation": "An allowance reduces revenue through the contra-revenue account and reduces what the customer owes. No goods come back, so there is NO inventory/COGS entry; that second entry is only for a return. Debiting Sales Revenue directly hides the allowance. Debiting Inventory is wrong because nothing was returned.", "trap": "Trap: allowance = goods kept = no inventory entry; return = goods back = also Dr Inventory / Cr COGS.", "klp": "T5: Sales returns and allowances are contra-revenue accounts", "source": "Midterm MT17 style, original", "options": ["Dr Sales Returns and Allowances 250 / Cr Accounts Receivable 250", "Dr Sales Returns and Allowances 250 / Cr Accounts Receivable 250; and Dr Inventory 250 / Cr Cost of Goods Sold 250", "Dr Sales Revenue 250 / Cr Accounts Receivable 250", "Dr Inventory 250 / Cr Accounts Receivable 250"], "answer": 0}, {"id": "T5-M13", "topic": "T5", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "A customer returns goods that were sold on account for $1,000 (cost $600). The goods can be resold. Under the perpetual system the seller records:", "explanation": "Two entries: reverse the revenue at selling price (1,000) and put the goods back into Inventory at COST (600). Recording only the revenue side forgets the goods came back. Using 1,000 for inventory restores it at selling price, not cost. The last option is both entries reversed.", "trap": "Trap: revenue side at selling price; inventory side at cost.", "klp": "T5: Perpetual sales returns", "source": "Week 4 slide example (I), original numbers", "options": ["Dr Sales Returns and Allowances 1,000 / Cr Accounts Receivable 1,000 only", "Dr Sales Returns and Allowances 1,000 / Cr Accounts Receivable 1,000; and Dr Inventory 600 / Cr Cost of Goods Sold 600", "Dr Sales Returns and Allowances 1,000 / Cr Accounts Receivable 1,000; and Dr Inventory 1,000 / Cr Cost of Goods Sold 1,000", "Dr Accounts Receivable 1,000 / Cr Sales Returns and Allowances 1,000; and Dr Cost of Goods Sold 600 / Cr Inventory 600"], "answer": 1}, {"id": "T5-M14", "topic": "T5", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "On June 2 a seller sold goods for $8,000 on account, terms 2/10, n/30, recording the sale at the gross amount. The customer paid on June 11. What does the seller record on June 11?", "explanation": "June 11 is within 10 days, so the customer takes 2% x 8,000 = 160. Cash 7,840 plus Sales Discounts (contra-revenue) 160 clears the full receivable of 8,000. Recording 8,000 cash ignores the discount. Debiting Inventory confuses a SALES discount with a PURCHASE discount. Crediting only 7,840 leaves 160 wrongly in A/R.", "trap": "Trap: the seller's discount is Sales Discounts (contra-revenue); the buyer's discount reduces Inventory.", "klp": "T5: Sales discounts; credit terms", "source": "Sample final Q38 style, original numbers", "options": ["Dr Cash 8,000 / Cr Accounts Receivable 8,000", "Dr Cash 7,840 / Dr Inventory 160 / Cr Accounts Receivable 8,000", "Dr Cash 7,840 / Dr Sales Discounts 160 / Cr Accounts Receivable 8,000", "Dr Cash 7,840 / Cr Accounts Receivable 7,840"], "answer": 2}, {"id": "T5-M15", "topic": "T5", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Credit terms of '2/10, n/30' on an invoice mean that the buyer may:", "explanation": "The first number is the discount percentage, the second is the discount period in days, and n/30 means the net (full) amount is due in 30 days. The other options mix up the numbers.", "trap": "Trap: '2/10' = 2 percent within 10 days, not 10 percent within 2 days.", "klp": "T5: Interpret credit terms", "source": "Midterm MT10 / sample midterm SM34 style, original", "options": ["Deduct 10% of the invoice price if it pays within 2 days; otherwise the full amount is due within 30 days.", "Deduct 2% if it pays within 30 days; otherwise the full amount is due within 10 days.", "Pay 2% now and the remaining balance in 30 days.", "Deduct 2% of the invoice price if it pays within 10 days; otherwise the full amount is due within 30 days."], "answer": 3}, {"id": "T5-M16", "topic": "T5", "priority": 3, "template": "formula", "weak_spot": false, "stem": "A retailer reports gross sales $320,000; sales returns $12,000; sales allowances $5,000; sales discounts $3,000; freight-out $4,000; cost of goods sold $190,000. What is net sales revenue?", "explanation": "Net sales = 320,000 - 12,000 - 5,000 - 3,000 = 300,000. $296,000 wrongly deducts freight-out (a selling expense). $303,000 forgets sales discounts. $110,000 is gross profit, not net sales.", "trap": "Trap: only the three contra-revenue accounts are deducted to get net sales.", "klp": "T5: What does net sales revenue mean?", "source": "Sample final Q36 style, original numbers", "options": ["$110,000", "$296,000", "$300,000", "$303,000"], "answer": 2}, {"id": "T5-M17", "topic": "T5", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Sales Returns and Allowances and Sales Discounts are best described as:", "explanation": "These accounts carry debit balances and are subtracted from Sales Revenue on the income statement. They are not expenses, not contra-assets (that is the allowance for bad debts), and not liabilities.", "trap": "Trap: contra-revenue accounts are temporary and are closed at year-end.", "klp": "T5: Separate contra-revenue accounts for returns, allowances and discounts", "source": "Sample midterm SM28 style, original", "options": ["Contra-revenue accounts deducted from gross sales to arrive at net sales", "Operating expenses reported below gross profit", "Contra-asset accounts deducted from accounts receivable", "Liabilities owed to customers"], "answer": 0}, {"id": "T5-M18", "topic": "T5", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "Under a perpetual system, a company sells goods on account for $5,000 that cost $3,100. Which entries are recorded at the time of sale?", "explanation": "Perpetual means the inventory record is updated at every sale: revenue at selling price and COGS at cost, both immediately. Waiting until year-end is the periodic approach. Crediting Inventory for the selling price mixes price and cost. The last option uses Cash for a credit sale and reverses the cost entry.", "trap": "Trap: two entries at every sale under perpetual: one at price, one at cost.", "klp": "T5: When inventories are sold, costs move from Inventory (B/S) to COGS (I/S)", "source": "Sample midterm SM27 / E8-3 style, original numbers", "options": ["Dr Accounts Receivable 5,000 / Cr Sales Revenue 5,000 only; COGS is recorded at year-end", "Dr Accounts Receivable 5,000 / Cr Sales Revenue 5,000; and Dr Cost of Goods Sold 3,100 / Cr Inventory 3,100", "Dr Accounts Receivable 5,000 / Cr Inventory 5,000", "Dr Cash 5,000 / Cr Sales Revenue 5,000; and Dr Inventory 3,100 / Cr Cost of Goods Sold 3,100"], "answer": 1}, {"id": "T5-M19", "topic": "T5", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Keystone Books displays craft items supplied by a local artist on consignment. Keystone receives a commission when an item sells. Which statement is correct at Keystone's year-end?", "explanation": "Consigned goods remain the property of the consignor until sold to a final customer. The consignee holds them but does not own them, so it excludes them from its count. Neither party records a sale on delivery to the consignee.", "trap": "Trap: physical possession is not ownership; the consignor owns consigned goods.", "klp": "T5: Identify which inventory belongs to you (consigned goods)", "source": "Midterm MT8 / sample midterm SM31 style, original", "options": ["Keystone (the consignee) includes the unsold items in its inventory because they are in its shop.", "Both Keystone and the artist include the unsold items in inventory.", "The unsold items belong to the artist (consignor) and stay in the artist's inventory, not Keystone's.", "The artist records a sale when the items are delivered to Keystone."], "answer": 2}, {"id": "T5-M20", "topic": "T5", "priority": 3, "template": "plug", "weak_spot": false, "stem": "Harlow Ltd's physical count on December 31 totalled $150,000 at cost. The count included $12,000 of goods Harlow holds on consignment for another company. Not included were $20,000 of goods Harlow bought FOB shipping point that were in transit, and $8,000 of goods Harlow sold FOB destination that were in transit. What is Harlow's correct ending inventory?", "explanation": "150,000 - 12,000 (not Harlow's) + 20,000 (title passed to Harlow at shipping) + 8,000 (still Harlow's until delivered) = 166,000. $178,000 fails to remove the consigned goods. $158,000 forgets the FOB destination sale still belongs to Harlow. $146,000 forgets the FOB shipping point purchase.", "trap": "Trap: FOB shipping point: buyer owns in transit. FOB destination: seller owns in transit.", "klp": "T5: In-transit goods and consigned goods", "source": "Sample final Q41 / E8-2 style, original numbers", "options": ["$146,000", "$158,000", "$166,000", "$178,000"], "answer": 2}, {"id": "T5-M21", "topic": "T5", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A seller ships goods on December 30 with terms FOB destination; the goods reach the buyer on January 3. When does the seller recognize the revenue?", "explanation": "Under FOB destination, title and control pass on arrival, so revenue (and the removal of inventory) is recognized on delivery. Shipping date is the answer for FOB shipping point. Order date and payment date are never the trigger under accrual accounting.", "trap": "Trap: FOB destination at year-end = still the SELLER's inventory and no revenue yet.", "klp": "T5: FOB shipping point vs FOB destination; revenue recognition", "source": "Midterm MT29 style, original", "options": ["On December 30, when the goods leave the seller's warehouse", "On the date the buyer placed the order", "On the date the buyer pays the invoice", "On January 3, when the goods arrive at the buyer's location"], "answer": 3}, {"id": "T5-M22", "topic": "T5", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Goods shipped FOB shipping point are in transit at the buyer's year-end. Which party includes them in inventory?", "explanation": "FOB shipping point: ownership transfers at the seller's dock, so the buyer owns and counts the goods in transit (and the seller has already recorded the sale). The carrier never owns the goods. 'Neither' is impossible; someone always owns them.", "trap": "Trap: 'shipping point' = buyer owns the goods from the shipping point onward.", "klp": "T5: F.O.B. shipping point vs destination", "source": "Practice AP13 style, original", "options": ["The buyer, because title passed when the goods left the seller", "The seller, because the goods have not yet arrived", "The transport company, because it has physical possession", "Neither party until the goods are delivered"], "answer": 0}, {"id": "T5-M23", "topic": "T5", "priority": 3, "template": "price-direction", "weak_spot": false, "stem": "During a period of steadily RISING purchase prices, which inventory method reports the HIGHEST net income?", "explanation": "With rising prices, FIFO sends the oldest (cheapest) costs to COGS, giving the lowest COGS and the highest net income and ending inventory. LIFO does the opposite; average cost sits in between. The methods only give equal results when prices do not change.", "trap": "Trap: three switches to read: price direction, COGS/EI/NI, and highest/lowest.", "klp": "T5: How methods affect COGS, EI and NI in inflation and deflation", "source": "Sample midterm SM32 style, original", "options": ["LIFO", "FIFO", "Average cost", "All methods report the same net income"], "answer": 1}, {"id": "T5-M24", "topic": "T5", "priority": 3, "template": "price-direction", "weak_spot": false, "stem": "During a period of steadily FALLING purchase prices, which inventory method reports the LOWEST ending inventory on the balance sheet?", "explanation": "With falling prices the newest goods are the cheapest. FIFO leaves the newest (cheapest) costs in ending inventory, so FIFO gives the lowest EI (and the highest COGS). LIFO keeps the old, expensive costs in inventory, giving the highest EI. Average is in between. Specific identification depends on which units are sold.", "trap": "Trap: falling prices flip the usual FIFO/LIFO ranking.", "klp": "T5: Consider both increasing and decreasing prices", "source": "Sample final Q34 / midterm MT28 style, original", "options": ["LIFO", "Average cost", "FIFO", "Specific identification always gives the lowest"], "answer": 2}, {"id": "T5-M25", "topic": "T5", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Under which inventory cost flow method are the costs of the MOST RECENTLY purchased units the first to be charged to cost of goods sold?", "explanation": "LIFO = last-in, first-out: the newest costs go to COGS first. FIFO sends the oldest costs first. Average cost blends all costs. Specific identification tracks the actual unit sold.", "trap": "Trap: LIFO describes a COST flow assumption, not the physical movement of goods.", "klp": "T5: FIFO, LIFO and average cost", "source": "Midterm MT3 style, original", "options": ["FIFO", "Average cost", "Specific identification", "LIFO"], "answer": 3}, {"id": "T5-M26", "topic": "T5", "priority": 1, "template": "false-statement", "weak_spot": false, "stem": "Which statement about inventory cost flow methods is FALSE?", "explanation": "LIFO is NOT allowed under IFRS (and hence not in Singapore); FIFO and weighted average are the permitted methods. The other three statements are correct.", "trap": "Trap: LIFO is a US GAAP method; IFRS bans it.", "klp": "T5: Inventory methods (slide 54: LIFO not permitted under FRS 2)", "source": "Week 4 slide 54, original", "options": ["LIFO is permitted under IFRS and is the most common method used by Singapore-listed companies.", "Under the perpetual average-cost method, a new average cost per unit is computed after each purchase.", "A company may use a cost flow assumption that differs from the physical flow of its goods.", "In a period of rising prices, LIFO gives a lower ending inventory than FIFO."], "answer": 0}, {"id": "T5-M27", "topic": "T5", "priority": 1, "template": "formula", "weak_spot": false, "stem": "For the year: beginning inventory $40,000; purchases $260,000; purchase returns $6,000; purchase discounts $4,000; freight-in $10,000; ending inventory $50,000. What is cost of goods sold?", "explanation": "Net purchases = 260,000 - 6,000 - 4,000 + 10,000 = 260,000. Goods available = 40,000 + 260,000 = 300,000; less ending inventory 50,000 = COGS 250,000. $240,000 leaves out freight-in. $260,000 forgets to deduct returns and discounts. $230,000 subtracts freight-in instead of adding it.", "trap": "Trap: freight-in ADDS to purchases; returns and discounts SUBTRACT.", "klp": "T5: Cost of inventories; COGS", "source": "E8-11 style, original numbers", "options": ["$230,000", "$240,000", "$250,000", "$260,000"], "answer": 2}, {"id": "T5-M28", "topic": "T5", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which statement about the perpetual inventory system is FALSE?", "explanation": "Computing COGS once a year from a count is the periodic system. Under perpetual, COGS and Inventory are updated continuously; a count then checks the records against reality.", "trap": "Trap: perpetual = continuous record; periodic = year-end count plugs COGS.", "klp": "T5: Perpetual inventory system continuously updates the inventory account", "source": "Week 4 slide 30, original", "options": ["Under the perpetual system, the Inventory account is updated every time goods are bought or sold.", "Under the perpetual system, cost of goods sold is determined only once a year, after the physical count.", "A physical count is still useful under the perpetual system to detect shrinkage or errors.", "Under the perpetual system, the cost of goods sold is recorded at the time of each sale."], "answer": 1}, {"id": "T6-M01", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Orion Ltd bought a machine with a list price of $50,000 and received a 10% trade discount. It also paid freight $2,000, installation $3,000, test runs before use $1,000, staff training on the machine $4,000 and the first year's factory insurance $1,500. At what cost should the machine be recorded?", "options": ["$55,000", "$56,500", "$51,000", "$56,000"], "answer": 2, "explanation": "Cost = all costs to bring the machine to the point where it is ready for use: net price 45,000 + freight 2,000 + installation 3,000 + testing 1,000 = 51,000. Training (4,000) is an expense because staff are not the asset. Annual insurance (1,500) is a period cost after the asset is in use. 56,000 ignores the trade discount; the asset is recorded at the price actually paid.", "trap": "Training, launch parties and insurance after the asset is in use are expenses; use the net price after trade discount.", "klp": "T6 PP&E initial recognition: all costs to bring the asset to ready for intended use", "source": "Week 5 slide 7 (ABC sprinkler) style / original"}, {"id": "T6-M02", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Kestrel Co bought land with an old shed on it to build a new warehouse. Costs: purchase price $300,000; legal fees on the purchase $5,000; demolition of the shed $20,000; cash received for scrap from the demolition $4,000; grading and levelling $6,000; property tax for the months after purchase $3,000; construction cost of the new warehouse $450,000. What is the cost of the land?", "options": ["$327,000", "$331,000", "$330,000", "$311,000"], "answer": 0, "explanation": "Land = 300,000 + 5,000 + 20,000 - 4,000 + 6,000 = 327,000. Demolition of an unwanted building goes to land, net of any scrap proceeds. 331,000 forgets to deduct the scrap. 330,000 adds property tax for the period after purchase, which is an expense. 311,000 leaves out the demolition, which is a cost of getting the land ready. The warehouse cost is a separate asset (Building).", "trap": "Removing an old building is a LAND cost (net of salvage); post-purchase property tax is an expense.", "klp": "T6 PP&E initial recognition: all costs incurred to bring the asset to ready for use", "source": "Sample final Q30 style / Week 5 slide 5-6"}, {"id": "T6-M03", "topic": "T6", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Falcon Ltd paid $600,000 cash for land, a building and equipment in one deal. Independent market values: land $200,000, building $500,000, equipment $100,000. The seller's book values were land $100,000, building $420,000, equipment $80,000. What cost should Falcon record for the building?", "options": ["$500,000", "$420,000", "$150,000", "$375,000"], "answer": 3, "explanation": "Allocate the lump sum by relative market value: building = 600,000 x 500,000/800,000 = 375,000. 500,000 is the market value itself, but you only paid 600,000 in total, so each asset gets a share of what was paid. 420,000 is the seller's book value, which is irrelevant (note the seller's book values conveniently add to 600,000, a planted trap). 150,000 is the land allocation.", "trap": "Use relative MARKET values of the price PAID; ignore the seller's book values even if they add up to the price.", "klp": "T6 Basket purchase: use relative market values to allocate the total purchase price", "source": "Week 5 Rosenberg in-class exercise style / original"}, {"id": "T6-M04", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Equipment cost $90,000, residual value $10,000, useful life 8 years, straight-line method, bought on 1 January. What is the annual depreciation expense?", "options": ["$11,250", "$10,000", "$12,500", "$9,000"], "answer": 1, "explanation": "Straight-line = (Cost - Residual) / Useful life = (90,000 - 10,000) / 8 = 10,000. 11,250 forgets to subtract the residual value. 12,500 adds the residual instead of subtracting it. 9,000 is just 10% of cost with no basis.", "trap": "Subtract the residual value BEFORE dividing by useful life.", "klp": "T6 Allocation of cost: use the straight-line method", "source": "Week 5 slide 20 (Wheeler van) style / original"}, {"id": "T6-M05", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Heron Ltd bought a van on 1 September 2026 for $60,000. Residual value $6,000, useful life 5 years, straight-line, year-end 31 December. What is depreciation expense for 2026?", "options": ["$3,600", "$10,800", "$4,000", "$7,200"], "answer": 0, "explanation": "Annual depreciation = (60,000 - 6,000) / 5 = 10,800. The van was used for 4 months (Sept to Dec), so 2026 expense = 10,800 x 4/12 = 3,600. 10,800 charges a full year. 4,000 ignores the residual value. 7,200 counts 8 months (Jan to Aug) instead of the months the asset was actually in use.", "trap": "Count the months from the purchase date to year-end and multiply by months/12.", "klp": "T6 Allocation of cost: straight-line method (partial year)", "source": "Week 5 slide 23 / Sample final Q37 style"}, {"id": "T6-M06", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "On 1 April 2025 Juno Ltd bought equipment for $200,000 with a residual value of $20,000 and a 10-year useful life (straight-line, 31 December year-end). What is the carrying amount of the equipment on 31 December 2026?", "options": ["$164,000", "$168,500", "$182,000", "$165,000"], "answer": 1, "explanation": "Annual depreciation = (200,000 - 20,000) / 10 = 18,000. From 1 April 2025 to 31 December 2026 is 21 months, so accumulated depreciation = 18,000 x 21/12 = 31,500. Carrying amount = 200,000 - 31,500 = 168,500. 164,000 uses two full years. 182,000 uses only one year. 165,000 ignores the residual value.", "trap": "Carrying amount = cost minus accumulated depreciation for the MONTHS owned (9 + 12 = 21), not whole years.", "klp": "T6 What does PP&E, net mean; straight-line partial year", "source": "Sample final Q37 style / original"}, {"id": "T6-M07", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Use the following for this question and the next. Pelican Ltd bought a machine on 1 January 2024 for $150,000, residual value $30,000, useful life 6 years, straight-line, 31 December year-end. On 30 September 2026 Pelican sold the machine for $85,000 cash. What depreciation expense should Pelican record for 2026 before recording the sale?", "options": ["$20,000", "$18,750", "$15,000", "$5,000"], "answer": 2, "explanation": "Annual depreciation = (150,000 - 30,000) / 6 = 20,000. The machine was used for 9 months of 2026 (Jan to Sept): 20,000 x 9/12 = 15,000. 20,000 is a full year. 18,750 ignores the residual value. 5,000 uses the 3 months AFTER the sale instead of the 9 months before it.", "trap": "Before any disposal, bring depreciation up to the disposal date (9 months here).", "klp": "T6 Disposal: first calculate depreciation up to the sale date", "source": "Sample final Q28 style (linked pair) / Rosenberg part 3"}, {"id": "T6-M08", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Refer to the Pelican Ltd information above. What gain or loss should Pelican recognise on the sale on 30 September 2026?", "options": ["Loss of $25,000", "Gain of $10,000", "Loss of $65,000", "Loss of $10,000"], "answer": 3, "explanation": "Accumulated depreciation at the sale date = 2024 20,000 + 2025 20,000 + 2026 15,000 = 55,000. Book value = 150,000 - 55,000 = 95,000. Proceeds 85,000 are below book value, so loss = 95,000 - 85,000 = 10,000. A loss of 25,000 forgets the 2026 depreciation (book value 110,000). A gain of 10,000 has the direction reversed. A loss of 65,000 compares proceeds with cost instead of book value. Entry: Dr Cash 85,000, Dr Accumulated Depreciation 55,000, Dr Loss on Sale 10,000 / Cr Machine 150,000.", "trap": "Gain or loss = proceeds minus BOOK VALUE (cost less accumulated depreciation to the sale date), never proceeds minus cost.", "klp": "T6 Disposal: calculate the gain or loss on sale of PP&E", "source": "Sample final Q28 style (linked pair) / Maxwell self-practice"}, {"id": "T6-M09", "topic": "T6", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Equipment that cost $40,000 and has accumulated depreciation of $36,000 is scrapped with no proceeds. What is recorded?", "options": ["No gain or loss, because nothing was received", "Loss on disposal of $40,000", "Gain on disposal of $4,000", "Loss on disposal of $4,000"], "answer": 3, "explanation": "Book value = 40,000 - 36,000 = 4,000. Nothing is received, so the whole remaining book value is a loss: Dr Accumulated Depreciation 36,000, Dr Loss on Disposal 4,000 / Cr Equipment 40,000. 'No gain or loss' is only true when the asset is fully depreciated with zero residual (book value zero). A loss of 40,000 ignores the accumulated depreciation already expensed. A gain is impossible when proceeds are zero and book value is positive.", "trap": "Scrapping with zero proceeds: loss = remaining book value; only a fully depreciated asset gives no gain or loss.", "klp": "T6 Disposal: journal entry to record disposal of PP&E", "source": "Week 5 slide 34 (Wheeler scrap) style / original"}, {"id": "T6-M10", "topic": "T6", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Sparrow Ltd bought equipment for $120,000 on 1 January 2022 (residual $20,000, life 10 years, straight-line). At the start of 2026, after 4 years, Sparrow decides the TOTAL useful life is only 8 years and the residual value is $8,000. What is depreciation expense for 2026?", "options": ["$9,000", "$14,000", "$18,000", "$10,000"], "answer": 2, "explanation": "Step 1: book value at the change date = 120,000 - 4 x 10,000 = 80,000. Step 2: spread (book value - new residual) over the REMAINING life: (80,000 - 8,000) / (8 - 4) = 18,000. 9,000 divides by the new total life instead of the remaining 4 years. 14,000 restates from original cost, but prior years are never restated. 10,000 ignores the change.", "trap": "'Total life of 8 years' means 4 years REMAIN; apply the change prospectively from book value, no restatement.", "klp": "T6 change in depreciation estimates (Week 5 slides 25-27, Bodie exercise)", "source": "Week 5 Bodie in-class practice style / original"}, {"id": "T6-M11", "topic": "T6", "priority": 2, "template": "formula", "weak_spot": false, "stem": "On 1 January 2026 Lark Ltd bought a patent for $96,000 and paid $24,000 of legal fees to register it. The patent has 20 years of legal life left, but Lark expects to use it for only 10 years. Straight-line, zero residual. What is the 2026 amortisation expense?", "options": ["$12,000", "$6,000", "$9,600", "$4,800"], "answer": 0, "explanation": "Cost of the patent = 96,000 + 24,000 = 120,000 (all costs to acquire it). Amortise over the SHORTER of legal life and useful life, so 120,000 / 10 = 12,000. 6,000 uses the legal life. 9,600 leaves out the registration fees. 4,800 makes both mistakes. Entry: Dr Amortisation Expense 12,000 / Cr Patent 12,000.", "trap": "Amortise over the SHORTER of legal and useful life, and include registration fees in cost.", "klp": "T6 Intangibles: straight-line amortisation, zero residual", "source": "Sample final Q27 style / original"}, {"id": "T6-M12", "topic": "T6", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Vega Corp pays $3,000,000 cash for 100% of Mira Ltd. Mira's assets have a book value of $2,200,000 and a market (fair) value of $2,600,000. Mira's liabilities are $900,000. How much goodwill does Vega record?", "options": ["$1,700,000", "$1,300,000", "$400,000", "$800,000"], "answer": 1, "explanation": "Goodwill = purchase price - market value of net assets = 3,000,000 - (2,600,000 - 900,000) = 1,300,000. 1,700,000 uses the BOOK value of assets. 400,000 forgets to deduct the liabilities taken over. 800,000 makes both mistakes. Entry: Dr Assets 2,600,000, Dr Goodwill 1,300,000 / Cr Liabilities 900,000, Cr Cash 3,000,000.", "trap": "Net assets = MARKET value of assets minus liabilities; the book value of assets is the planted distractor.", "klp": "T6 Goodwill = purchase price minus market value of net assets", "source": "Sample final Q14 / PepsiCo-Kettle example style"}, {"id": "T6-M13", "topic": "T6", "priority": 3, "template": "missed-adjustment", "weak_spot": false, "stem": "Ibis Ltd paid $50,000 to add a second storage deck to a delivery truck, which increased the truck's capacity. The bookkeeper debited Repairs Expense. Ignoring depreciation, what is the effect on the current year's financial statements?", "options": ["Assets overstated by $50,000; net income overstated by $50,000", "No effect on assets or net income because cash was paid either way", "Assets understated by $50,000; net income understated by $50,000", "Assets understated by $50,000; net income overstated by $50,000"], "answer": 2, "explanation": "Adding capacity is a capital expenditure: it should have been debited to Truck (asset). Expensing it makes expenses 50,000 too high, so net income and equity are 50,000 too low, and the asset is 50,000 too low. Overstated/overstated is the WorldCom direction (capitalising what should be expensed). 'No effect' is wrong because the choice changes where the cost sits (B/S vs I/S). Understated assets with overstated income is impossible here: both move the same way.", "trap": "Wrongly EXPENSING a capital item understates both assets and NI; wrongly CAPITALISING (WorldCom) overstates both.", "klp": "T6 Subsequent expenditure: capitalise vs expense and effect on asset value and net income", "source": "Sample final Q5 style / Week 5 slides 10-12"}, {"id": "T6-M14", "topic": "T6", "priority": 2, "template": "plug", "weak_spot": false, "stem": "At 1 January 2026 Osprey Ltd had equipment costing $500,000 with accumulated depreciation of $180,000. Depreciation expense for 2026 is $50,000 and there were no purchases or disposals. What is 'Equipment, net' on the 31 December 2026 balance sheet?", "options": ["$270,000", "$320,000", "$450,000", "$230,000"], "answer": 0, "explanation": "Ending accumulated depreciation = 180,000 + 50,000 = 230,000. Equipment, net = cost - accumulated depreciation = 500,000 - 230,000 = 270,000. 320,000 forgets the current year's depreciation. 450,000 subtracts only this year's expense instead of the accumulated total. 230,000 is the accumulated depreciation balance, not the net asset.", "trap": "'Net' means cost less the ACCUMULATED (cumulative) depreciation, not less one year's expense.", "klp": "T6 What does PP&E, net mean", "source": "original (T-account plug)"}, {"id": "T6-M15", "topic": "T6", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "Equipment with a cost of $50,000 and accumulated depreciation of $35,000 (already updated to the sale date) is sold for $18,000 cash. Which journal entry records the sale?", "options": ["Dr Cash 18,000, Dr Loss on Sale 32,000 / Cr Equipment 50,000", "Dr Cash 18,000, Dr Accumulated Depreciation 35,000 / Cr Equipment 50,000, Cr Gain on Sale 3,000", "Dr Cash 18,000 / Cr Equipment 15,000, Cr Gain on Sale 3,000", "Dr Cash 18,000, Dr Accumulated Depreciation 32,000 / Cr Equipment 50,000"], "answer": 1, "explanation": "Book value = 50,000 - 35,000 = 15,000; proceeds 18,000 exceed it, so gain = 3,000. The entry removes the asset at COST (50,000) and removes the full accumulated depreciation (35,000). The entry with a loss of 32,000 ignores accumulated depreciation. Crediting Equipment for only 15,000 leaves the cost and accumulated depreciation partly on the books. Debiting accumulated depreciation of 32,000 plugs the entry to avoid showing the gain.", "trap": "Remove the asset at cost AND its accumulated depreciation; the gain or loss is the plug.", "klp": "T6 Disposal: journal entry to record sale of PP&E", "source": "Week 5 slide 36 style / original"}, {"id": "T6-M16", "topic": "T6", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about property, plant and equipment (PP&E) is FALSE?", "options": ["PP&E are tangible, long-lived assets bought for use in operations, not for resale.", "The cost of PP&E includes all costs needed to bring the asset to the point where it is ready for its intended use.", "Depreciation allocates the cost of PP&E over its useful life as an application of the matching principle.", "Freehold land is depreciated over the period the company expects to use it."], "answer": 3, "explanation": "Land has an unlimited life, so it is never depreciated; only buildings, equipment and similar assets are. The other three statements are the textbook definitions: PP&E is used in operations, cost is the 'all costs to ready for use' rule, and depreciation matches cost to the periods that benefit.", "trap": "Land is NEVER depreciated; the building on it is.", "klp": "T6 PP&E definition and initial recognition", "source": "Week 5 slide 2 / original"}, {"id": "T6-M17", "topic": "T6", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following costs should NOT be included in the cost of a new machine?", "options": ["Insurance on the machine while it is in transit to the factory", "Cost of wiring and installing the machine", "Cost of training employees to operate the machine", "Sales tax paid on the purchase"], "answer": 2, "explanation": "Training is an expense: the employees, not the machine, benefit, and the cost is not needed to make the machine itself ready for use. Insurance in transit, dismantling the old machine (needed to install the new one) and sales tax are all costs of bringing the asset to its intended use and are capitalised.", "trap": "Anything spent on PEOPLE (training) or celebrations is an expense; costs on the ASSET before use are capitalised.", "klp": "T6 PP&E initial recognition: all costs incurred to bring the asset to ready for use", "source": "Week 5 slide 7 (ABC sprinkler) / original"}, {"id": "T6-M18", "topic": "T6", "priority": 2, "template": "classification", "weak_spot": false, "stem": "A company buys a plot of land with an old warehouse on it and immediately demolishes the warehouse to build a new factory. The demolition cost should be:", "options": ["Added to the cost of the new factory building", "Added to the cost of the land", "Expensed immediately as a loss on disposal of the warehouse", "Recorded as a separate intangible asset"], "answer": 1, "explanation": "The demolition was needed to get the LAND ready for its intended use, so it is part of the land's cost (net of any salvage proceeds). It is not a building cost (the new factory's cost is architect fees, construction, materials and so on) and not a loss, because the company never intended to use the warehouse.", "trap": "Removing an unwanted building = land cost, not building cost and not an expense.", "klp": "T6 PP&E initial recognition (land vs building)", "source":
