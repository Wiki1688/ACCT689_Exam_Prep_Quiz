 "Week 5 slide 5 / Sample final Q30 concept"}, {"id": "T6-M19", "topic": "T6", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following expenditures on a delivery truck already in use should be CAPITALISED (debited to the asset)?", "options": ["A major engine overhaul that extends the truck's useful life by three years", "Replacing worn tyres", "Regular oil change and lubrication", "Repainting the truck in the company colours"], "answer": 0, "explanation": "A capital expenditure increases capacity, efficiency or useful life, so the overhaul is added to the asset and depreciated over the remaining life. Tyres, oil changes and paint only maintain the truck in working order and are revenue expenditures (Repairs and Maintenance Expense) in the period incurred.", "trap": "Ask: does it extend life or capacity? Yes = asset; no (maintain/restore) = expense.", "klp": "T6 Subsequent expenditure: capitalise or expense", "source": "Week 5 slide 10 / original"}, {"id": "T6-M20", "topic": "T6", "priority": 2, "template": "principle", "weak_spot": false, "stem": "WorldCom recorded billions of dollars of ordinary operating costs as PP&E. Ignoring depreciation, what was the effect on WorldCom's financial statements in the year of the error?", "options": ["Assets understated and net income understated", "Assets overstated and net income understated", "No effect, because total cash paid was the same either way", "Assets overstated and net income overstated"], "answer": 3, "explanation": "Capitalising a cost that should be expensed keeps the cost out of the income statement, so expenses are too low and net income (and equity) too high, while PP&E is too high. Understated/understated is the opposite error (expensing a capital item). Cash is the same either way, but the classification changes assets and profit.", "trap": "Wrongly capitalising = assets AND profit overstated (the WorldCom fraud).", "klp": "T6 Subsequent expenditure: how capitalising vs expensing affects assets and net income", "source": "Week 5 slide 12 / original"}, {"id": "T6-M21", "topic": "T6", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "Which journal entry records annual straight-line depreciation of $7,000 on a building?", "options": ["Dr Depreciation Expense 7,000 / Cr Building 7,000", "Dr Accumulated Depreciation, Building 7,000 / Cr Depreciation Expense 7,000", "Dr Depreciation Expense 7,000 / Cr Accumulated Depreciation, Building 7,000", "Dr Depreciation Expense 7,000 / Cr Cash 7,000"], "answer": 2, "explanation": "Depreciation is an end-of-period adjusting entry: debit the expense (income statement) and credit the contra-asset Accumulated Depreciation (balance sheet). Crediting Building directly loses the original cost. The reversed entry reduces the expense. Crediting Cash is impossible: depreciation is an allocation, no cash moves, and adjusting entries never touch cash.", "trap": "Credit ACCUMULATED DEPRECIATION, not the asset and never Cash.", "klp": "T6 What is the journal entry to record depreciation", "source": "Week 5 slide 13/21 / original"}, {"id": "T6-M22", "topic": "T6", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Why do companies record depreciation in a separate Accumulated Depreciation account instead of crediting the PP&E account directly?", "options": ["To keep the asset's actual original cost visible while showing separately the estimated depreciation recorded so far, in the same way an allowance account is used for receivables", "Because Accumulated Depreciation is a liability that must be settled when the asset is replaced", "Because Accumulated Depreciation represents cash saved up to buy a replacement asset", "Because crediting the asset directly would make total assets too low"], "answer": 0, "explanation": "Cost is an actual, reliable number; depreciation is an estimate (useful life and residual value are guesses). Keeping them in separate accounts lets users see both, exactly like Accounts Receivable and the Allowance for Doubtful Accounts. Accumulated Depreciation is a contra-asset, not a liability and not cash. Total assets are the same whichever way you record it (cost less accumulated depreciation = net).", "trap": "Accumulated Depreciation = contra-asset that separates the ESTIMATE from the ACTUAL cost; it is not cash and not a liability.", "klp": "T6 Why do we use Accumulated Depreciation rather than reduce PP&E directly", "source": "Sample final Q23 style / Week 5 slide 14"}, {"id": "T6-M23", "topic": "T6", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about Accumulated Depreciation is FALSE?", "options": ["It is a contra-asset account with a normal credit balance.", "It is reported in the liabilities section because it has a credit balance.", "It is deducted from the cost of PP&E to give the carrying amount (PP&E, net).", "Its balance grows each year as depreciation expense is recorded, until the asset is disposed of."], "answer": 1, "explanation": "A credit balance does not make an account a liability. Accumulated Depreciation is an asset-side account that reduces PP&E; the company owes nobody anything. The other statements are correct: contra-asset, deducted to get net book value, and it accumulates until the asset is removed from the books.", "trap": "Credit balance does not equal liability; contra-assets (allowance, accumulated depreciation) sit under assets.", "klp": "T6 Accumulated Depreciation is a contra-asset account with a credit balance", "source": "Sample final Q20 pattern applied to T6 / original"}, {"id": "T6-M24", "topic": "T6", "priority": 2, "template": "principle", "weak_spot": false, "stem": "On the balance sheet, 'Property, plant and equipment, net' means:", "options": ["The current market value of the assets", "The original cost of the assets less the current year's depreciation expense", "The amount the company expects to receive if it sold the assets today", "The original cost of the assets less the accumulated depreciation recorded to date"], "answer": 3, "explanation": "PP&E, net (carrying amount or book value) = cost - accumulated depreciation. It is a cost-based number, not a market or resale value. Subtracting only the current year's expense ignores depreciation from earlier years.", "trap": "'Net' = cost minus ALL depreciation to date; it is not market value.", "klp": "T6 On the balance sheet, what does PP&E, net mean", "source": "Week 5 slide 13/15 / original"}, {"id": "T6-M25", "topic": "T6", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Depreciation of a factory machine is best described as an application of which accounting principle or assumption?", "options": ["Going concern assumption: the machine will be sold at the end of its life", "Cost principle: the machine must be written down to its current market value each year", "Monetary unit assumption: depreciation adjusts the asset for inflation", "Matching principle: the machine's cost is spread over the periods in which it helps generate revenue"], "answer": 3, "explanation": "Depreciation moves cost from the balance sheet to expense as the asset is used up to earn revenue, which is matching. Going concern is about the business continuing, not about selling assets. The cost principle keeps assets at historical cost, not market value. Depreciation has nothing to do with inflation.", "trap": "Depreciation is cost ALLOCATION (matching), not valuation.", "klp": "T6 Allocation of cost / matching principle", "source": "Week 5 slide 2 fill-in-the-blank / original"}, {"id": "T6-M26", "topic": "T6", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Two years after buying a machine, a company realises the machine will last longer than originally estimated. How should this change be handled?", "options": ["Spread the remaining book value (less any new residual value) over the revised remaining life, with no change to prior years", "Restate the depreciation expense of the previous two years and adjust opening retained earnings", "Ignore the new information and continue with the original depreciation schedule", "Recognise a gain equal to the depreciation that would not have been charged under the new estimate"], "answer": 0, "explanation": "A change in an accounting estimate is applied prospectively: compute the book value at the change date and depreciate it over the remaining revised life. Prior periods were based on the best information available then, so they are not restated. Ignoring new information would misstate future expense, and no gain is recognised for an estimate revision.", "trap": "Changes in estimates: no restatement, no gain; new expense = (book value - new residual) / REMAINING life.", "klp": "T6 change in depreciation estimates (prospective)", "source": "Week 5 slide 25 / original"}, {"id": "T6-M27", "topic": "T6", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about intangible assets is FALSE?", "options": ["A patent with a finite life is amortised, usually straight-line with zero residual value.", "Goodwill is amortised on a straight-line basis over its estimated useful life.", "A trademark with an indefinite life is not amortised but is tested for impairment at least annually.", "Goodwill is recorded only when one company buys another; internally generated goodwill is never recorded."], "answer": 1, "explanation": "Goodwill has an indefinite life: it is NOT amortised but is tested for impairment every year (to avoid overstating assets and profit). Finite-life intangibles are amortised straight-line, zero residual. Indefinite-life trademarks are impairment-tested. Goodwill arises only in an acquisition.", "trap": "Goodwill and indefinite-life intangibles: impairment test, never amortisation.", "klp": "T6 Indefinite-life intangibles (goodwill, certain trademarks): test for impairment annually", "source": "Sample final Q48 style / original"}, {"id": "T6-M28", "topic": "T6", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Under IFRS, how are research costs and development costs treated?", "options": ["Both research and development costs are always expensed", "Both research and development costs are always capitalised", "Research costs are expensed; development costs are capitalised when the recognition criteria are met", "Research costs are capitalised; development costs are expensed"], "answer": 2, "explanation": "Research is too uncertain (feasibility and future benefit unknown), so it is expensed. Development has more certainty, so it is capitalised as an intangible if the criteria (technical feasibility, intention and ability to complete, probable benefits, reliable measurement) are met. Expensing both is the US GAAP rule, which is not tested. Capitalising both or reversing the treatment is wrong.", "trap": "IFRS: Research = expense; Development = capitalise (if criteria met). Do not reverse them.", "klp": "T6 R&D: under IFRS research costs are expensed, development costs are capitalised", "source": "Week 5 slide 48 / Sample final Q48-B"}, {"id": "T6-M29", "topic": "T6", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Which of the following may be recognised as an intangible asset on the balance sheet?", "options": ["The strong reputation of the company's founder", "A brand name purchased from another company for $2 million", "A brand name the company built itself through 20 years of advertising", "The skills and experience of the company's workforce"], "answer": 1, "explanation": "Only a PURCHASED brand is recognised, because the cost paid is reliable evidence of its value. Internally built brands, reputation and human capital bring future benefits, but their value is subjective and cannot be measured reliably, so they fail the reliability test. Economic value alone does not make something an asset.", "trap": "Internally generated brands, reputation and people are never assets; purchased brands are.", "klp": "T6 Intangibles initial recognition; items not recognised as assets (reliability)", "source": "Week 5 slides 44 and 49 / original"}, {"id": "T6-M30", "topic": "T6", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A company sells a machine part-way through the year. What is the correct order of steps to record the sale?", "options": ["Record depreciation up to the sale date, compute the book value, then remove the cost and accumulated depreciation and record any gain or loss", "Remove the cost from the books, then compare the proceeds with the original cost to find the gain or loss", "Compare the proceeds with last year-end's book value and record the gain or loss, with no further depreciation", "Record the proceeds as revenue and the original cost as cost of goods sold"], "answer": 0, "explanation": "First update depreciation to the disposal date so the book value is current. Gain or loss = proceeds - updated book value. Comparing with cost ignores depreciation; using last year-end's book value misses the current year's months of use (the classic trap). Selling PP&E is not a sale of inventory, so there is no revenue or COGS, only a gain or loss.", "trap": "Update depreciation FIRST; gain/loss uses the book value at the sale date.", "klp": "T6 Disposal: first calculate depreciation up to the sale date", "source": "Week 5 slide 33 / original"}, {"id": "T6-M31", "topic": "T6", "priority": 2, "template": "no-change", "weak_spot": false, "stem": "Equipment with a book value of $12,000 (after updating depreciation) is sold for exactly $12,000 cash. Which statement is correct?", "options": ["A gain of $12,000 is recognised because cash was received", "A loss is recognised equal to the asset's original cost", "No gain or loss is recognised; the asset and its accumulated depreciation are removed from the books", "Revenue of $12,000 is recognised"], "answer": 2, "explanation": "Gain or loss = proceeds - book value = 12,000 - 12,000 = 0. The entry still removes the cost (credit) and the accumulated depreciation (debit), with Cash debited for 12,000. Cash received is not a gain by itself; the gain is only the excess over book value. Selling used PP&E is not revenue.", "trap": "Proceeds = book value gives NO gain or loss (the 'no change' answer).", "klp": "T6 Disposal: gain or loss on sale of PP&E", "source": "original ('no change' pattern)"}, {"id": "T6-M32", "topic": "T6", "priority": 2, "template": "adjusting-je", "weak_spot": false, "stem": "Which journal entry records annual amortisation of $5,000 on a purchased franchise with a finite life?", "options": ["Dr Franchise 5,000 / Cr Amortisation Expense 5,000", "Dr Amortisation Expense 5,000 / Cr Cash 5,000", "Dr Impairment Loss 5,000 / Cr Franchise 5,000", "Dr Amortisation Expense 5,000 / Cr Franchise 5,000"], "answer": 3, "explanation": "Finite-life intangibles are amortised straight-line; the slides credit the intangible directly (crediting Accumulated Amortisation is also acceptable). The reversed entry increases the asset. Cash is never part of an adjusting entry. Impairment is a different event (carrying amount above recoverable amount), not the routine annual allocation.", "trap": "Amortisation entry mirrors depreciation; credit the intangible (or Accumulated Amortisation), never Cash.", "klp": "T6 Finite-life intangibles: Dr Amortisation Expense; Cr Specific Intangible Asset", "source": "Week 5 slide 43 / original"}, {"id": "T7-M01", "topic": "T7", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "On 1 October 2026 Comet Ltd borrowed $90,000 from a bank on a 6-month, 8% note payable. Principal and interest are due at maturity. Comet's year-end is 31 December. What adjusting entry is needed on 31 December 2026?", "options": ["Dr Interest Expense 3,600 / Cr Interest Payable 3,600", "Dr Interest Expense 1,800 / Cr Notes Payable 1,800", "Dr Interest Expense 1,800 / Cr Interest Payable 1,800", "Dr Interest Payable 1,800 / Cr Interest Expense 1,800"], "answer": 2, "explanation": "Interest accrued for Oct, Nov, Dec = 90,000 x 8% x 3/12 = 1,800. It is an accrued expense: Dr Interest Expense / Cr Interest Payable. 3,600 is the full 6-month interest, but only 3 months have passed. Crediting Notes Payable mixes interest with principal; interest owed goes to Interest Payable. The reversed entry reduces the expense.", "trap": "Accrue only the months elapsed (P x r x months/12); credit Interest PAYABLE, not Notes Payable and not Cash.", "klp": "T8(KLP) (a) adjusting entry for interest on a note payable due next period", "source": "Sample final Q25 style / NewsWeek in-class"}, {"id": "T7-M02", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": true, "stem": "Drake Ltd signed a one-year, 5% note payable for $240,000 on 1 June 2026. No interest has been paid. How much interest expense should Drake accrue at its 31 December 2026 year-end?", "options": ["$7,000", "$12,000", "$5,000", "$1,000"], "answer": 0, "explanation": "June to December is 7 months: 240,000 x 5% x 7/12 = 7,000. 12,000 is a full year's interest, but the note has only run 7 months. 5,000 counts the 5 months remaining to maturity instead of the months elapsed. 1,000 is one month's interest. Entry: Dr Interest Expense 7,000 / Cr Interest Payable 7,000.", "trap": "Count months from the signing date to year-end (June to Dec = 7), not the months left to maturity.", "klp": "T8(KLP) (a) interest expense incurred during the current period on a note payable", "source": "original"}, {"id": "T7-M03", "topic": "T7", "priority": 2, "template": "transaction-je", "weak_spot": true, "stem": "Elm Ltd signed a one-year, 10% note payable for $60,000 on 1 November 2026 and correctly accrued $1,000 of interest at 31 December 2026. What entry does Elm record when it pays the note plus all interest on 31 October 2027?", "options": ["Dr Notes Payable 60,000, Dr Interest Expense 6,000 / Cr Cash 66,000", "Dr Notes Payable 60,000, Dr Interest Payable 1,000, Dr Interest Expense 5,000 / Cr Cash 66,000", "Dr Notes Payable 66,000 / Cr Cash 66,000", "Dr Notes Payable 60,000, Dr Interest Payable 6,000 / Cr Cash 66,000"], "answer": 1, "explanation": "Total interest for the year = 60,000 x 10% = 6,000. 1,000 was already expensed and sits in Interest Payable (Nov to Dec 2026); the 2027 portion (Jan to Oct, 10 months) = 5,000 is this year's expense. Cash paid = 60,000 + 6,000 = 66,000. Expensing all 6,000 in 2027 double counts the 2026 portion. Debiting Notes Payable for everything treats interest as principal. Debiting Interest Payable for the full year ignores that only 1,000 was ever accrued.", "trap": "At payment, clear LAST year's Interest Payable and expense only THIS year's months.", "klp": "T8(KLP) (a) accrued interest on notes payable; Topic 7 slide 6", "source": "Week 6 NewsWeek entry 5 / slide 6 style"}, {"id": "T7-M04", "topic": "T7", "priority": 2, "template": "formula", "weak_spot": false, "stem": "A retailer collected $53,000 in cash from customers, which INCLUDES 6% GST. What amount should be credited to Sales Tax Payable?", "options": ["$3,180", "$49,820", "$56,180", "$3,000"], "answer": 3, "explanation": "The 53,000 already contains the tax, so split it: sales = 53,000 / 1.06 = 50,000; tax = 53,000 - 50,000 = 3,000 (check: 50,000 x 6% = 3,000). 3,180 wrongly applies the rate to the tax-inclusive total. 49,820 is the wrong sales figure. 56,180 adds tax on top of a total that already includes it. Entry: Dr Cash 53,000 / Cr Sales Revenue 50,000, Cr Sales Tax Payable 3,000.", "trap": "'Including GST' means DIVIDE by 1.06; 'earned $X' means ADD 6% on top. Sales tax is never revenue.", "klp": "T8(KLP) identify a liability by name (sales tax payable); Topic 7 slide 9", "source": "NewsWeek entry 2 style / original"}, {"id": "T7-M05", "topic": "T7", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "A store EARNED sales of $80,000 for cash, and must collect 8% sales tax on top for the government. Which entry records the sales?", "options": ["Dr Cash 86,400 / Cr Sales Revenue 86,400", "Dr Cash 80,000 / Cr Sales Revenue 73,600, Cr Sales Tax Payable 6,400", "Dr Cash 86,400 / Cr Sales Revenue 80,000, Cr Sales Tax Payable 6,400", "Dr Cash 86,400, Dr Sales Tax Expense 6,400 / Cr Sales Revenue 86,400"], "answer": 2, "explanation": "'Earned 80,000' is the pre-tax sales figure, so tax = 80,000 x 8% = 6,400 is added on top and cash collected = 86,400. The tax belongs to the government: it is a liability (Sales Tax Payable), never revenue and never the store's expense. Crediting all 86,400 to revenue overstates sales. Splitting 80,000 as if it were tax-inclusive misreads 'earned'. A Sales Tax Expense account is wrong because the customer, not the store, bears the tax.", "trap": "Sales tax collected = liability to the government; it is not revenue and not an expense.", "klp": "T8(KLP) identify liabilities; Topic 7 slide 9 sales tax payable", "source": "Topic 7 slide 9 style / original"}, {"id": "T7-M06", "topic": "T7", "priority": 2, "template": "adjusting-je", "weak_spot": false, "stem": "On 1 September 2026 Fir Ltd received $24,000 in advance for a 12-month maintenance contract and credited Unearned Revenue. What adjusting entry is needed at 31 December 2026?", "options": ["Dr Unearned Revenue 24,000 / Cr Service Revenue 24,000", "Dr Service Revenue 8,000 / Cr Unearned Revenue 8,000", "Dr Cash 8,000 / Cr Service Revenue 8,000", "Dr Unearned Revenue 8,000 / Cr Service Revenue 8,000"], "answer": 3, "explanation": "By 31 December, 4 of 12 months of service have been delivered: 24,000 x 4/12 = 8,000 is earned. The liability falls and revenue rises. Recognising all 24,000 ignores the 8 months still owed to the customer. The reversed entry moves revenue back into the liability. Cash was received in September; adjusting entries never involve cash.", "trap": "Unearned revenue is a LIABILITY; recognise only the months delivered (4/12), never cash in the adjusting entry.", "klp": "T8(KLP) unearned revenue: adjusting entry to record revenue earned by period-end", "source": "Midterm Q7 weakness / NewsWeek entry 4b style"}, {"id": "T7-M07", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Use the following for this question and the next. Grove Ltd sells products with a one-year warranty and estimates warranty costs at 4% of sales. Sales in 2026 were $600,000. The Provision for Warranty Repairs had a credit balance of $9,000 on 1 January 2026, and Grove paid $20,000 in cash and parts to settle claims during 2026. What is warranty expense for 2026?", "options": ["$20,000", "$24,000", "$11,000", "$33,000"], "answer": 1, "explanation": "Warranty expense is the ESTIMATE recorded in the year of sale (matching): 600,000 x 4% = 24,000. Entry: Dr Warranty Expense 24,000 / Cr Provision for Warranty Repairs 24,000. 20,000 is the cash paid on claims, which reduces the provision but is not the expense. 11,000 and 33,000 mix the expense with the opening balance.", "trap": "Expense = % x sales (the estimate), NOT the claims paid.", "klp": "T8(KLP) journal entries to record warranty expense as a % of sales", "source": "Sample final Q12 / Ross Inc in-class (linked pair)"}, {"id": "T7-M08", "topic": "T7", "priority": 3, "template": "plug", "weak_spot": false, "stem": "Refer to the Grove Ltd information above. What is the balance of the Provision for Warranty Repairs on 31 December 2026?", "options": ["$13,000", "$24,000", "$33,000", "$4,000"], "answer": 0, "explanation": "T-account: opening 9,000 + expense accrued 24,000 - claims settled 20,000 = 13,000. Claims are recorded as Dr Provision / Cr Cash or Inventory, with no expense. 24,000 is the expense, not the liability. 33,000 forgets that claims paid reduce the provision. 4,000 forgets the opening balance.", "trap": "Ending provision = Beginning + Expense - Claims paid; claims paid never touch the expense.", "klp": "T8(KLP) warranty: record product replacement or cash compensation when a claim is made", "source": "Sample final Q12 / Ross Inc in-class (linked pair)"}, {"id": "T7-M09", "topic": "T7", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "A customer returns a faulty product under warranty and the company replaces a part from inventory costing $3,500. Which entry records the repair?", "options": ["Dr Warranty Expense 3,500 / Cr Inventory 3,500", "Dr Warranty Expense 3,500 / Cr Provision for Warranty Repairs 3,500", "Dr Provision for Warranty Repairs 3,500 / Cr Inventory 3,500", "Dr Cost of Goods Sold 3,500 / Cr Inventory 3,500"], "answer": 2, "explanation": "The expense was already recognised (as an estimate) when the product was sold. Settling a claim uses up the provision: Dr Provision / Cr Inventory (parts) or Cash (refund). Debiting Warranty Expense again would double count. Dr Expense / Cr Provision is the accrual entry at the time of SALE, not the repair. COGS is for goods sold to customers, not warranty parts.", "trap": "At the claim, debit the PROVISION, not the expense.", "klp": "T8(KLP) warranty claim: product replacement or cash compensation entry", "source": "Topic 7 slide 17 / original"}, {"id": "T7-M10", "topic": "T7", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Use the following for this question and the next. On 1 January 2026 Hazel Ltd borrowed $300,000 on a 4-year, 5% instalment note. Equal payments of $84,600 are due each 31 December. How much of the FIRST payment (31 December 2026) reduces the principal?", "options": ["$15,000", "$69,600", "$84,600", "$73,080"], "answer": 1, "explanation": "Year 1 interest = beginning unpaid principal x rate = 300,000 x 5% = 15,000. Principal reduction = payment - interest = 84,600 - 15,000 = 69,600. Unpaid balance after the payment = 300,000 - 69,600 = 230,400. 15,000 is the interest portion. 84,600 is the whole payment. 73,080 is the year-2 principal portion.", "trap": "Interest = OPENING balance x rate; principal = payment - interest.", "klp": "T8(KLP) instalment notes: interest = beginning unpaid principal x rate; principal = payment - interest", "source": "Sample final Q21 style / ABC Corp in-class (linked pair)"}, {"id": "T7-M11", "topic": "T7", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Refer to the Hazel Ltd information above. How much interest expense does Hazel recognise for 2027 (the second year)?", "options": ["$11,520", "$15,000", "$73,080", "$69,600"], "answer": 0, "explanation": "Recompute the unpaid principal first: 300,000 - 69,600 = 230,400. Year 2 interest = 230,400 x 5% = 11,520; principal = 84,600 - 11,520 = 73,080. 15,000 wrongly charges interest on the original principal again. 73,080 and 69,600 are principal portions. Notice the interest portion falls and the principal portion rises each year.", "trap": "Year-2 interest uses the REDUCED balance; the interest share shrinks every year.", "klp": "T8(KLP) instalment notes payable: fixed payment split between interest and principal", "source": "Sample final Q21 style / ABC Corp in-class (linked pair)"}, {"id": "T7-M12", "topic": "T7", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Iris Ltd has a $400,000 bank loan repayable in principal instalments of $80,000 every 31 December from 2027 to 2031. Interest is paid monthly. How should the loan be shown on the 31 December 2026 balance sheet?", "options": ["Current liability $400,000, because interest is paid monthly", "Non-current liability $400,000, because the final payment is in 2031", "Current liability $80,000; non-current liability $400,000", "Current liability $80,000; non-current liability $320,000"], "answer": 3, "explanation": "Only the principal due within 12 months (80,000, due 31 December 2027) is reclassified as the current portion of long-term debt; the remaining 320,000 stays non-current. Monthly interest payments do not make the whole loan current (any interest owed is a separate Interest Payable). Showing all 400,000 as non-current ignores the 2027 instalment. Showing 80,000 current and 400,000 non-current double counts.", "trap": "Reclassify only the PRINCIPAL due within one year; interest frequency is irrelevant.", "klp": "T8(KLP) current portion of long-term debt reclassified as current", "source": "Sample final Q44-C / Topic 7 slide 10 / original"}, {"id": "T7-M13", "topic": "T7", "priority": 2, "template": "adjusting-je", "weak_spot": false, "stem": "Employees of Jade Ltd earned $12,000 of salaries in the last week of December 2026, which will be paid on 5 January 2027. What adjusting entry is needed at 31 December 2026?", "options": ["Dr Salaries Expense 12,000 / Cr Salaries Payable 12,000", "Dr Salaries Expense 12,000 / Cr Cash 12,000", "Dr Salaries Payable 12,000 / Cr Salaries Expense 12,000", "No entry until the salaries are paid in January"], "answer": 0, "explanation": "Salaries are incurred in December (the work was done), so under accrual accounting the expense and the liability are recorded now; cash is paid in January (Dr Salaries Payable / Cr Cash). Crediting Cash in an adjusting entry is wrong. The reversed entry reduces expense. Waiting until payment would understate December's expenses and liabilities and overstate net income.", "trap": "Accrued expense = expense now, cash later; never credit Cash in an adjusting entry.", "klp": "T8(KLP) (b) adjusting entry for salaries earned this period but paid next period", "source": "original"}, {"id": "T7-M14", "topic": "T7", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Kite Ltd is sued for $500,000. Its lawyers say the company did use the patent without permission, there is a 60% chance it will have to pay, and the best reliable estimate of the payment is $300,000. What should Kite record at year-end?", "options": ["A provision and expense of $500,000", "A provision and expense of $180,000 (60% x $300,000)", "A provision (liability) and expense of $300,000", "A note disclosure only, because the case is not yet decided"], "answer": 2, "explanation": "Present obligation (the company is at fault) + probable payment (60% is more than 50%) + reliable estimate = record a provision at the BEST ESTIMATE of 300,000: Dr Loss/Expense 300,000 / Cr Provision 300,000. 500,000 is the amount claimed, not the expected payment. Multiplying by the probability is never done. Disclosure only applies when payment is not probable or cannot be estimated.", "trap": "Record the BEST ESTIMATE, not the amount claimed and not probability x amount.", "klp": "T8(KLP) contingent liability flowchart: present obligation, probable (>50%), reliable estimate", "source": "Topic 7 slide 24 Case 2B style / Sample final Q31-D distractor"}, {"id": "T7-M15", "topic": "T7", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about liabilities is FALSE?", "options": ["A liability is a present obligation to transfer an economic resource as a result of past events.", "A liability is current if it is due within one year or the operating cycle, whichever is longer.", "Unearned revenue is a liability because the company owes goods or services to customers who have already paid.", "A liability is classified as current only if it will be paid in cash within 12 months; obligations settled by delivering goods or services are never current liabilities."], "answer": 3, "explanation": "Liabilities can be settled with cash, goods or services; Unearned Revenue is settled by delivering the service and is a current liability. The other statements are the definition (present obligation, past event, transfer of resources), the current/non-current rule (one year or operating cycle, whichever is longer) and the nature of unearned revenue.", "trap": "Current liabilities include obligations settled by goods or services (unearned revenue), not only cash.", "klp": "T8(KLP) identify liabilities; Topic 7 slide 2 definition", "source": "Sample final Q24/Q44 pattern / original"}, {"id": "T7-M16", "topic": "T7", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following accounts is NOT a liability?", "options": ["Provision for Warranty Repairs", "Allowance for Doubtful Accounts", "Unearned Subscription Revenue", "Sales Tax Payable"], "answer": 1, "explanation": "The Allowance for Doubtful Accounts is a contra-asset against receivables, even though it has a credit balance. Names containing 'payable', 'provision' or 'unearned' signal liabilities: the company owes money (sales tax), repairs (warranty) or services (subscriptions).", "trap": "'Payable', 'provision', 'unearned' = liability; a credit balance alone does not make an account a liability.", "klp": "T8(KLP) identify a liability account by its name", "source": "original"}, {"id": "T7-M17", "topic": "T7", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Why does a company record warranty expense and a warranty liability in the year of sale, based on an estimate, instead of waiting until customers actually make claims?", "options": ["Because the tax authority requires companies to deduct estimated costs early", "Because the estimate is always more accurate than the actual claims", "Because recording a liability early reduces the cash the company must pay later", "Because of the matching principle: the warranty cost is caused by this year's sales, so it must be expensed in the same period as the revenue even though the amount is only an estimate"], "answer": 3, "explanation": "The sale creates the obligation, so the expense belongs with the revenue of the sale year (same logic as bad debt expense). Waiting for actual claims would push the expense into later years and overstate this year's profit. Tax rules, accuracy of estimates and the amount of cash eventually paid are not the reason.", "trap": "Estimated liabilities (warranty, bad debts) exist because of MATCHING, not because estimates are precise.", "klp": "T8(KLP) why record a liability and expense based on an estimate rather than wait", "source": "KLP explicit 'why' bullet / Topic 7 slide 17"}, {"id": "T7-M18", "topic": "T7", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about unearned revenue is FALSE?", "options": ["Unearned revenue arises when a customer pays before the company delivers the goods or services.", "As the company delivers, it debits Unearned Revenue and credits Revenue.", "Unearned revenue is reported on the income statement because the cash has already been received.", "Unearned revenue is a 'cash first' item, while accrued expenses are 'cash later' items."], "answer": 2, "explanation": "Unearned revenue is a balance-sheet LIABILITY: the company owes a performance to the customer. Revenue is recognised only as the service is delivered (Dr Unearned Revenue / Cr Revenue). Receiving cash early does not create revenue. The other statements correctly describe deferrals vs accruals.", "trap": "Cash received in advance = liability, not revenue.", "klp": "T8(KLP) unearned revenue; T3 cash-first vs cash-later", "source": "Midterm Q7 weakness / original"}, {"id": "T7-M19", "topic": "T7", "priority": 3, "template": "classification", "weak_spot": false, "stem": "A company is being sued. Its lawyers believe it is reasonably possible, but not probable, that the company will lose, and the loss would be about $800,000. The company should:", "options": ["Record a provision and a loss of $800,000", "Disclose the lawsuit in the notes without recording a liability", "Record a provision of $400,000, since the chance of losing is around 50%", "Do nothing, because the outcome is uncertain"], "answer": 1, "explanation": "Reasonably possible (above remote but at or below 50%) means disclose a contingent liability in the notes. A provision needs a probable (more than 50%) outflow and a reliable estimate. Recording half the loss has no basis. Doing nothing is only right when the chance of payment is remote.", "trap": "Reasonably possible = DISCLOSE; probable + estimable = RECORD; remote = NOTHING.", "klp": "T8(KLP) contingent liability flowchart", "source": "Sample final Q31 style / original"}, {"id": "T7-M20", "topic": "T7", "priority": 2, "template": "classification", "weak_spot": false, "stem": "A former employee sues Lotus Ltd for $150,000. Records show the dismissal followed the law and lawyers say the chance of paying is remote, though the case has attracted bad press. How should Lotus treat this at year-end?", "options": ["Neither record a provision nor disclose it in the notes", "Record a provision of $150,000 because of the negative publicity", "Disclose a contingent liability in the notes because the case is public", "Record a provision for the estimated legal fees plus the claim"], "answer": 0, "explanation": "With only a possible obligation and a remote chance of payment, IAS 37 requires no provision and no disclosure. Publicity does not change the accounting; the legal and probability assessment does. Recording the claim or disclosing it would overstate the company's risk.", "trap": "Remote = nothing, and media coverage never changes the answer.", "klp": "T8(KLP) contingent liability: remote vs reasonably possible vs probable", "source": "Topic 7 slide 23 Case 1 / original"}, {"id": "T7-M21", "topic": "T7", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Maple Ltd admits it caused environmental damage and clean-up is probable, but even after expert advice the cost cannot be reliably estimated. Maple should:", "options": ["Record a provision for a nominal amount of $1", "Disclose a contingent liability in the notes, because a provision cannot be recorded without a reliable estimate", "Do nothing until the cost is known", "Record a provision equal to the maximum possible cost"], "answer": 1, "explanation": "All three conditions are needed to record a provision: present obligation, probable payment and a reliable estimate. When the estimate is missing (rare in practice), the obligation is disclosed as a contingent liability. A nominal or maximum amount is not a reliable estimate, and doing nothing ignores a present, probable obligation.", "trap": "Probable but NOT estimable = disclose (the third test on the flowchart).", "klp": "T8(KLP) contingent liability flowchart: whether the amount can be reliably estimated", "source": "Topic 7 slide 24 Case 2C / original"}, {"id": "T7-M22", "topic": "T7", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Nova Ltd polluted a river. No law forces it to clean up, but it has publicly and specifically promised to do so, so the affected residents expect the clean-up. Payment is probable and reliably estimated at $2 million. Nova should:", "options": ["Disclose only, because there is no legal obligation", "Do nothing, because the promise is voluntary", "Record a provision of $1 million to reflect the uncertainty", "Record a provision of $2 million, because the public promise creates a present (constructive) obligation"], "answer": 3, "explanation": "A present obligation can be legal OR constructive: a specific public promise that creates a valid expectation counts. With probable payment and a reliable estimate, the full best estimate ($2 million) is recorded. 'No law' does not mean 'no obligation'. Halving the amount has no basis.", "trap": "A public promise (constructive obligation) is enough for a provision; never scale the amount by uncertainty.", "klp": "T8(KLP) contingent liability flowchart: present vs possible obligation", "source": "Topic 7 slide 25 Case 3B / original"}, {"id": "T7-M23", "topic": "T7", "priority": 3, "template": "price-direction", "weak_spot": false, "stem": "Oak Ltd issues 10-year bonds with a face value of $500,000 and a stated (coupon) rate of 7% when the market rate for similar bonds is 5%. The bonds will be issued:", "options": ["At a discount, so Oak receives less than $500,000", "At face value, because the stated rate is fixed in the bond contract", "At a premium, so Oak receives more than $500,000", "At a premium only if the market rate later rises above 7%"], "answer": 2, "explanation": "Investors compare the bond's coupon with what the market offers. A 7% coupon is better than the 5% market rate, so investors pay more than face value: a premium. A discount arises when the coupon is BELOW the market rate. The issue price depends on the market rate at issue, not on later changes.", "trap": "Stated > market = premium; stated < market = discount; equal = par.", "klp": "T8(KLP) premium, face value or discount by comparing stated rate with market rate", "source": "Sample final Q17 reversed / Topic 7 slide 31 'Will be tested!!'"}, {"id": "T7-M24", "topic": "T7", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about bonds payable is FALSE?", "options": ["A bond issued at a discount pays its holders a lower cash coupon each period than stated on the bond certificate.", "The face value is the amount the issuer repays at maturity; it is also called par, principal or maturity value.", "If the stated rate equals the market rate, the bond is issued at face value.", "A debenture is an unsecured bond and usually carries a higher interest rate than a secured bond."], "answer": 0, "explanation": "The coupon cash payment (face x stated rate) never changes; a discount simply means investors paid less than face at issue because the coupon was below the market rate. The other statements are correct: face = par = principal = maturity value; equal rates give par; debentures are unsecured and riskier, so they pay more interest.", "trap": "Discount or premium changes the ISSUE PRICE, never the coupon cash paid.", "klp": "T8(KLP) bonds: stated vs market rate; Topic 7 slides 27-31 vocabulary", "source": "original"}, {"id": "T7-M25", "topic": "T7", "priority": 1, "template": "classification", "weak_spot": false, "stem": "Which type of bond can the ISSUER retire early at a stated price, at the issuer's choice?", "options": ["Convertible bond", "Serial bond", "Secured (mortgage) bond", "Callable bond"], "answer": 3, "explanation": "A callable bond gives the issuer the option to buy the bonds back before maturity, useful when interest rates fall. A convertible bond gives the HOLDER the option to exchange it for shares. Serial bonds mature in instalments; secured bonds are backed by assets. Neither of these is about early retirement at the issuer's option.", "trap": "Callable = issuer's option; convertible = holder's option.", "klp": "Topic 7 slide 29 types of bonds", "source": "original"}, {"id": "T7-M26", "topic": "T7", "priority": 2, "template": "principle", "weak_spot": false, "stem": "A company repays a loan in equal annual instalments that include interest and principal. Over the life of the loan, how does the split of each payment change?", "options": ["The interest portion increases and the principal portion decreases each year", "The interest portion decreases and the principal portion increases each year", "The split stays the same because the payment is the same", "Interest is paid only in the final year, after all the principal is repaid"], "answer": 1, "explanation": "Interest = unpaid balance x rate. Each payment reduces the balance, so next year's interest is smaller, and because the payment is fixed, more of it goes to principal. The payment is constant but its composition changes. Interest is charged every year on the outstanding balance.", "trap": "Fixed payment, falling interest, rising principal.", "klp": "T8(KLP) instalment notes: interest = beginning unpaid principal x rate", "source": "Topic 7 slide 34/38 note 'exam may ask whether interest is higher or lower'"}, {"id": "T7-M27", "topic": "T7", "priority": 2, "template": "adjusting-je", "weak_spot": true, "stem": "Pine Ltd has an instalment note on which $30,000 of interest has accrued for the year ended 31 December 2026; the first instalment of $118,700 (interest $30,000 + principal $88,700) is paid on 1 January 2027. Which pair of entries is correct?", "options": ["31 Dec 2026: no entry. 1 Jan 2027: Dr Interest Expense 30,000, Dr Notes Payable 88,700 / Cr Cash 118,700", "31 Dec 2026: Dr Interest Expense 30,000 / Cr Cash 30,000. 1 Jan 2027: Dr Notes Payable 118,700 / Cr Cash 118,700", "31 Dec 2026: Dr Interest Expense 30,000 / Cr Interest Payable 30,000. 1 Jan 2027: Dr Interest Payable 30,000, Dr Notes Payable 88,700 / Cr Cash 118,700", "31 Dec 2026: Dr Notes Payable 30,000 / Cr Interest Payable 30,000. 1 Jan 2027: Dr Notes Payable 88,700 / Cr Cash 88,700"], "answer": 2, "explanation": "Interest for 2026 is incurred in 2026, so it is accrued at year-end (Dr Interest Expense / Cr Interest Payable). On payment, the accrued payable is cleared and the principal portion reduces Notes Payable. Making no year-end entry pushes 2026 interest into 2027 (violates matching). Cash is not paid at 31 December. The last option wrongly treats interest as principal and pays the wrong amount.", "trap": "Accrue interest at year-end; on payment debit Interest PAYABLE (already expensed) and Notes Payable.", "klp": "T8(KLP) instalment notes payable entries; Topic 7 slide 37", "source": "King's Inn / ABC Corp entries style"}, {"id": "T7-M28", "topic": "T7", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Under IFRS 16, which of the following statements about a lessee's accounting for a 5-year equipment lease is FALSE?", "options": ["Each lease payment is recorded entirely as rent expense, so nothing appears on the balance sheet.", "At commencement the lessee records a right-of-use (ROU) asset and a lease liability, both measured at the present value of the lease payments.", "The ROU asset is depreciated straight-line, giving a depreciation expense each year.", "Each lease payment is split into interest expense and a reduction of the lease liability, like an instalment note."], "answer": 0, "explanation": "Post-2019, almost all leases go on the balance sheet (except short-term leases under one year and low-value items). The lessee records Dr ROU Asset / Cr Lease Liability, then depreciates the ROU asset and splits each payment into interest and principal, so there are two expense lines (depreciation and interest), not one rent expense.", "trap": "Leases are on-balance-sheet: ROU asset + lease liability; payment = interest + principal.", "klp": "T8(KLP) lease accounting: basic understanding only", "source": "Sample final Q24 style / Topic 7 slides 39-42"}, {"id": "T7-M29", "topic": "T7", "priority": 1, "template": "classification", "weak_spot": false, "stem": "Which of the following leases may a lessee leave OFF the balance sheet under IFRS 16?", "options": ["A 5-year lease of a factory building", "A 9-month lease of a delivery van", "A 3-year lease of a fleet of trucks", "A 10-year lease of office premises with annual payments"], "answer": 1, "explanation": "IFRS 16 exempts only short-term leases (12 months or less) and leases of low-value items. The van lease is under one year, so it can be expensed as incurred. The other leases are long-term and must be recognised as an ROU asset and a lease liability.", "trap": "Only short-term (under 1 year) and low-value leases escape the balance sheet.", "klp": "Topic 7 slide 39 lease exceptions", "source": "original"}, {"id": "T7-M30", "topic": "T7", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Under IFRS, a company reduces its warranty provision because actual claims have been much lower than estimated and it now expects lower future warranty costs. Which statement is correct?", "options": ["The company debits the provision and credits Warranty Expense, which can produce a 'negative' warranty expense for the period", "A provision can never be reduced once it has been recorded", "The reduction is recorded as revenue because the company is better off", "The company must wait until the warranty period ends before adjusting the provision"], "answer": 0, "explanation": "Provisions are estimates and are reassessed at each reporting date. If the expected cost falls, the excess is reversed: Dr Provision for Warranty / Cr Warranty Expense, which can make the period's warranty expense negative. It is not revenue (no sale to a customer), and the company does not wait for the warranty to expire.", "trap": "A warranty provision can be reversed through a credit to expense (negative expense), not through revenue.", "klp": "Topic 7 slide 19 negative warranty expense", "source": "original"}, {"id": "T7-M31", "topic": "T7", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A company's warranty expense for the year was $24,000 and it paid $20,000 to settle claims. Which statement is correct?", "options": ["Income statement warranty expense is $20,000, the amount actually paid", "Income statement warranty expense is $44,000, the estimate plus the claims paid", "Income statement warranty expense is $24,000; the $20,000 of claims reduced the provision and did not create any additional expense", "Income statement warranty expense is $4,000, the estimate minus the claims paid"], "answer": 2, "explanation": "The expense is the estimate recorded when products are sold (Dr Warranty Expense / Cr Provision). Settling claims is Dr Provision / Cr Cash or Inventory, which touches the liability only. Using the cash paid ignores matching; adding the two double counts; subtracting them confuses the ending liability with the expense.", "trap": "Expense = estimate; claims paid only reduce the provision.", "klp": "T8(KLP) warranty journal entries (1) expense and (2) claim settlement", "source": "Ross Inc in-class note / original"}, {"id": "T7-M32", "topic": "T7", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Which of the following best describes the difference between a 'present obligation' and a 'possible obligation' in the contingent liability flowchart?", "options": ["A present obligation is always recorded, while a possible obligation is always ignored", "A present obligation is one that must be paid in cash; a possible obligation can be settled in goods", "A present obligation applies to lawsuits; a possible obligation applies to warranties", "A present obligation already exists because of a past event; a possible obligation will only be confirmed by an uncertain future event, such as a court decision"], "answer": 3, "explanation": "The first question on the flowchart is whether the company is already responsible (present) or whether responsibility is still uncertain (possible). Even a present obligation is only recorded if payment is probable and estimable; otherwise it is disclosed. A possible obligation is disclosed unless the chance of payment is remote. Settlement method and the type of claim are irrelevant.", "trap": "Present obligation with payment not probable is still only DISCLOSED.", "klp": "T8(KLP) contingent liability flowchart: (1) present or possible obligation", "source": "Topic 7 slides 20-22 / original"}, {"id": "T8-M01", "topic": "T8", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "Quartz Ltd issues 5,000 common shares with a par value of $2 each for $9 per share in cash. Which entry is correct?", "options": ["Dr Cash 45,000 / Cr Common Stock 10,000, Cr Additional Paid-in Capital 35,000", "Dr Cash 45,000 / Cr Common Stock 45,000", "Dr Cash 10,000 / Cr Common Stock 10,000", "Dr Cash 45,000 / Cr Common Stock 10,000, Cr Gain on Share Issue 35,000"], "answer": 0, "explanation": "Cash is always the full issue price: 5,000 x 9 = 45,000. With par shares, Common Stock gets par x shares = 10,000 and the excess 35,000 goes to Additional Paid-in Capital (share premium). Crediting all 45,000 to Common Stock is the no-par treatment. Recording only 10,000 of cash ignores the premium. Transactions with owners never create gains.", "trap": "Cash = full price; Common Stock = par x shares; APIC = the rest; never a gain.", "klp": "T9(KLP) two main equity accounts; share issuance", "source": "Topic 8 slide 9 Ferguson / original"}, {"id": "T8-M02", "topic": "T8", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "Ruby Ltd issues 3,000 shares of $1 par common stock to a supplier in exchange for equipment with a market value of $40,000. Which entry is correct?", "options": ["Dr Equipment 3,000 / Cr Common Stock 3,000", "Dr Equipment 40,000 / Cr Common Stock 40,000", "Dr Equipment 40,000 / Cr Common Stock 3,000, Cr Additional Paid-in Capital 37,000", "Dr Equipment 40,000 / Cr Cash 40,000"], "answer": 2, "explanation": "When shares are issued for non-cash assets or services, the transaction is recorded at the market value of what is received (40,000). Common Stock = par x shares = 3,000; APIC is the plug 37,000. Recording the equipment at par (3,000) badly understates the asset. Crediting all 40,000 to Common Stock ignores par. No cash changed hands.", "trap": "Non-cash issuance: asset at MARKET value, Common Stock at par, APIC plugs.", "klp": "T9(KLP) shares issued for non-cash assets or services: how is the amount determined", "source": "Topic 8 slide 10 / original"}, {"id": "T8-M03", "topic": "T8", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Use the following for this question and the next. Sage Ltd has 8,000 shares of 5%, $100 par preferred stock and 50,000 common shares outstanding. No dividends were declared in 2025. In 2026 the board declares total dividends of $110,000. If the preferred stock is NONCUMULATIVE, how much do the common shareholders receive in 2026?", "options": ["$30,000", "$70,000", "$40,000", "$110,000"], "answer": 1, "explanation": "Annual preferred entitlement = 8,000 x 100 x 5% = 40,000. Noncumulative means the missed 2025 dividend is lost, so preferred gets only 40,000 and common gets 110,000 - 40,000 = 70,000. 30,000 is the CUMULATIVE answer (two years to preferred). 40,000 is the preferred share. 110,000 ignores preferred entirely.", "trap": "Noncumulative = no arrears; preferred dividend = par x rate x shares.", "klp": "T9(KLP) split dividends between preferred and common, cumulative and noncumulative", "source": "Sample final Q7 style / SMU Inc quick check (linked pair)"}, {"id": "T8-M04", "topic": "T8", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Refer to the Sage Ltd information above. If instead the preferred stock is CUMULATIVE, how much do the common shareholders receive in 2026?", "options": ["$70,000", "$80,000", "$-10,000", "$30,000"], "answer": 3, "explanation": "Cumulative preferred must first receive the 2025 arrears 40,000 plus the 2026 dividend 40,000 = 80,000. Common gets the remainder: 110,000 - 80,000 = 30,000. 70,000 is the noncumulative answer. 80,000 is what preferred receives. -10,000 wrongly adds a third year.", "trap": "Cumulative: pay arrears first, then the current year, then common.", "klp": "T9(KLP) split dividends: cumulative preferred", "source": "Sample final Q7 style / SMU Inc quick check (linked pair)"}, {"id": "T8-M05", "topic": "T8", "priority": 3, "template": "no-change", "weak_spot": false, "stem": "Topaz Ltd has 200,000 shares of $1 par common stock outstanding, market price $15. It declares and distributes a 10% stock dividend recorded at market value. What is the effect?", "options": ["Retained earnings and total shareholders' equity both fall by $300,000", "Retained earnings falls by $20,000; total shareholders' equity falls by $20,000", "Retained earnings falls by $300,000; total shareholders' equity is unchanged", "Cash and retained earnings both fall by $300,000"], "answer": 2, "explanation": "New shares = 200,000 x 10% = 20,000; at market $15 the amount is 300,000. Entry: Dr Retained Earnings 300,000 / Cr Common Stock 20,000, Cr APIC 280,000. Money simply moves from retained earnings to contributed capital, so total equity is unchanged and no cash is paid. Using par (20,000) ignores the market-value rule. Any option that reduces total equity or cash is wrong.", "trap": "Stock dividend: RE down, share capital up, TOTAL equity and cash unchanged.", "klp": "T9(KLP) stock dividends: amount and effect on total equity", "source": "Sample final Q16 style / Lakewood in-class"}, {"id": "T8-M06", "topic": "T8", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Umber Ltd repurchased 5,000 of its own shares at $20 each and later resold 2,000 of them at $24 each. What is the net effect of both transactions on total shareholders' equity?", "options": ["Decrease of $52,000", "Decrease of $100,000", "Increase of $8,000", "Increase of $48,000"], "answer": 0, "explanation": "Repurchase: equity falls by the cost, 5,000 x 20 = 100,000 (Dr Treasury Stock / Cr Cash). Resale: equity rises by the cash received, 2,000 x 24 = 48,000; the excess over cost (8,000) goes to APIC, not to a gain. Net = -100,000 + 48,000 = -52,000. 100,000 ignores the resale. 8,000 is the APIC credit only. 48,000 ignores the repurchase.", "trap": "Equity changes by CASH paid or received in treasury deals; no gain or loss ever hits the income statement.", "klp": "T9(KLP) how treasury transactions affect total shareholders' equity", "source": "Sample final Q40 style / Donut Republic in-class"}, {"id": "T8-M07", "topic": "T8", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Vale Corp reported net income of $900,000 and declared preferred dividends of $60,000 in 2026. It had 400,000 common shares outstanding on 1 January and issued 120,000 more on 1 October 2026. What is basic EPS for 2026 (nearest cent)?", "options": ["$2.09", "$1.62", "$2.10", "$1.95"], "answer": 3, "explanation": "Weighted-average shares = 400,000 + 120,000 x 3/12 = 430,000. EPS = (900,000 - 60,000) / 430,000 = 1.95. 2.09 forgets to subtract preferred dividends. 1.62 uses year-end shares (520,000). 2.10 uses the 1 January shares only.", "trap": "Subtract PREFERRED dividends; weight new shares by months outstanding (3/12).", "klp": "T9(KLP) Basic EPS = (NI - preferred dividends) / weighted-average shares outstanding", "source": "Sample final Q26 style / Ross example"}, {"id": "T8-M08", "topic": "T8", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Wren Ltd is authorised to issue 100,000 shares. It has issued 60,000 shares, of which 5,000 were later repurchased and are held as treasury shares. How many shares are outstanding, and which number is used as the EPS denominator?", "options": ["60,000 shares outstanding; EPS uses the issued shares", "55,000 shares outstanding; EPS uses the outstanding shares", "100,000 shares outstanding; EPS uses the authorised shares", "55,000 shares outstanding; EPS uses the issued shares"], "answer": 1, "explanation": "Issued = outstanding + treasury, so outstanding = 60,000 - 5,000 = 55,000. Treasury shares are inactive (no votes, no dividends) and are excluded from the EPS denominator, which is the weighted-average OUTSTANDING shares. Authorised is only the maximum allowed by the charter.", "trap": "Outstanding = issued - treasury; EPS divides by OUTSTANDING, not issued.", "klp": "T9(KLP) treasury stock reduces outstanding shares; EPS denominator", "source": "Topic 8 slides 7-8 / original"}, {"id": "T8-M09", "topic": "T8", "priority": 3, "template": "principle", "weak_spot": false, "stem": "What are the two main shareholders' equity accounts on the balance sheet, and what does each represent?", "options": ["Share capital (amounts invested by shareholders) and retained earnings (cumulative net income not paid out as dividends)", "Share capital (amounts invested by shareholders) and cash (amounts available to pay dividends)", "Retained earnings (amounts invested by shareholders) and dividends payable (profits owed to shareholders)", "Common stock (owners' claims) and bonds payable (creditors' claims)"], "answer": 0, "explanation": "Equity = owners' claims = contributed capital (share capital, including any APIC) + retained earnings (profits kept in the business). Cash is an asset; dividends payable and bonds payable are liabilities. Retained earnings is not the amount invested; it is accumulated profit less dividends.", "trap": "Equity = Share capital + Retained earnings (owners' claims); liabilities are creditors' claims.", "klp": "T9(KLP) the two main shareholders' equity accounts", "source": "Midterm Q12 weakness / Topic 8 slide 2-3"}, {"id": "T8-M10", "topic": "T8", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Which of the four basic shareholder rights do preferred shareholders USUALLY lack?", "options": ["The right to receive dividends when declared", "The right to share in assets on liquidation", "The right to vote for the board of directors", "The right to receive dividends before common shareholders"], "answer": 2, "explanation": "Preferred shares get dividends first and assets first in liquidation, usually at a fixed rate, but typically have limited or no voting (and pre-emptive) rights. This lets the common shareholders keep control while the company raises capital. The other options are rights preferred shareholders do have.", "trap": "Preferred = priority on dividends and liquidation, but usually NO vote.", "klp": "T9(KLP) common vs preferred: how the four shareholder rights differ", "source": "Sample final Q2-B / Topic 8 slides 5-6"}, {"id": "T8-M11", "topic": "T8", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about common and preferred shares is FALSE?", "options": ["Common shareholders hold all four basic rights: vote, dividends, liquidation and pre-emption.", "Preferred shareholders usually receive a fixed dividend and are paid before common shareholders.", "Common shareholders are the residual owners and benefit most if the company does well.", "Common shareholders are paid first in a liquidation because they own the company."], "answer": 3, "explanation": "Common shareholders are LAST in a liquidation: creditors are paid first, then preferred shareholders, and common shareholders get whatever is left (residual). That is why they bear the most risk but also gain the most from success. The other three statements are correct.", "trap": "Liquidation order: creditors, then preferred, then common (residual).", "klp": "T9(KLP) common vs preferred shareholder rights", "source": "Topic 8 slide 6 / original"}, {"id": "T8-M12", "topic": "T8", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about dividends is FALSE?", "options": ["A company has no obligation to pay dividends until the board formally declares them.", "Dividends in arrears on cumulative preferred stock are recorded as a liability at each year-end until paid.", "Declaring a cash dividend creates a liability, Dividends Payable.", "To pay a cash dividend a company needs both sufficient retained earnings and sufficient cash."], "answer": 1, "explanation": "Passed dividends on cumulative preferred shares are disclosed in the notes but are NOT a liability, because no dividend has been declared. A liability arises only on declaration (Dr Retained Earnings / Cr Dividends Payable). The other statements are correct.", "trap": "No declaration = no liability; arrears are disclosed only.", "klp": "T9(KLP) a company does not owe dividends unless formally declared", "source": "Sample final Q2 style / Topic 8 slide 12"}, {"id": "T8-M13", "topic": "T8", "priority": 3, "template": "no-change", "weak_spot": false, "stem": "On 15 March a company declares a $40,000 cash dividend, and on 15 April it pays it. What is the effect of the PAYMENT on 15 April?", "options": ["Assets decrease $40,000; equity decreases $40,000", "Liabilities increase $40,000; equity decreases $40,000", "Assets decrease $40,000; liabilities decrease $40,000; total equity is unchanged", "No effect, because the dividend was already recorded on 15 March"], "answer": 2, "explanation": "Declaration (15 March): Dr Retained Earnings / Cr Dividends Payable, so equity falls and a liability rises. Payment (15 April): Dr Dividends Payable / Cr Cash, so the liability and cash fall; equity is NOT reduced again. Combined effect of both dates: assets down, equity down. The payment is a real entry, not 'no effect'.", "trap": "Equity falls at DECLARATION; payment only swaps cash for the liability.", "klp": "T9(KLP) cash dividend entries at declaration and payment", "source": "Topic 8 slide 15 and 29 summary table / original"}, {"id": "T8-M14", "topic": "T8", "priority": 2, "template": "principle", "weak_spot": false, "stem": "When a company declares a 5% stock dividend (to be distributed next month), what entry is made on the declaration date?", "options": ["Dr Retained Earnings / Cr Dividends Payable at market value of the new shares", "Dr Retained Earnings / Cr Cash at market value of the new shares", "Dr Dividends Expense / Cr Stock Dividends Payable", "No liability is recorded; the only entry is Dr Retained Earnings / Cr Common Stock (and APIC) at the market value of the new shares, which just moves amounts within equity."], "answer": 3, "explanation": "A stock dividend transfers no assets, so declaring it creates no liability and needs no entry. On distribution, retained earnings is reduced by shares x market price and share capital (par plus APIC) increases. Cash is never involved, and dividends are never an expense.", "trap": "Stock dividend declaration = no entry, no liability (unlike a cash dividend).", "klp": "T9(KLP) stock dividends: no entry at declaration; entry at distribution", "source": "Topic 8 slide 16 Prof note / original"}, {"id": "T8-M15", "topic": "T8", "priority": 2, "template": "no-change", "weak_spot": false, "stem": "A company with 100,000 shares of $2 par common stock announces a 2-for-1 stock split. Which statement is correct?", "options": ["Retained earnings decreases by the market value of the 100,000 new shares", "No journal entry is made; the company now has 200,000 shares with a par value of $1 each and total share capital is unchanged", "Total shareholders' equity doubles because the number of shares doubles", "A liability is recorded until the new shares are distributed"], "answer": 1, "explanation": "A split only changes the number of shares (and par per share proportionately); no accounts change and no entry is made. Reducing retained earnings is the stock DIVIDEND treatment. Equity does not change in total, and no liability arises. The purpose is to lower the share price to improve liquidity and affordability.", "trap": "Stock split: no entry, nothing changes except share count and par per share.", "klp": "Topic 8 slide 19 stock splits", "source": "original"}, {"id": "T8-M16", "topic": "T8", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about treasury stock is FALSE?", "options": ["Treasury stock is reported as a long-term investment because the company owns the shares.", "Treasury stock is recorded at the cost paid to repurchase the shares, which is their market value on that date.", "Treasury stock is a contra-equity account deducted in the equity section of the balance sheet.", "Treasury shares have no voting rights and receive no dividends."], "answer": 0, "explanation": "A company cannot own part of itself as an asset; buying back shares returns capital to owners, so treasury stock is a contra-equity account (reduces equity), recorded at cost. Treasury shares are inactive: no votes, no dividends, and they reduce shares outstanding.", "trap": "Treasury stock is NEVER an asset; it is contra-equity at cost.", "klp": "T9(KLP) treasury stock is a contra-equity account recorded at purchase cost", "source": "Topic 8 slide 20 / original"}, {"id": "T8-M17", "topic": "T8", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Which of the following is NOT a typical reason for a company to repurchase its own shares?", "options": ["To return surplus cash to shareholders as an alternative to dividends", "To increase earnings per share by reducing the number of shares outstanding", "To record a gain on the income statement when the shares are later resold at a higher price", "To have shares available for employee share plans or to signal that the stock is underpriced"], "answer": 2, "explanation": "Transactions with owners never produce gains or losses; any excess on resale goes to APIC. The real reasons include returning cash, raising EPS (fewer shares), employee share schemes, signalling underpricing, achieving a target capital structure and avoiding takeovers.", "trap": "Companies never earn profit from trading their own shares.", "klp": "T9(KLP) why might a company repurchase its own shares", "source": "Topic 8 slide 21 / original"}, {"id": "T8-M18", "topic": "T8", "priority": 3, "template": "no-change", "weak_spot": false, "stem": "A company resells treasury shares that cost $10 each for $7 each. How does this affect total shareholders' equity and net income?", "options": ["Total equity increases by $7 per share; net income is not affected", "Total equity increases by $7 per share; net income decreases by $3 per share", "Total equity decreases by $3 per share; net income decreases by $3 per share", "Total equity increases by $10 per share; net income is not affected"], "answer": 0, "explanation": "Equity rises by the cash received ($7). The $3 shortfall below cost is debited to APIC (or share capital), not to a loss, because dealings with owners are not profit-making activities. Equity never rises by the original cost, only by the cash that actually comes in.", "trap": "Resale below cost: equity up by cash received, APIC absorbs the difference, NI untouched.", "klp": "T9(KLP) effect of reselling treasury shares above, equal to or below cost", "source": "Topic 8 slide 24 / original"}, {"id": "T8-M19", "topic": "T8", "priority": 2, "template": "no-change", "weak_spot": false, "stem": "A company retires (cancels) 1,000 treasury shares that it had repurchased for $15 each. What is the effect on total shareholders' equity?", "options": ["Decrease of $15,000, the cost of the shares", "Increase of $15,000, because the contra-equity account is removed", "Decrease of $15,000 plus a loss on retirement", "No effect; the entry just reshuffles amounts within equity (Dr Common Stock and APIC / Cr Treasury Stock)"], "answer": 3, "explanation": "Equity already fell by $15,000 when the shares were repurchased. Retiring them removes the Treasury Stock account (credit) and reduces Common Stock and APIC (debits) by the same total, so total equity is unchanged. There is no second reduction and no gain or loss. The same 'no net effect' applies to reissuing treasury shares as employee compensation.", "trap": "Retirement and reissue-as-compensation: no net change in total equity.", "klp": "T9(KLP) effect of retiring treasury shares on total equity", "source": "Topic 8 slide 25 / original"}, {"id": "T8-M20", "topic": "T8", "priority": 1, "template": "principle", "weak_spot": false, "stem": "Which of the following is a reason a company might issue preferred stock rather than common stock or bonds?", "options": ["Preferred dividends are tax-deductible like bond interest", "Preferred shares usually carry no vote, so existing shareholders raise capital without giving up control, and dividends can be deferred unlike bond interest", "Preferred shareholders must be repaid their investment on a fixed maturity date", "Preferred shares give the holder the right to elect the board of directors"], "answer": 1, "explanation": "Preferred stock limits voting dilution (no or limited votes), offers payment flexibility (dividends can be skipped or accumulated, often no maturity date) and attracts investors who want predictable dividends with priority. Dividends are not tax-deductible, preferred shares usually have no maturity, and they do not normally carry board votes.", "trap": "Preferred stock = control kept + flexible payments + different investors.", "klp": "Topic 8 slide 13 why issue preferred stock", "source": "original"}, {"id": "T8-M21", "topic": "T8", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Which of the following equity transactions involves a LIABILITY account?", "options": ["Declaration of a stock dividend", "Declaration of a cash dividend", "Purchase of treasury shares", "A 3-for-1 stock split"], "answer": 1, "explanation": "Only the cash dividend declaration creates a liability (Dividends Payable) because the company now owes cash. A stock dividend transfers no assets (no liability, no entry at declaration). Treasury purchases reduce cash and equity. A split changes only share counts.", "trap": "Of all equity transactions, only a cash dividend touches liabilities.", "klp": "Topic 8 slide 29 summary table (Prof note)", "source": "original"}, {"id": "T8-M22", "topic": "T8", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following transactions DECREASES total shareholders' equity?", "options": ["Distributing a 10% stock dividend", "Issuing new shares for cash", "Repurchasing the company's own shares for cash", "Paying a cash dividend that was declared last month"], "answer": 2, "explanation": "A treasury purchase returns cash to owners: Dr Treasury Stock (contra-equity) / Cr Cash, so equity falls. A stock dividend moves retained earnings into share capital (no change in total). Issuing shares raises equity. Paying a previously declared dividend reduces the liability, not equity (equity fell at declaration).", "trap": "Equity falls at dividend DECLARATION and at treasury PURCHASE; stock dividends and splits leave it unchanged.", "klp": "Topic 8 slide 29 summary: effects of equity transactions", "source": "original"}, {"id": "T9-M01", "topic": "T9", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Zinc Ltd reports net income of $150,000, depreciation expense $30,000, a gain on sale of equipment $10,000, an increase in accounts receivable $20,000 and an increase in accounts payable $15,000. Under the indirect method, what is net cash from operating activities?", "options": ["$165,000", "$185,000", "$175,000", "$105,000"], "answer": 0, "explanation": "Start with net income 150,000; add back depreciation 30,000 (non-cash); subtract the gain 10,000 (the full sale proceeds are in investing); subtract the A/R increase 20,000 (sales not yet collected); add the A/P increase 15,000 (costs not yet paid). CFO = 165,000. 185,000 adds the gain. 175,000 reverses the working-capital signs. 105,000 subtracts depreciation.", "trap": "Add non-cash expenses and losses, SUBTRACT gains; current-asset increases use cash, current-liability increases save cash.", "klp": "T10(KLP) identify indirect method; adjustments to net income", "source": "Topic 9 slide 51 / original (light)"}, {"id": "T9-M02", "topic": "T9", "priority": 1, "template": "plug", "weak_spot": false, "stem": "Yarrow Ltd reports net cash from operating activities $250,000, net cash used in investing activities $400,000, net cash from financing activities $200,000 and a beginning cash balance of $90,000. What is the ending cash balance shown on the balance sheet?", "options": ["$50,000", "$540,000", "$940,000", "$140,000"], "answer": 3, "explanation": "Net change in cash = 250,000 - 400,000 + 200,000 = 50,000. Ending cash = beginning 90,000 + 50,000 = 140,000, which must equal the balance-sheet cash. 50,000 is the change, not the ending balance. 540,000 ignores investing. 940,000 treats the investing outflow as an inflow.", "trap": "CFO + CFI + CFF = change in cash; add the BEGINNING balance to get ending cash = balance-sheet cash.", "klp": "T10(KLP) format of SCF; link between SCF ending cash and balance sheet", "source": "Sample final Q49 link / original"}, {"id": "T9-M03", "topic": "T9", "priority": 1, "template": "formula", "weak_spot": false, "stem": "Xenon Ltd reports cash from operating activities of $300,000. Its investing section shows purchases of PP&E $120,000 and purchase of a long-term investment $30,000 (net cash used in investing $150,000). Interest paid of $8,000 is included within operating activities. What is Xenon's free cash flow (CFO less capital expenditures)?", "options": ["$150,000", "$172,000", "$420,000", "$180,000"], "answer": 3, "explanation": "FCF = CFO - cash capital expenditures = 300,000 - 120,000 = 180,000: the operating cash left after funding PP&E. 150,000 deducts total investing, including the financial investment, which is not CapEx. 172,000 deducts interest again although it is already inside CFO. 420,000 adds instead of subtracting.", "trap": "FCF = CFO - CapEx only; do not deduct interest or tax twice, and do not use total CFI.", "klp": "Topic 9 slide 38 FCF = CFO - CapEx (Harbor example)", "source": "Topic 9 prompt packet concept / original"}, {"id": "T9-M04", "topic": "T9", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following cash flows is classified as a FINANCING activity?", "options": ["Cash paid to repay the principal of a long-term bank loan", "Cash paid to buy shares of another company as a long-term investment", "Cash received from the sale of an old delivery truck", "Cash paid for income taxes"], "answer": 0, "explanation": "Financing activities are dealings with owners and creditors: issuing or buying back shares, borrowing and repaying principal, paying dividends. Buying another company's shares and selling a truck are investing (long-term assets and investments). Income tax is operating.", "trap": "Financing = owners and lenders; investing = long-term assets and investments; operating = day-to-day.", "klp": "T10(KLP) classify a cash inflow or outflow as operating, investing or financing", "source": "Sample final Q22 style / original"}, {"id": "T9-M05", "topic": "T9", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following is an INVESTING activity?", "options": ["Cash received from issuing bonds payable", "Cash lent to another company under a two-year loan agreement", "Cash paid to employees for salaries", "Cash paid to buy back the company's own shares"], "answer": 1, "explanation": "Making a loan to another party creates a receivable that is an investment, so the cash out is investing (and collecting the principal later is an investing inflow). Issuing bonds and repurchasing own shares are financing. Salaries are operating.", "trap": "Lending to OTHERS = investing; borrowing from others = financing; buying back OWN shares = financing.", "klp": "T10(KLP) classify cash flows", "source": "Topic 9 slide 40 / original"}, {"id": "T9-M06", "topic": "T9", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following is an OPERATING activity?", "options": ["Cash paid to purchase a building", "Cash received from issuing common shares", "Cash paid to suppliers for inventory", "Cash received from selling a long-term investment"], "answer": 2, "explanation": "Operating activities relate to selling goods and services and the changes in current assets and current liabilities, so paying suppliers for inventory is operating. Buying a building and selling an investment are investing; issuing shares is financing.", "trap": "Operating = income-statement items and current assets/liabilities.", "klp": "T10(KLP) classify cash flows", "source": "Sample final Q22-D / original"}, {"id": "T9-M07", "topic": "T9", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Which of the following is NOT a financing activity?", "options": ["Cash paid as dividends to shareholders", "Cash received from the
