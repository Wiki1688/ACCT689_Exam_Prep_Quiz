 sale of used equipment", "Cash received from reissuing treasury shares", "Cash paid to redeem bonds at maturity"], "answer": 1, "explanation": "Selling equipment is a disposal of a long-term asset, so it is investing (the full proceeds go there; any gain or loss is removed from operating income under the indirect method). Dividends paid (common practice), treasury share reissue and bond redemption are all transactions with owners or lenders: financing.", "trap": "Sale of PP&E = investing inflow at full proceeds.", "klp": "T10(KLP) classify cash flows", "source": "Sample final Q22-B / original"}, {"id": "T9-M08", "topic": "T9", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following would be reported in a note as a non-cash investing and financing activity rather than in the body of the statement of cash flows?", "options": ["Retiring bonds payable by issuing common shares to the bondholders", "Paying off bonds payable with cash", "Issuing common shares for cash and using the cash to buy a building", "Declaring and paying a cash dividend"], "answer": 0, "explanation": "Swapping bonds for shares is a financing transaction with no cash, so it is disclosed in a separate schedule or note. Paying bonds with cash is a financing outflow. Issuing shares for cash (financing inflow) and buying a building with cash (investing outflow) are two cash transactions that both appear in the statement. A cash dividend is a financing outflow.", "trap": "No cash = not in the statement body; disclose in a note (land for a note payable, building for shares, debt for shares).", "klp": "T10(KLP) non-cash investing and financing activities must be disclosed in a note", "source": "Sample final Q6 style / Topic 9 slide 44"}, {"id": "T9-M09", "topic": "T9", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A company's operating section lists 'Cash received from customers', 'Cash paid to suppliers', 'Cash paid to employees' and 'Income taxes paid'. Which statement is correct?", "options": ["The company uses the indirect method because it lists payments", "The company uses the direct method, so its investing and financing sections must use the indirect method", "The company uses the indirect method for operating activities and the direct method for investing and financing", "The company uses the direct method for operating activities; its investing and financing sections are also reported on a direct basis"], "answer": 3, "explanation": "Listing actual receipts and payments is the direct method. The indirect method instead starts from net income and adjusts for non-cash items and working-capital changes. Whatever method is used for operating activities, investing and financing are ALWAYS presented directly (actual cash paid and received).", "trap": "Direct vs indirect applies ONLY to the operating section; investing and financing are always direct.", "klp": "T10(KLP) identify direct or indirect method; investing and financing always direct", "source": "Sample final Q1 mirrored / original"}, {"id": "T9-M10", "topic": "T9", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about the direct and indirect methods is FALSE?", "options": ["The indirect method starts with net income and adds back non-cash expenses such as depreciation.", "The direct method is preferred by the IASB because it shows the sources and uses of operating cash more clearly.", "Most companies use the direct method because it is easier to prepare.", "Both methods give the same total net cash from operating activities."], "answer": 2, "explanation": "The direct method is preferred by standard setters but used by very few companies because it needs more computation; most use the indirect method. The other statements are correct: indirect reconciles from net income, and both methods arrive at the same CFO total.", "trap": "Direct = IASB-preferred but RARE; indirect = common. Same CFO either way.", "klp": "Topic 9 slides 47-48", "source": "original"}, {"id": "T9-M11", "topic": "T9", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Under the indirect method, why is a gain on the sale of equipment SUBTRACTED from net income in the operating section?", "options": ["Because gains are never real cash inflows", "Because gains must be reported in financing activities", "Because the full cash proceeds from the sale are reported in investing activities, so leaving the gain in net income would count part of the sale twice", "Because the gain reduces the amount of depreciation to add back"], "answer": 2, "explanation": "The whole selling price is an investing inflow. Net income includes only the gain (proceeds minus book value), so to avoid double counting the gain is removed from operating cash; a loss is added back for the same reason. The gain is part of a real cash sale, just reported elsewhere; it has nothing to do with financing or depreciation.", "trap": "Gains out, losses back in: the sale is already counted in investing.", "klp": "Topic 9 slide 51 Prof note 'exclude: already counted in CFI'", "source": "original"}, {"id": "T9-M12", "topic": "T9", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Over several years a company's net income rises steadily while its cash from operating activities falls. Which interpretation is most appropriate?", "options": ["Proof that management is manipulating earnings", "A possible red flag for earnings quality: profits are not turning into cash, so check receivables and inventory build-ups", "A sign of strong liquidity because net income is rising", "Normal, because net income and operating cash flow are unrelated"], "answer": 1, "explanation": "CFO shows whether profit is backed by cash. Rising profit with falling CFO often means slower collections or inventory build-up, which users should investigate; it is a warning sign, not proof of manipulation. Liquidity depends on cash, not profit. Net income and CFO are closely linked through the indirect reconciliation.", "trap": "NI up but CFO down = investigate earnings quality (receivables, inventory), not an automatic fraud verdict.", "klp": "T10(KLP) implications of the three types of cash flows (operating)", "source": "Topic 9 slide 37 / Harbor example"}, {"id": "T9-M13", "topic": "T9", "priority": 2, "template": "classification", "weak_spot": false, "stem": "A company shows positive cash from operating activities, negative cash from investing activities and positive cash from financing activities. This pattern is most typical of:", "options": ["A mature company repaying debt and paying dividends out of operating cash", "A start-up living entirely on new financing", "A company in distress selling assets to cover operating losses", "A growth company using operating cash plus new financing to fund expansion"], "answer": 3, "explanation": "+ / - / + means the business generates cash, invests heavily and still raises outside money to fund growth. A mature firm is typically + / - / - (operating cash funds investment and returns cash to providers). A start-up is - / - / +. Distress looks like - / + / - (selling assets). Signs are only clues; check amounts and trends.", "trap": "Growth = + - +; mature = + - -; start-up = - - +.", "klp": "T10(KLP) implications of the three cash-flow categories; Topic 9 slide 56 patterns", "source": "original"}, {"id": "T9-M14", "topic": "T9", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Which balance-sheet items mainly drive each section of the statement of cash flows?", "options": ["Current assets and current liabilities drive operating; long-term assets and investments drive investing; long-term liabilities and equity drive financing", "Current assets drive investing; current liabilities drive financing; equity drives operating", "All assets drive investing; all liabilities drive financing; equity drives operating", "Cash drives operating; receivables drive investing; payables drive financing"], "answer": 0, "explanation": "Working-capital accounts relate to day-to-day operations; PP&E, intangibles and investments are investing; debt and equity are financing. This map helps classify any transaction: ask which part of the balance sheet it changes.", "trap": "Operating = working capital; investing = long-term assets; financing = long-term debt and equity.", "klp": "Topic 9 slide 36 relationship of activities to the balance sheet", "source": "original"}, {"id": "T9-M15", "topic": "T9", "priority": 2, "template": "no-change", "weak_spot": false, "stem": "How are the following reported in the statement of cash flows: (1) declaring a cash dividend to be paid next year and (2) distributing a stock dividend?", "options": ["Both are financing outflows", "The declaration is a financing outflow; the stock dividend is a non-cash activity disclosed in a note", "The declaration is an operating outflow; the stock dividend is a financing outflow", "Neither appears in the statement: the declaration involves no cash this year, and a stock dividend never involves cash"], "answer": 3, "explanation": "Only cash movements go in the statement. A declared but unpaid dividend creates Dividends Payable (it will be a financing outflow when paid next year). A stock dividend has no current or future cash implication, so it is not reported at all, not even in the non-cash note, which is reserved for investing and financing activities such as land bought with a note payable.", "trap": "No cash = no line in the statement; stock dividends and splits are not even disclosed as non-cash activities.", "klp": "T10(KLP) classification; Topic 9 in-class note on 'no current or future cash implications'", "source": "Topic 9 Drill 7 / original"}, {"id": "T9-M16", "topic": "T9", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Why must a company have positive cash from operating activities in the long run?", "options": ["Because operations are the only sustainable, recurring source of cash; financing and asset sales cannot fund the business indefinitely", "Because accounting standards prohibit reporting negative operating cash flow", "Because positive operating cash flow guarantees the company is profitable", "Because investing and financing cash flows are always negative"], "answer": 0, "explanation": "CFO shows cash generated by the core business. A company can raise financing or sell assets for a while, but lenders and investors eventually stop, and assets run out. Standards do not ban negative CFO (start-ups often have it). CFO and profit can differ (e.g. large depreciation), and investing or financing flows can be positive or negative.", "trap": "CFO = the persistent source; investing/financing inflows are one-off or must be repaid.", "klp": "T10(KLP) implications of operating cash flows", "source": "Topic 9 slide 37 / original"}, {"id": "T7-M40", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Pebble Ltd sells goods for $350,000 cash on 30 November. The law requires it to collect 7% sales tax on top of every dollar of goods sold. How much cash does Pebble debit on 30 November?", "options": ["$350,000", "$24,500", "$374,500", "$327,103"], "answer": 2, "explanation": "The sales figure of 350,000 is BEFORE tax, so tax = 350,000 x 7% = 24,500 and cash collected = 350,000 + 24,500 = 374,500. Entry: Dr Cash 374,500 / Cr Sales Revenue 350,000, Cr Sales Tax Payable 24,500. 350,000 ignores the tax collected. 24,500 is the tax alone. 327,103 wrongly backs the tax out of 350,000 as if the 350,000 already included tax (350,000 / 1.07).", "trap": "Read whether the figure is 'sales earned' (add tax on top) or 'cash collected including tax' (back the tax out).", "klp": "T7 KLP: sales tax collected is a liability (Sales Tax Payable), not revenue; remitted later", "source": "Topic 7 practice Q1 (E9-7) style"}, {"id": "T7-M41", "topic": "T7", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "On 15 December Pebble Ltd remits to the tax authority the $24,500 of sales tax it collected from customers on 30 November. Which entry records the remittance?", "options": ["Dr Sales Tax Expense 24,500 / Cr Cash 24,500", "Dr Sales Tax Payable 24,500 / Cr Cash 24,500", "Dr Sales Revenue 24,500 / Cr Cash 24,500", "Dr Cash 24,500 / Cr Sales Tax Payable 24,500"], "answer": 1, "explanation": "The tax was recorded as a liability (Sales Tax Payable) when it was collected. Paying it to the government removes the liability: Dr Sales Tax Payable / Cr Cash. Liabilities fall, assets fall, no effect on profit. Option A treats the tax as the company's own expense, but the company only collects it for the government. Option C reduces revenue, but revenue was correctly recorded net of tax. Option D is the original collection side, not the remittance.", "trap": "Sales tax is never the seller's expense or revenue; it goes in and out of a payable.", "klp": "T7 KLP: sales tax collected is a liability (Sales Tax Payable), not revenue; remitted later", "source": "Topic 7 practice Q1 (E9-7) style"}, {"id": "T7-M42", "topic": "T7", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Rook Ltd faces three legal matters at year-end. (a) A customer sues over a faulty product; lawyers put the chance of losing at 35%. (b) A regulator alleges safety breaches; lawyers put the chance of a fine at under 5%. (c) An ex-employee sues for discrimination; lawyers put the chance of losing at 85% and the payout can be reliably estimated. Which matter(s) require a provision (liability) to be RECORDED?", "options": ["(a) and (c)", "(a), (b) and (c)", "(c) only", "(b) only"], "answer": 2, "explanation": "Record a provision only when payment is probable (more likely than not, over 50%) and the amount can be reliably estimated: that is (c) at 85%. (a) at 35% is possible but not probable, so it is disclosed in the notes as a contingent liability. (b) at under 5% is remote, so nothing is recorded or disclosed. Options A and B record items that are only possible or remote; option D picks the remote one.", "trap": "Probable (>50%) = record; possible = disclose only; remote = nothing.", "klp": "T7 KLP: contingencies: probable + reliable estimate = provision; possible = disclose; remote = nothing", "source": "Topic 7 practice Q2 (E9-9) style"}, {"id": "T7-M43", "topic": "T7", "priority": 3, "template": "no-change", "weak_spot": false, "stem": "Rook Ltd decides matter (a) above (35% chance of losing, loss could be about $400,000) is reasonably possible and discloses it in the notes. What is the effect of this disclosure on Rook's total liabilities and net income for the year?", "options": ["Liabilities increase $400,000; net income decreases $400,000", "Liabilities increase $140,000; net income decreases $140,000", "No effect on either liabilities or net income", "Liabilities increase $400,000; no effect on net income"], "answer": 2, "explanation": "A note disclosure is words only. No journal entry is made, so nothing in the balance sheet or income statement changes. Option A is what happens when a provision IS recorded (probable and estimable). Option B multiplies the loss by the probability (35% x 400,000), which is never done. Option D records a liability without the matching expense, which breaks the equation.", "trap": "Disclose means no entry; the numbers in the statements do not move.", "klp": "T7 KLP: contingencies: probable + reliable estimate = provision; possible = disclose; remote = nothing", "source": "Topic 7 practice Q2 (E9-9) style"}, {"id": "T7-M44", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Swift Co. gives a one-year warranty and estimates warranty costs at 8% of sales. Sales in February were $2,250,000. In July, actual warranty repairs on those goods cost $120,000. How much warranty EXPENSE does Swift recognise in July?", "options": ["$120,000", "$0", "$180,000", "$60,000"], "answer": 1, "explanation": "Warranty expense is recognised in the month of sale (February): 2,250,000 x 8% = 180,000, Dr Warranty Expense 180,000 / Cr Warranty Provision 180,000. The July repair uses up the provision: Dr Warranty Provision 120,000 / Cr Cash, Supplies or Wages Payable 120,000. No new expense in July. Option A expenses repairs when they happen (cash basis). Option C is the February expense, not July. Option D is the unused provision (180,000 - 120,000), a balance, not an expense.", "trap": "Repairs hit the provision, not expense. The expense was booked when the goods were sold.", "klp": "T7 KLP: warranty expense estimated in the year of sale (matching); repairs reduce the provision", "source": "Topic 7 practice Q3 (E9-11) style"}, {"id": "T7-M45", "topic": "T7", "priority": 3, "template": "plug", "weak_spot": false, "stem": "Volt Ltd sells TVs with a one-year free-repair guarantee. Past experience: 5% of sets sold need a repair and the average repair costs $2,000. In 2026 Volt sold 1,200 sets and repaired 40 of them. There was no opening provision. What is the balance of the Warranty Provision at 31 December 2026?", "options": ["$120,000", "$80,000", "$200,000", "$40,000"], "answer": 3, "explanation": "Provision accrued = 1,200 x 5% x 2,000 = 120,000 (Dr Warranty Expense / Cr Warranty Provision). Repairs used = 40 x 2,000 = 80,000 (Dr Warranty Provision / Cr Supplies). Ending provision = 120,000 - 80,000 = 40,000. 120,000 is the expense for the year. 80,000 is the cost of repairs done. 200,000 adds instead of subtracts.", "trap": "Ending provision = opening + expense accrued - repairs used.", "klp": "T7 KLP: warranty expense estimated in the year of sale (matching); repairs reduce the provision", "source": "Topic 7 practice Q4 (P9-6 part 1) style"}, {"id": "T7-M46", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Last year Yarrow Ltd recorded a $300,000 provision for a breach-of-contract lawsuit. This year the plaintiff is claiming $2,000,000, lawyers now put the chance of losing at 75%, and the best reliable estimate of the payout is $800,000. What does Yarrow record at this year-end?", "options": ["Dr Lawsuit Loss 500,000 / Cr Lawsuit Provision 500,000", "Dr Lawsuit Loss 800,000 / Cr Lawsuit Provision 800,000", "Dr Lawsuit Loss 600,000 / Cr Lawsuit Provision 600,000", "Dr Lawsuit Loss 2,000,000 / Cr Lawsuit Provision 2,000,000"], "answer": 0, "explanation": "Probable (75%) and reliably estimable, so the provision must stand at the best estimate of 800,000. It is already 300,000, so top it up by 800,000 - 300,000 = 500,000. Option B double counts the 300,000 already recorded. Option C is 75% x 800,000; you never multiply the best estimate by the probability. Option D is the amount claimed, not the expected payment.", "trap": "Provision = best estimate; adjust the existing balance, do not re-record the whole amount.", "klp": "T7 KLP: contingencies: probable + reliable estimate = provision; possible = disclose; remote = nothing", "source": "Topic 7 practice Q4 (P9-6 part 2) style"}, {"id": "T7-M47", "topic": "T7", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "Delta Inc. (year-end 31 December 2026) signed two notes payable: on 1 August 2026 a 9-month, 6% note for $60,000, and on 1 December 2026 a 3-month, 9% note for $36,000. What total Interest Payable should Delta report at 31 December 2026?", "options": ["$3,510", "$1,500", "$1,770", "$6,840"], "answer": 2, "explanation": "Accrue only the months that have passed by year-end. Note 1: 60,000 x 6% x 5/12 (Aug-Dec) = 1,500. Note 2: 36,000 x 9% x 1/12 (Dec) = 270. Total = 1,770. Option A is the full-term interest on both notes (2,700 + 810), most of which belongs to 2027. Option B forgets the second note. Option D uses a full year of interest on both (3,600 + 3,240).", "trap": "Count months from the signing date to year-end, not the full term of the note.", "klp": "T7 KLP: accrued interest on notes payable = principal x rate x months/12; split interest on payment between Interest Payable (old year) and Interest Expense (new year)", "source": "Topic 7 practice Q5 (E11-10) style"}, {"id": "T7-M48", "topic": "T7", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "Refer to Delta Inc. above. On 1 March 2027 Delta pays the $36,000, 9%, 3-month note (signed 1 December 2026) with interest. Delta correctly accrued $270 at 31 December 2026. How much INTEREST EXPENSE is debited on 1 March 2027?", "options": ["$810", "$270", "$0", "$540"], "answer": 3, "explanation": "Total interest = 36,000 x 9% x 3/12 = 810. 270 was already expensed in 2026 and sits in Interest Payable. The remaining 2 months (Jan-Feb 2027) = 36,000 x 9% x 2/12 = 540 is the 2027 expense. Entry: Dr Notes Payable 36,000, Dr Interest Payable 270, Dr Interest Expense 540 / Cr Cash 36,810. Option A expenses all 810 in 2027 (double counting the 270). Option B is the payable, not the new expense. Option C assumes no interest belongs to 2027.", "trap": "On payment: clear Interest Payable for last year's months, expense only this year's months.", "klp": "T7 KLP: accrued interest on notes payable = principal x rate x months/12; split interest on payment between Interest Payable (old year) and Interest Expense (new year)", "source": "Topic 7 practice Q5 (E11-10) style"}, {"id": "T7-M49", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Refer to Delta Inc. above. How much cash does Delta pay on 1 May 2027 when the $60,000, 6%, 9-month note (signed 1 August 2026) matures?", "options": ["$62,700", "$63,600", "$61,500", "$60,000"], "answer": 0, "explanation": "Interest for the whole 9-month term = 60,000 x 6% x 9/12 = 2,700. Cash = principal + total interest = 62,700. Entry: Dr Notes Payable 60,000, Dr Interest Payable 1,500, Dr Interest Expense 1,200 / Cr Cash 62,700. Option B charges a full year of interest. Option C pays only the interest accrued at year-end. Option D forgets interest.", "trap": "Cash at maturity = principal + interest for the FULL term, regardless of how it was split across years.", "klp": "T7 KLP: accrued interest on notes payable = principal x rate x months/12; split interest on payment between Interest Payable (old year) and Interest Expense (new year)", "source": "Topic 7 practice Q5 (E11-10) style"}, {"id": "T7-M50", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Use this for this question and the next. On 31 December 2025 Stone Ltd signs a $500,000, 8%, 10-year mortgage note. Annual payments of $80,000 are due each 31 December starting 31 December 2026. How much interest expense does Stone record for the year ended 31 December 2027 (the second payment)?", "options": ["$40,000", "$36,800", "$43,200", "$33,344"], "answer": 1, "explanation": "Year 1 (2026): interest 500,000 x 8% = 40,000; principal reduction 80,000 - 40,000 = 40,000; balance 460,000. Year 2 (2027): interest 460,000 x 8% = 36,800; principal reduction 43,200; balance 416,800. Option A is year 1 interest. Option C is the year 2 principal reduction. Option D is year 3 interest (416,800 x 8%).", "trap": "Interest is on the OPENING balance of each year, which falls after every payment.", "klp": "T7 KLP: instalment note: interest = opening balance x rate; principal = payment - interest", "source": "Topic 7 practice Q6 (P11-7) style (linked pair)"}, {"id": "T7-M51", "topic": "T7", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Refer to Stone Ltd above. On its balance sheet at 31 December 2026 (after the first payment), how should Stone report the mortgage?", "options": ["Current $43,200; non-current $416,800", "Current $40,000; non-current $420,000", "Current $80,000; non-current $380,000", "Current $0; non-current $460,000"], "answer": 0, "explanation": "After the first payment the balance is 460,000. The current portion is the principal that will be repaid in the NEXT year (2027): 80,000 - 36,800 interest = 43,200. Non-current = 460,000 - 43,200 = 416,800. Option B uses the 2026 principal reduction, which has already been paid. Option C classes the whole next payment as current, but 36,800 of it is future interest, not a liability yet. Option D ignores the reclassification.", "trap": "Current portion = next year's PRINCIPAL only, taken from the amortisation schedule.", "klp": "T7 KLP: current portion of long-term debt = principal due within one year", "source": "Topic 7 practice Q6 (P11-7 part 3) style (linked pair)"}, {"id": "T7-M52", "topic": "T7", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "Harbour Ltd issued $2,000,000 of 6%, 20-year bonds at face value on 1 September 2026. Interest is paid each 1 March and 1 September. What adjusting entry does Harbour make at 31 December 2026?", "options": ["Dr Bond Interest Expense 60,000 / Cr Bond Interest Payable 60,000", "Dr Bond Interest Expense 120,000 / Cr Bond Interest Payable 120,000", "Dr Bond Interest Expense 40,000 / Cr Cash 40,000", "Dr Bond Interest Expense 40,000 / Cr Bond Interest Payable 40,000"], "answer": 3, "explanation": "Four months (Sep-Dec) of interest have been incurred but not paid: 2,000,000 x 6% x 4/12 = 40,000, accrued as a payable. Option A is the semi-annual payment (6/12), not the accrued months. Option B is a whole year. Option C credits Cash, but no cash is paid until 1 March.", "trap": "Accrue months since the last payment date; bonds at face have no premium/discount to amortise.", "klp": "T7 KLP: bonds at face: Dr Cash / Cr Bonds Payable; accrue interest at year-end; premium/discount direction", "source": "Topic 7 practice Q7 (P11-10) style"}, {"id": "T7-M53", "topic": "T7", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "Refer to Harbour Ltd above. Which entry records the interest payment on 1 March 2027?", "options": ["Dr Bond Interest Expense 60,000 / Cr Cash 60,000", "Dr Bond Interest Expense 20,000, Dr Bond Interest Payable 40,000 / Cr Cash 60,000", "Dr Bond Interest Payable 60,000 / Cr Cash 60,000", "Dr Bond Interest Expense 40,000, Dr Bond Interest Payable 20,000 / Cr Cash 60,000"], "answer": 1, "explanation": "The semi-annual payment is 2,000,000 x 6% x 6/12 = 60,000. 40,000 of it (Sep-Dec) was accrued in 2026 and sits in Bond Interest Payable; the other 20,000 (Jan-Feb) is 2027 expense. Option A expenses the full 60,000 in 2027 and double counts the 2026 accrual. Option C treats the whole payment as a 2026 accrual. Option D swaps the two amounts.", "trap": "Payment after a year-end: Payable for last year's months, Expense for this year's months.", "klp": "T7 KLP: bonds at face: Dr Cash / Cr Bonds Payable; accrue interest at year-end; premium/discount direction", "source": "Topic 7 practice Q7 (P11-10) style"}, {"id": "T7-M54", "topic": "T7", "priority": 3, "template": "formula", "weak_spot": false, "stem": "Refer to Harbour Ltd above. For the year ended 31 December 2026 (the year of issue), how much cash interest did Harbour PAY and how much bond interest EXPENSE did it record?", "options": ["Paid $0; expense $40,000", "Paid $40,000; expense $40,000", "Paid $60,000; expense $60,000", "Paid $0; expense $0"], "answer": 0, "explanation": "The first coupon date is 1 March 2027, so no interest was paid in 2026. Under accrual accounting the 4 months of interest incurred (40,000) are still expensed in 2026 and recorded as a payable. Option B assumes cash moved. Option C uses a full half-year and assumes payment. Option D is cash-basis thinking: no payment, no expense.", "trap": "Expense follows time, cash follows the coupon dates.", "klp": "T7 KLP: bonds at face: Dr Cash / Cr Bonds Payable; accrue interest at year-end; premium/discount direction", "source": "Topic 7 practice Q7 (P11-10) style"}, {"id": "T7-M55", "topic": "T7", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Harbour Ltd's $2,000,000, 6%, 20-year bonds were issued at face value on 1 September 2026 and $40,000 of interest was accrued at 31 December 2026. How are these amounts presented on the 31 December 2026 balance sheet?", "options": ["Bonds Payable $2,040,000 as a non-current liability", "Bonds Payable $2,000,000 current; Bond Interest Payable $40,000 current", "Bonds Payable $2,000,000 non-current; Bond Interest Payable $40,000 current", "Bonds Payable $2,000,000 non-current; Bond Interest Payable $40,000 non-current"], "answer": 2, "explanation": "The principal is due in 20 years, so Bonds Payable is non-current. The accrued interest is due on 1 March 2027 (within a year), so Bond Interest Payable is a current liability. Option A wrongly merges interest into the bond balance. Option B treats a 20-year bond as current. Option D puts interest due in two months under non-current.", "trap": "Principal and accrued interest are separate accounts and can sit in different sections.", "klp": "T7 KLP: bonds at face: Dr Cash / Cr Bonds Payable; accrue interest at year-end; premium/discount direction", "source": "Topic 7 practice Q7 (P11-10) style"}, {"id": "T7-M56", "topic": "T7", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "Refer to Stone Ltd ($500,000, 8% mortgage, annual payment $80,000). Which entry records the FIRST payment on 31 December 2026?", "options": ["Dr Mortgage Payable 80,000 / Cr Cash 80,000", "Dr Interest Expense 80,000 / Cr Cash 80,000", "Dr Interest Expense 36,800, Dr Mortgage Payable 43,200 / Cr Cash 80,000", "Dr Interest Expense 40,000, Dr Mortgage Payable 40,000 / Cr Cash 80,000"], "answer": 3, "explanation": "First-year interest = 500,000 x 8% = 40,000. The rest of the 80,000 payment, 40,000, reduces the principal. Option A treats the whole payment as principal (no interest). Option B treats it all as interest. Option C uses the year 2 split.", "trap": "Every instalment is part interest (opening balance x rate) and part principal.", "klp": "T7 KLP: instalment note: interest = opening balance x rate; principal = payment - interest", "source": "Topic 7 practice Q6 (P11-7 part 2) style"}], "short": [{"id": "T1-S01", "topic": "T1", "priority": 3, "question": "What is GAAP and why is it important? Give one limitation of GAAP-based, audited statements.", "model_answer": "- GAAP is the common set of rules and standards that tells companies how to prepare and present financial statements.\n- It matters because it makes statements comparable across companies and over time, improves credibility, and reduces the information gap between managers and outside investors.\n- Limitation: an audit gives reasonable, not absolute, assurance; judgment still exists (e.g. choice of FIFO vs average cost), so statements are not guaranteed error-free or identical across firms.", "marking": "1 mark definition (common rules/standards), 1 mark why (comparability/credibility/information asymmetry), 1 mark limitation (reasonable assurance / judgment remains)."}, {"id": "T1-S02", "topic": "T1", "priority": 3, "question": "Explain in your own words what Retained Earnings represents. Why are dividends not an expense?", "model_answer": "- Retained earnings is the cumulative net income the company has earned since it started, less all dividends declared; it is an owners' claim, not a pile of cash.\n- Ending RE = Beginning RE + Net income - Dividends. Example: Beg 100,000 + NI 30,000 - Div 10,000 = 120,000.\n- Dividends are a distribution of profit to owners, not a cost of earning revenue, so they bypass the income statement and reduce RE directly (Dr Retained Earnings / Cr Cash or Dividends Payable).", "marking": "1 mark meaning (cumulative undistributed profit, not cash), 1 mark formula/example, 1 mark dividends = distribution to owners, not a cost of generating revenue."}, {"id": "T1-S03", "topic": "T1", "priority": 2, "question": "What is the difference between revenue and a gain, and between an expense and a loss? Give one example of each.", "model_answer": "- Revenue and expenses come from the company's primary, ongoing operations; gains and losses come from peripheral or incidental events.\n- Example: a car dealer's sale of a car is revenue (full selling price) and its salaries are expenses; selling its old tow truck above book value creates a gain, and storm damage to equipment is a loss.\n- Why it matters: separating core from peripheral results helps users predict future performance, since gains and losses are unlikely to repeat.", "marking": "1 mark primary vs peripheral distinction, 1 mark examples (at least one revenue/gain and one expense/loss), 1 mark why the split matters (predictive value / shown separately)."}, {"id": "T1-S04", "topic": "T1", "priority": 2, "question": "Name the four major financial statements and describe how they are linked to each other.", "model_answer": "- Income statement, statement of changes in equity (retained earnings), balance sheet, statement of cash flows.\n- Links: net income from the income statement flows into retained earnings in the statement of changes in equity; ending retained earnings appears in the equity section of the balance sheet; ending cash on the statement of cash flows equals cash on the balance sheet.\n- Why: the statements are one connected system; a change in one (e.g. an unrecorded expense) flows through net income, retained earnings and the balance sheet.", "marking": "1 mark naming all four, 1 mark at least two correct links (NI -> RE; RE -> B/S; SCF cash = B/S cash), 1 mark explanation/consequence."}, {"id": "T1-S05", "topic": "T1", "priority": 2, "question": "How are assets and liabilities classified as current or non-current, and what determines the order in which they are listed on the balance sheet?", "model_answer": "- Current = expected to be converted to cash, used up or settled within one year (or the operating cycle if longer); everything else is non-current. Example: inventory and accounts payable are current; a building and a 5-year bond payable are non-current.\n- Only the portion of long-term debt due within 12 months is reclassified as a current liability; paying interest monthly does not make the loan current.\n- Order is by liquidity (assets) and by maturity (liabilities): cash first, then receivables, inventory, then long-term assets; current liabilities before long-term debt.", "marking": "1 mark one-year/operating-cycle rule with examples, 1 mark current portion of long-term debt point, 1 mark order by liquidity/maturity."}, {"id": "T1-S06", "topic": "T1", "priority": 3, "question": "Explain the going-concern assumption and the time-period assumption. Why does each matter for the financial statements?", "model_answer": "- Going concern: the company is expected to continue operating for the foreseeable future. It lets us record assets at historical cost and classify them as current/non-current; if liquidation is likely, assets must be shown at liquidation values.\n- Time period: the life of the business is divided into regular reporting periods (quarters, years).\n- Time period is the reason we need accrual accounting, revenue recognition and matching, and therefore adjusting entries, to assign revenues and expenses to the right period.", "marking": "1 mark going-concern definition and consequence (historical cost), 1 mark time-period definition, 1 mark link to accrual accounting/adjusting entries."}, {"id": "T1-S07", "topic": "T1", "priority": 2, "question": "What do 'owners' claims' on a balance sheet consist of, and how do they differ from creditors' claims?", "model_answer": "- Owners' claims = shareholders' equity = share capital (amounts invested by owners) + retained earnings (profits kept in the business). It equals total assets minus total liabilities.\n- Creditors' claims = liabilities (accounts payable, notes payable, unearned revenue); these must be settled first.\n- Equity is the residual claim: owners get what is left after creditors are paid, which is why equity rises with net income and share issues and falls with losses and dividends.", "marking": "1 mark share capital + retained earnings, 1 mark liabilities = creditors' claims with examples, 1 mark residual/priority explanation."}, {"id": "T2-S01", "topic": "T2", "priority": 3, "question": "What is the purpose of a trial balance? Name two types of errors that a trial balance will NOT detect.", "model_answer": "- A trial balance lists all ledger balances to prove that total debits equal total credits before statements are prepared.\n- It will not detect: (1) a transaction recorded in the wrong account with the correct amount (e.g. Dr Rent Expense instead of Salaries Expense); (2) a transaction omitted entirely; (3) two offsetting errors; (4) the same wrong amount on both sides.\n- Why it matters: a balanced trial balance means the arithmetic is right, not that the accounts are correct.", "marking": "1 mark purpose (Dr = Cr check), 1 mark each for two undetectable error types (max 2)."}, {"id": "T2-S02", "topic": "T2", "priority": 3, "question": "Explain the debit/credit rules for revenue, expense and dividend accounts, and why these rules follow from their effect on equity.", "model_answer": "- Equity increases are credits and decreases are debits. Revenue increases retained earnings, so an increase in revenue is a credit.\n- Expenses and dividends decrease retained earnings, so increases in expenses and dividends are debits. (DEA|LER: Dividends, Expenses, Assets = debit; Liabilities, Equity, Revenue = credit.)\n- Example: Dr Accounts Receivable / Cr Service Revenue 5,000 raises equity; Dr Salaries Expense / Cr Cash 2,000 lowers it; Dr Dividends / Cr Cash 1,000 lowers it but is not an expense.", "marking": "1 mark revenue = credit because it raises equity, 1 mark expenses and dividends = debit because they lower equity, 1 mark example journal entries / DEALER."}, {"id": "T2-S03", "topic": "T2", "priority": 2, "question": "Describe the three steps you take before recording a transaction, and show them for: 'Bought a $40,000 truck, paying $10,000 cash and signing a note for the rest'.", "model_answer": "- Step 1: analyze the effect on the accounting equation: assets +40,000 (truck) and -10,000 (cash); liabilities +30,000 (note). Equation stays balanced (+30,000 both sides).\n- Step 2: identify the accounts: Truck, Cash, Notes Payable. Step 3: determine the amounts and apply debit/credit rules.\n- Entry: Dr Truck 40,000 / Cr Cash 10,000 / Cr Notes Payable 30,000. The asset is recorded at full cost; total debits (40,000) equal total credits (40,000).", "marking": "1 mark three steps (analyze equation, identify accounts, determine amounts), 1 mark correct compound entry, 1 mark explanation that asset is at full cost and Dr = Cr."}, {"id": "T2-S04", "topic": "T2", "priority": 2, "question": "What is the difference between the journal and the general ledger, and what is 'posting'?", "model_answer": "- The journal is the book of original entry: each transaction is recorded in date order with its debits and credits.\n- The ledger holds one account (T-account) for every item; it summarizes all the effects on that account and gives its balance.\n- Posting is copying each journal debit and credit into the proper ledger accounts. Flow: transaction -> journal -> ledger -> trial balance -> financial statements.", "marking": "1 mark journal (chronological record), 1 mark ledger (summary by account / T-accounts), 1 mark posting and the flow."}, {"id": "T3-S01", "topic": "T3", "priority": 3, "question": "What is the difference between accrual-basis and cash-basis accounting? Illustrate with numbers.", "model_answer": "- Accrual basis records revenue when earned and expenses when incurred, regardless of cash timing; cash basis records them only when cash moves. IFRS requires accrual.\n- Example: a firm bills $50,000 for work done this year but collects $30,000; it incurs $20,000 of costs and pays $15,000. Accrual NI = 50,000 - 20,000 = 30,000; cash NI = 30,000 - 15,000 = 15,000.\n- Accrual gives a better picture of performance for the period because it matches effort and results; this is required by the time-period assumption.", "marking": "1 mark definitions, 1 mark numeric example showing the difference, 1 mark why accrual is preferred (matching/time period)."}, {"id": "T3-S02", "topic": "T3", "priority": 3, "question": "What is the purpose of adjusting entries? What happens to the financial statements if a company forgets to accrue salaries earned but unpaid at year-end?", "model_answer": "- Adjusting entries update the accounts at period-end so revenues earned and expenses incurred in the period are recorded under accrual accounting; they never involve cash.\n- Missing entry: Dr Salaries Expense / Cr Salaries Payable. Without it, expenses and liabilities are understated and net income and equity are overstated.\n- Why it matters: the income statement would overstate performance and the balance sheet would hide an obligation, misleading users.", "marking": "1 mark purpose (bring accounts to accrual basis; no cash), 1 mark correct entry and over/understatement effects, 1 mark consequence for users."}, {"id": "T3-S03", "topic": "T3", "priority": 3, "question": "Describe the four types of adjusting entries, grouping them into 'cash first' and 'cash later', with one example each.", "model_answer": "- Cash first (deferrals): prepaid expense (paid in advance; adjust Dr Expense / Cr Prepaid, e.g. insurance used) and unearned revenue (collected in advance; adjust Dr Unearned Revenue / Cr Revenue, e.g. subscription delivered).\n- Cash later (accruals): accrued expense (incurred, not yet paid; Dr Expense / Cr Payable, e.g. wages, interest) and accrued revenue (earned, not yet received; Dr Receivable / Cr Revenue, e.g. interest on a note).\n- Why: each entry moves an amount between the balance sheet and the income statement so the period's revenue and expense are correct.", "marking": "1 mark deferrals with examples and entries, 1 mark accruals with examples and entries, 1 mark cash-first/cash-later grouping and purpose."}, {"id": "T3-S04", "topic": "T3", "priority": 3, "question": "Why do companies close their temporary accounts at year-end, and how is each type closed?", "model_answer": "- Revenue, expense and dividend accounts measure one period's performance; closing resets them to zero so the next year 'starts afresh', while their net effect is carried into Retained Earnings (a permanent account).\n- Revenue: Dr Revenue / Cr Retained Earnings. Expenses: Dr Retained Earnings / Cr each Expense. Dividends: Dr Retained Earnings / Cr Dividends.\nBalance sheet accounts (assets, liabilities and equity, including contra-assets such as Accumulated Depreciation, and liabilities such as Unearned Revenue) are permanent and are not closed.", "marking": "1 mark why (one period's performance; RE accumulates), 1 mark correct direction of the three closing entries, 1 mark permanent accounts not closed."}, {"id": "T3-S05", "topic": "T3", "priority": 3, "question": "Explain the matching principle and give two examples of how it is applied.", "model_answer": "- Matching: expenses are recognized in the same period as the revenues they help generate, regardless of when cash is paid.\n- Example 1: inventory becomes COGS at the time of sale, not when purchased. Example 2: bad debt expense is estimated in the period of the credit sale (Dr Bad Debt Expense / Cr Allowance), not when the customer defaults. Also: depreciation spreads an asset's cost over the years it is used; a prepaid is expensed as it is used.\n- Why: it gives a fair measure of profit for each period, which is needed because of the time-period assumption.", "marking": "1 mark definition (same period, ignore cash), 1 mark two valid examples, 1 mark importance."}, {"id": "T3-S06", "topic": "T3", "priority": 2, "question": "Explain the revenue recognition principle. When is revenue recognized for (a) services performed in December and billed in January, and (b) cash received in December for services to be performed in February?", "model_answer": "- Revenue is recognized when it is earned: control of the goods or services has passed to the customer and the amount is measurable and collectible, regardless of cash timing.\n- (a) December: Dr Accounts Receivable / Cr Service Revenue (accrued revenue). (b) Not in December: Dr Cash / Cr Unearned Revenue (a liability) until the service is performed in February.\n- Why: this stops companies from recording revenue early or late and keeps income in the right period.", "marking": "1 mark principle, 1 mark correct treatment and entries for (a) and (b), 1 mark reason."}, {"id": "T3-S07", "topic": "T3", "priority": 2, "question": "A company paid $24,000 on 1 October 2026 for a two-year insurance policy and debited Prepaid Insurance. Show the 31 December 2026 adjusting entry and explain the effect on the balance sheet and income statement.", "model_answer": "- Monthly cost = 24,000 / 24 = 1,000. Three months (Oct-Dec) have expired: Dr Insurance Expense 3,000 / Cr Prepaid Insurance 3,000.\n- Balance sheet: Prepaid Insurance falls to 21,000 (the unexpired 21 months). Income statement: 3,000 insurance expense for 2026.\n- If omitted: assets and net income overstated by 3,000, expenses understated. Pro-rate over the TOTAL 24 months, not over 12.", "marking": "1 mark correct entry and amount (3,000), 1 mark effects on B/S (21,000 remains) and I/S, 1 mark effect if omitted / pro-rating explanation."}, {"id": "T3-S08", "topic": "T3", "priority": 2, "question": "Which accounts are temporary and which are permanent? Why does Unearned Revenue stay open at year-end even though its name contains 'revenue'?", "model_answer": "- Temporary (nominal): revenues, expenses, dividends, and contra-revenue accounts such as Sales Discounts; they are closed to Retained Earnings.\n- Permanent (real): assets, liabilities and equity, including contra-assets like Allowance for Bad Debts and Accumulated Depreciation; their balances carry forward.\n- Unearned Revenue is a liability (the company owes goods or services), so it is permanent; only when it is earned does it move to Revenue, which is then closed.", "marking": "1 mark temporary list, 1 mark permanent list incl. contra-assets, 1 mark Unearned Revenue = liability explanation."}, {"id": "T3-S09", "topic": "T3", "priority": 1, "question": "Why are adjusting entries never recorded with a debit or credit to Cash?", "model_answer": "- Adjusting entries fix timing differences between cash and accrual accounting at period-end; cash was either already recorded earlier (deferrals: prepaid, unearned) or will be recorded later (accruals: payables, receivables).\n- Example: insurance paid on 1 September was recorded as Dr Prepaid / Cr Cash then; the year-end entry is only Dr Insurance Expense / Cr Prepaid Insurance.\n- Exam tip: any adjusting-entry option that includes Cash is a distractor.", "marking": "1 mark reason (cash already or later recorded), 1 mark example, 1 mark statement that every adjusting entry pairs an I/S account with a B/S account other than cash."}, {"id": "T4-S01", "topic": "T4", "priority": 3, "question": "Why does a company record bad debt expense based on an estimate at year-end rather than waiting until a customer actually fails to pay?", "model_answer": "- Matching principle: the cost of selling on credit (some customers will not pay) belongs in the same period as the credit sales revenue, even though the specific defaults happen later.\n- Entry: Dr Bad Debt Expense / Cr Allowance for Bad Debts (estimate from the aging schedule). Later write-off: Dr Allowance / Cr Accounts Receivable, no effect on income.\n- It also reports receivables at net realizable value on the balance sheet, so assets and net income are not overstated.", "marking": "1 mark matching principle, 1 mark the two journal entries, 1 mark NRV / avoid overstating assets and income."}, {"id": "T4-S02", "topic": "T4", "priority": 3, "question": "Explain the two steps for using an aging schedule to determine bad debt expense. Why can two companies with the same aging total record different expenses?", "model_answer": "- Step 1: multiply each age bucket by its estimated uncollectible percentage and sum them; the total is the DESIRED ending balance of the allowance.\n- Step 2: expense = desired ending balance - existing credit balance (or + existing debit balance). Example: desired 13,500, existing credit 2,500 -> expense 11,000; existing debit 2,500 -> expense 16,000.\n- The same aging gives the same ending balance, but the top-up differs depending on where the allowance starts (affected by write-offs and recoveries during the year).", "marking": "1 mark step 1 (desired balance), 1 mark step 2 formula with debit/credit handling, 1 mark explanation of different starting balances."}, {"id": "T4-S03", "topic": "T4", "priority": 3, "question": "What does 'Accounts receivable, net' mean on the balance sheet, and why is the allowance kept in a separate contra-asset account instead of reducing Accounts Receivable directly?", "model_answer": "- A/R, net = gross A/R - Allowance for Bad Debts = net realizable value, the amount the company actually expects to collect.\n- The allowance is kept separate because it is an ESTIMATE while A/R is the actual amount owed; mixing them would hide the real receivable and the size of the estimate. The same logic applies to Accumulated Depreciation for PP&E.\n- When a specific account is identified as bad, it is written off against the allowance (Dr Allowance / Cr A/R), leaving NRV and net income unchanged.", "marking": "1 mark definition/formula of net A/R, 1 mark estimate vs actual reason for the separate contra account, 1 mark write-off has no effect on NRV/NI."}, {"id": "T4-S04", "topic": "T4", "priority": 2, "question": "Show the journal entries for (a) writing off a $500 customer account and (b) later recovering that $500. State the effect of each on net income and on net receivables.", "model_answer": "- (a) Write-off: Dr Allowance for Bad Debts 500 / Cr Accounts Receivable 500. Net income: no effect. Net A/R: no effect (both gross A/R and allowance fall by 500).\n- (b) Recovery: Dr Accounts Receivable 500 / Cr Allowance for Bad Debts 500 (reverse the write-off), then Dr Cash 500 / Cr Accounts Receivable 500. Net income: no effect; the allowance is increased (credited).\n- Why: the expense was already recognized when the estimate was made, so neither event touches the income statement.", "marking": "1 mark write-off entry with no NI/NRV effect, 1 mark two recovery entries, 1 mark explanation that income is unaffected because the expense was estimated earlier."}, {"id": "T4-S05", "topic": "T4", "priority": 3, "question": "A company accepts a $60,000, 6-month, 10% note receivable on 1 November 2026. Show the adjusting entry at 31 December 2026 and the entry at maturity if the customer pays in full.", "model_answer": "- Interest accrued at 31 Dec = 60,000 x 10% x 2/12 = 1,000: Dr Interest Receivable 1,000 / Cr Interest Revenue 1,000 (accrued revenue; cash later).\n- At maturity (1 May 2027), total interest = 60,000 x 10% x 6/12 = 3,000: Dr Cash 63,000 / Cr Notes Receivable 60,000 / Cr Interest Receivable 1,000 / Cr Interest Revenue 2,000.\n- If dishonored instead: Dr Accounts Receivable 63,000 / Cr Notes Receivable 60,000 / Cr Interest Receivable 1,000 / Cr Interest Revenue 2,000; the interest is still earned.", "marking": "1 mark correct accrual (1,000) with Interest Receivable, 1 mark maturity entry splitting prior accrual and new revenue, 1 mark dishonor treatment / principal x rate x time explanation."}, {"id": "T4-S06", "topic": "T4", "priority": 2, "question": "What happens when a note receivable is dishonored? Why does the company still record interest revenue?", "model_answer": "- Dishonored means the maker fails to pay at maturity. The company transfers the principal plus the interest earned (and any bank charge) from Notes Receivable to Accounts Receivable: Dr A/R / Cr Notes Receivable / Cr Interest Revenue.\n- The interest was earned over the note period under accrual accounting, so it is revenue whether or not it has been collected; the customer now owes it.\n- If the receivable later proves uncollectible, it is written off against the allowance (Dr Allowance / Cr A/R), not against revenue.", "marking": "1 mark definition and transfer to A/R, 1 mark correct entry including interest, 1 mark accrual reasoning and later write-off."}, {"id": "T5-S01", "topic": "T5", "priority": 3, "question": "In a period of rising prices, how do FIFO and LIFO differ in their effect on COGS, ending inventory and net income? Why is LIFO not allowed under IFRS?", "model_answer": "- FIFO charges the oldest (cheaper) costs to COGS, so COGS is lowest, ending inventory and net income are highest. LIFO charges the newest (dearer) costs, so COGS is highest and ending inventory and net income are lowest. In falling prices the ranking flips.\n- Example: 3 units at $10 then 5 at $12, sell 4: FIFO COGS 42, LIFO COGS 48.\n- IFRS (and Singapore FRS 2) prohibits LIFO because it leaves old, outdated costs on the balance sheet and usually does not reflect the physical flow of goods; FIFO and weighted average are allowed.", "marking": "1 mark correct FIFO/LIFO directions for COGS, EI, NI, 1 mark example or falling-price flip, 1 mark reason LIFO banned."}, {"id": "T5-S02", "topic": "T5", "priority": 3, "question": "What costs are included in the cost of inventory? Give two costs that are included and two that are excluded, and explain the difference in treatment of freight-in and freight-out.", "model_answer": "- Inventory cost = all costs of purchase plus other costs to bring goods to their present location and condition: purchase price, import duties, freight-in, less purchase returns, allowances and discounts.\n- Excluded (expensed when incurred): freight-out to customers (Delivery Expense), storage after receipt, abnormal spoilage, advertising and selling costs.\n- Freight-in is needed to get the goods ready for sale so it is capitalized (Dr Inventory); freight-out is a cost of selling, so it is an operating expense and never part of COGS or inventory.", "marking": "1 mark definition with two included costs, 1 mark two excluded costs, 1 mark freight-in vs freight-out explanation."}, {"id": "T5-S03", "topic": "T5", "priority": 3, "question": "Explain FOB shipping point and FOB destination. For goods in transit at year-end, who includes them in inventory, and when does the seller recognize revenue?", "model_answer": "- FOB shipping point: ownership passes when goods leave the seller; the buyer owns goods in transit, includes them in inventory, and usually pays freight. The seller recognizes revenue at shipment.\n- FOB destination: ownership passes on arrival at the buyer; the seller keeps in-transit goods in inventory and recognizes revenue only on delivery.\n- Consigned goods are similar: the consignor (owner) keeps them in inventory, even though the consignee holds them. Physical possession is not ownership.", "marking": "1 mark FOB shipping point rules, 1 mark FOB destination rules, 1 mark revenue timing / consignment link."}, {"id": "T5-S04", "topic": "T5", "priority": 3, "question": "Under the perpetual system, show the buyer's entries for: a purchase on account of $10,000; freight-in of $400 paid in cash; a $600 purchase return; payment within the 2/10, n/30 discount period.", "model_answer": "- Purchase: Dr Inventory 10,000 / Cr Accounts Payable 10,000. Freight-in: Dr Inventory 400 / Cr Cash 400.\n- Return: Dr Accounts Payable 600 / Cr Inventory 600. Payment: amount owing 9,400, discount 2% = 188: Dr Accounts Payable 9,400 / Cr Inventory 188 / Cr Cash 9,212.\n- Under perpetual every cost change goes through Inventory; there are no Purchases, Purchase Returns or Purchase Discounts accounts (those are periodic).", "marking": "1 mark purchase and freight-in entries, 1 mark return and discount entries with correct amounts (188 / 9,212), 1 mark explanation that all go through Inventory under perpetual."}, {"id": "T5-S05", "topic": "T5", "priority": 3, "question": "What does 'net sales revenue' mean? Show the seller's entries for a $2,000 sale on account with terms 1/10, n/30 when the customer returns $500 of goods (cost $300) and pays the balance within the discount period.", "model_answer": "- Net sales = gross sales - sales returns - sales allowances - sales discounts; these three are contra-revenue accounts (debit balances) that reduce revenue, not expenses.\n- Sale: Dr A/R 2,000 / Cr Sales 2,000 (plus Dr COGS / Cr Inventory at cost). Return: Dr Sales Returns and Allowances 500 / Cr A/R 500 and Dr Inventory 300 / Cr COGS 300.\n- Payment: discount = 1% x 1,500 = 15: Dr Cash 1,485 / Dr Sales Discounts 15 / Cr A/R 1,500. Net sales = 2,000 - 500 - 15 = 1,485.", "marking": "1 mark net sales definition with contra-revenue accounts, 1 mark return entries (including inventory at cost), 1 mark discount entry with 15 and 1,485."}, {"id": "T5-S06", "topic": "T5", "priority": 2, "question": "Explain how the perpetual moving-average method works and why its answer differs from a single periodic weighted average. Use: 100 units at $10, buy 100 at $14, sell 150, buy 100 at $16.", "model_answer": "- Moving average recomputes the average cost after EVERY purchase and uses the current average for each sale. After the first purchase: 200 units, 2,400, avg $12. Sale of 150 = 1,800 COGS; 50 left at $12 = 600. After the last purchase: 150 units, 2,200, avg $14.67; ending inventory 2,200.\n- Periodic weighted average uses one average for the whole period: 4,000/300 = $13.33; COGS 150 x 13.33 = 2,000, ending inventory 2,000.\n- They differ because the periodic average lets a purchase made AFTER a sale affect that sale's cost, which cannot happen under a perpetual system.", "marking": "1 mark moving-average mechanics with correct numbers (COGS 1,800, EI 2,200), 1 mark periodic contrast (2,000), 1 mark reason for the difference."}, {"id": "T5-S07", "topic": "T5", "priority": 2, "question": "Under a perpetual system, what two entries are made when goods are sold, and why is the cost of inventory described as moving 'from the balance sheet to the income statement'?", "model_answer": "- Entry 1 at selling price: Dr Accounts Receivable (or Cash) / Cr Sales Revenue. Entry 2 at cost: Dr Cost of Goods Sold / Cr Inventory.\n- Inventory is an asset (balance sheet) while it is held; when sold, its cost becomes an expense (COGS, income statement) in the same period as the revenue, applying the matching principle.\n- Gross profit = sales - COGS shows the margin on the goods; freight-out and other selling costs are operating expenses below gross profit.", "marking": "1 mark both entries, 1 mark asset-to-expense explanation with matching, 1 mark gross profit / what is not in COGS."}, {"id": "T6-S01", "topic": "T6", "priority": 3, "question": "Why do companies credit Accumulated Depreciation instead of crediting the PP&E account directly when recording depreciation?", "model_answer": "- Accumulated Depreciation is a contra-asset (credit balance) shown as a deduction from PP&E; the entry is Dr Depreciation Expense / Cr Accumulated Depreciation.\n- The asset's cost is an actual, reliable figure; depreciation is only an estimate (useful life and residual value are guesses). Keeping them apart shows both, e.g. Equipment 10,000 less Accumulated Depreciation 1,000 = 9,000 net.\n- It is the same idea as the Allowance for Doubtful Accounts against A/R: users can see the original cost, how much has been used up, and the carrying amount.", "marking": "1 mark: contra-asset / entry; 1 mark: separates actual cost from estimate; 1 mark: analogy with allowance or usefulness to users"}, {"id": "T6-S02", "topic": "T6", "priority": 3, "question": "Explain how to decide whether a cost incurred on an existing PP&E item should be capitalised or expensed, and how each treatment affects net income and total assets in the current year.", "model_answer": "- Capitalise (debit the asset) if the cost increases capacity or efficiency or extends useful life, e.g. an engine overhaul; expense (Repairs and Maintenance) if it only maintains working order, e.g. oil changes, tyres, paint.\n- Capitalising raises assets and keeps current expenses low, so net income is higher this year (the cost is depreciated over future years). Expensing lowers assets and net income this year.\n- It matters because the choice can be abused: WorldCom capitalised ordinary operating costs and overstated both assets and profit.", "marking": "1 mark: decision rule with example; 1 mark: effects on NI and assets; 1 mark: why it matters / misstatement direction"}, {"id": "T6-S03", "topic": "T6", "priority": 3, "question": "What is goodwill, how is it calculated when one company buys another, and how is it accounted for after acquisition?", "model_answer": "- Goodwill = purchase price - market (fair) value of the net assets acquired (market value of assets - liabilities). It represents the extra earning power the buyer paid for.\n- Example: pay 9m for a company whose assets have market value 15m and liabilities 10m: net assets 5m, goodwill 4m. Entry: Dr Assets 15m, Dr Goodwill 4m / Cr Liabilities 10m, Cr Cash 9m.\n- Goodwill is recorded only on acquisition (never internally generated), is not amortised, and is tested for impairment each year to avoid overstating assets and net income.", "marking": "1 mark: definition/formula with market value; 1 mark: worked example or entry; 1 mark: not amortised, impairment-tested, only on acquisition"}, {"id": "T6-S04", "topic": "T6", "priority": 2, "question": "Why are indefinite-life intangible assets such as goodwill tested for impairment annually instead of being amortised? Under IFRS, why is research expensed but development capitalised?", "model_answer": "- Indefinite-life intangibles have no reliable useful life to spread the cost over, so amortisation would be arbitrary; instead the company checks each year that the carrying amount is not above its recoverable amount, so assets and net income are not overstated.\n- If impaired: Dr Impairment Loss / Cr Accumulated Impairment Loss (or the asset).\n- Research is expensed because there is little certainty about technical feasibility and future benefits; development is capitalised (when criteria are met) because the project is further along and future benefits are more certain. US GAAP expenses both.", "marking": "1 mark: why impairment test (avoid overstating assets/NI); 1 mark: research expensed due to uncertainty; 1 mark: development capitalised due to greater certainty / criteria"}, {"id": "T6-S05", "topic": "T6", "priority": 3, "question": "Describe the steps to record the sale of a PP&E item part-way through the year and give the journal entry for a sale at a loss.", "model_answer": "- Step 1: record depreciation from the start of the year to the sale date (annual depreciation x months/12) so the accumulated depreciation and book value are up to date.\n- Step 2: gain or loss = cash proceeds - book value (cost - accumulated depreciation). Proceeds above book value = gain; below = loss.\n- Step 3 entry (loss case): Dr Cash, Dr Accumulated Depreciation, Dr Loss on Sale / Cr Equipment (at cost). Example: cost 24,000, accumulated 18,000, sold for 5,000: loss 1,000.", "marking": "1 mark: update depreciation to sale date; 1 mark: gain/loss = proceeds - book value; 1 mark: correct journal entry"}, {"id": "T6-S06", "topic": "T6", "priority": 2, "question": "What costs are included in the initial cost of PP&E? Give two examples of costs that are included and two that are not.", "model_answer": "- Rule: cost includes ALL costs needed to bring the asset to the location and condition for its intended use (purchase price net of discounts, freight, insurance in transit, sales tax, installation, testing; for land: legal fees, demolition of old buildings net of salvage, grading).\n- Included examples: installation and testing of a machine; demolition of an unwanted building on newly bought land.\n- Not included: staff training, a launch party, annual insurance and repairs after the asset is in use (expenses), because they do not make the asset itself ready for use.", "marking": "1 mark: 'all costs to ready for intended use' rule; 1 mark: two correct included examples; 1 mark: two correct excluded examples with reason"}, {"id": "T6-S07", "topic": "T6", "priority": 2, "question": "A company bought land, a building and equipment for one lump sum. How does it decide the cost of each asset, and why does it matter which asset gets more of the cost?", "model_answer": "- Allocate the lump sum in proportion to the relative market (fair) values of the assets: each asset's cost = total price x (its market value / total market value). The seller's book values are ignored.\n- Example: pay 180,000 for assets with market values 75,000 (land), 100,000 (building), 50,000 (equipment) = 225,000 total: land 60,000, building 80,000, equipment 40,000.\n- It matters because land is not depreciated while the building and equipment are, over different lives, so the split changes future depreciation expense and net income.", "marking": "1 mark: relative market value method; 1 mark: worked example; 1 mark: why it matters (depreciation differs, land not depreciated)"}, {"id": "T6-S08", "topic": "T6", "priority": 2, "question": "What are the three estimates or inputs needed to compute straight-line depreciation, and why can two companies report different depreciation for an identical asset?", "model_answer": "- Cost (including capitalised costs), estimated useful life, and estimated residual (salvage) value. Depreciable cost = cost - residual; annual expense = depreciable cost / useful life, pro-rated by months in the first year.\n- Example: (24,000 - 2,000) / 4 = 5,500 a year; bought 1 July: 2,750 in year 1.\n- Useful life and residual value are management estimates, so two companies can choose different estimates (and different methods) for the same asset, giving different expense and net income. The method must reflect how the asset's benefits are used up and be applied consistently.", "marking": "1 mark: three inputs; 1 mark: formula/example; 1 mark: estimates differ between companies / consistency"}, {"id": "T6-S09", "topic": "T6", "priority": 2, "question": "Explain what 'PP&E, net' means on the balance sheet and what a 'change in depreciation estimate' does to it.", "model_answer": "- PP&E, net (carrying amount or book value) = original cost - accumulated depreciation to date. It is not market value.\n- Example: Building 120,000 less accumulated depreciation 80,000 = 40,000 net.\n- When useful life or residual value is revised, nothing is restated: the current book value less the new residual is spread over the remaining revised life, so future depreciation (and the rate at which PP&E, net falls) changes from that date onward.", "marking": "1 mark: definition of net; 1 mark: example; 1 mark: prospective treatment of estimate change"}, {"id": "T7-S01", "topic": "T7", "priority": 3, "question": "Why would a company record a liability and the related expense based on an estimate rather than wait until the actual amount is known? Give two examples.", "model_answer": "- The matching principle: an expense caused by this period's sales must be recognised in the same period as the revenue, even if the exact amount is unknown; otherwise this year's profit is overstated and next year's understated.\n- Example 1: warranty expense estimated as a % of sales (Dr Warranty Expense / Cr Provision for Warranty Repairs); claims are later charged to the provision. Example 2: bad debt expense estimated from an aging schedule (Dr Bad Debt Expense / Cr Allowance).\n- Users get a liability on the balance sheet that shows the obligation exists now; waiting for actual claims would understate liabilities and expenses.", "marking": "1 mark: matching principle explained; 1 mark: two valid examples with entries; 1 mark: consequence of waiting / why it matters to users"}, {"id": "T7-S02", "topic": "T7", "priority": 3, "question": "Explain the contingent liability flowchart: when should a company record a provision, when should it only disclose, and when does it do nothing?", "model_answer": "- Step 1: is there a present obligation from a past event (legal or constructive, e.g. a public promise), or only a possible obligation? Step 2: is payment probable (more than 50%), reasonably possible (remote < P <= 50%) or remote? Step 3: can the amount be reliably estimated?\n- Record a provision (Dr Loss or Expense / Cr Provision, at the best estimate) when there is a present obligation, payment is probable AND the amount can be estimated. Disclose a contingent liability in the notes when payment is reasonably possible, or when it is probable but cannot be estimated, or when the obligation is only possible and not remote. Do nothing when the chance of payment is remote.\n- Example: lawsuit with 60% chance of paying a best estimate of 400,000 on a 500,000 claim: record 400,000. Same lawsuit at 30%: disclose only. Reassess at every reporting date.", "marking": "1 mark: the three tests (present/possible, probability thresholds, estimate); 1 mark: record vs disclose vs nothing correctly mapped; 1 mark: example with best-estimate amount"}, {"id": "T7-S03", "topic": "T7", "priority": 3, "question": "A company signs a 6-month note payable two months before its year-end. Explain why an adjusting entry is needed at year-end, show the entry, and show what happens when the note is paid at maturity.", "model_answer": "- Accrual accounting: interest is an expense of the months the money was used, even though no cash is paid until maturity. Without the entry, expenses and liabilities are understated and net income overstated.\n- Year-end: Dr Interest Expense / Cr Interest Payable for principal x annual rate x 2/12 (e.g. 90,000 x 8% x 2/12 = 1,200). Adjusting entries never touch Cash or Notes Payable.\n- At maturity: Dr Notes Payable (principal), Dr Interest Payable (the 2 months accrued), Dr Interest Expense (the remaining 4 months) / Cr Cash (principal plus total interest).", "marking": "1 mark: reason (accrual/matching, effect if omitted); 1 mark: correct year-end entry with months/12; 1 mark: maturity entry clearing Interest Payable"}, {"id": "T7-S04", "topic": "T7", "priority": 2, "question": "What is the current portion of long-term debt, and why is it reclassified? Does the way interest is paid affect the classification?", "model_answer": "- It is the principal of a long-term loan that falls due within the next 12 months (or operating cycle). At each balance-sheet date it is moved from non-current to current liabilities, e.g. a 400,000 loan with 80,000 due next year shows 80,000 current and 320,000 non-current.\n- Reclassifying matters for liquidity analysis: users compare current liabilities with current assets to judge whether the company can pay what is due soon.\n- Interest timing does not affect it: monthly interest payments do not make the whole loan current. Interest already owed is shown separately as Interest Payable.", "marking": "1 mark: definition with example; 1 mark: why (liquidity / proper classification); 1 mark: interest frequency irrelevant, interest payable separate"}, {"id": "T7-S05", "topic": "T7", "priority": 3, "question": "How do you tell whether a bond will be issued at a premium, at face value or at a discount? Explain in simple terms why.", "model_answer": "- Compare the bond's stated (coupon) rate with the market (effective) rate investors require when the bond is issued: stated above market = premium (cash received above face value); equal = face (par) value; stated below market = discount (cash below face value).\n- Why: the coupon cash payments are fixed by the contract. If the coupon is less attractive than the market, investors will only buy if they pay less than face value, so their overall return rises to the market rate; the opposite for a generous coupon.\n- Example: face 1,000,000, coupon 5%, market 6%: issued at a discount (price below 1,000,000). The issue entry is Dr Cash / Cr Bonds Payable; the actual PV calculation is not required.", "marking": "1 mark: the three comparisons correctly stated; 1 mark: explanation that coupon is fixed so price adjusts; 1 mark: example"}, {"id": "T7-S06", "topic": "T7", "priority": 2, "question": "Describe how an instalment note payment is split between interest and principal, and give the journal entries at year-end and on the payment date.", "model_answer": "- Interest expense = unpaid principal at the start of the period x interest rate; principal reduction = instalment payment - interest; new balance = old balance - principal reduction. Because the balance falls, the interest share falls and the principal share rises each year.\n- Example: 500,000 at 6%, payment 118,700: year 1 interest 30,000, principal 88,700, balance 411,300; year 2 interest 24,678.\n- Year-end: Dr Interest Expense 30,000 / Cr Interest Payable 30,000. Payment date: Dr Interest Payable 30,000, Dr Notes Payable 88,700 / Cr Cash 118,700. The 88,700 due within a year is the current portion of long-term debt.", "marking": "1 mark: formulas and the falling-interest pattern; 1 mark: worked numbers; 1 mark: entries"}, {"id": "T7-S07", "topic": "T7", "priority": 2, "question": "Give the two warranty journal entries (at the time of sale and when a claim is settled) and explain how the ending warranty provision is calculated.", "model_answer": "- At sale: Dr Warranty Expense / Cr Provision for Warranty Repairs for the estimate (% of sales), applying matching. At a claim: Dr Provision for Warranty Repairs / Cr Inventory (replacement parts) or Cr Cash (refund); no expense at this point.\n- Ending provision = opening balance + warranty expense accrued - claims settled. Example: 3,000 + 6% x 100,000 - 7,000 = 2,000.\n- The income-statement expense is the estimate (6,000), not the cash paid (7,000). Under IFRS a provision can be reduced if claims are lower than expected, giving a negative expense.", "marking": "1 mark: both entries correct; 1 mark: T-account formula with example; 1 mark: expense is estimate not cash / reversal possible"}, {"id": "T7-S08", "topic": "T7", "priority": 2, "question": "Under IFRS 16, what does a lessee record for a lease, and what expenses appear on its income statement each year? (No calculations needed.)", "model_answer": "- At commencement: Dr Right-of-use (ROU) Asset / Cr Lease Liability, both measured at the present value of the lease payments. The ROU asset sits with PP&E; the liability is split current / non-current.\n- Each year: (1) depreciate the ROU asset straight-line over the shorter of lease term and useful life (Dr Depreciation Expense / Cr Accumulated Depreciation, ROU asset); (2) each payment is interest first, remainder principal (Dr Interest Expense, Dr Lease Liability / Cr Cash), just like an instalment note.\n- So the income statement shows two lines, depreciation and interest, not one rent expense; total expense is front-loaded because interest falls over time. Only short-term (under 1 year) and low-value leases are exempt.", "marking": "1 mark: commencement entry at PV; 1 mark: depreciation and payment-split entries; 1 mark: two expense lines / exemptions"}, {"id": "T7-S09", "topic": "T7", "priority": 2, "question": "How is sales tax collected from customers accounted for? Explain the difference between 'earned sales of $X' and 'collected $X including GST'.", "model_answer": "- Sales tax belongs to the government, so it is a liability (Sales Tax Payable), never revenue or expense: Dr Cash / Cr Sales Revenue, Cr Sales Tax Payable; remitting it is Dr Sales Tax Payable / Cr Cash.\n- 'Earned 200,000, tax 5%': tax is added on top: cash 210,000, sales 200,000, tax 10,000. 'Collected 218 including 9% tax': split it: sales = 218 / 1.09 = 200, tax = 18 (not 218 x 9%).\n- Getting the split wrong overstates revenue and understates the liability owed to the tax authority.", "marking": "1 mark: liability, entries; 1 mark: both wordings worked correctly; 1 mark: consequence of error"}, {"id": "T8-S01", "topic": "T8", "priority": 3, "question": "Explain in your own words what Retained Earnings means, and why dividends are not an expense.", "model_answer": "- Retained earnings is the cumulative net income the company has earned since it started, less all dividends declared: profits kept and reinvested in the business. Ending RE = beginning RE + net income - dividends.\n- Example: beginning RE 240,000 + net income 95,000 - dividends 35,000 = ending RE 300,000. Dividends are recorded Dr Retained Earnings / Cr Dividends Payable at declaration.\n- Dividends are a distribution of profit to owners, not a cost of earning revenue, so they bypass the income statement and reduce retained earnings directly; expenses are resources used up to generate revenue.", "marking": "1 mark: definition / formula; 1 mark: example or entry; 1 mark: dividends are distributions to owners, not costs of earning revenue"}, {"id": "T8-S02", "topic": "T8", "priority": 3, "question": "What is treasury stock, why is it a contra-equity account rather than an asset, and why do companies repurchase their own shares?", "model_answer": "- Treasury stock = a company's own issued shares that it has bought back; recorded at cost (market price on the purchase date) with Dr Treasury Stock / Cr Cash. The shares have no votes and get no dividends.\n- It is contra-equity because a company cannot own itself: buying back shares is a transaction with owners that returns their capital, so it reduces equity; it is not a resource that generates future benefits. Resale differences go to APIC, never to gains or losses.\n- Reasons: return surplus cash (alternative to dividends), raise EPS by cutting shares outstanding, supply shares for employee plans, signal the stock is underpriced, adjust the capital structure, deter takeovers.", "marking": "1 mark: definition, cost method, entry; 1 mark: why contra-equity not asset; 1 mark: at least three reasons for buybacks"}, {"id": "T8-S03", "topic": "T8", "priority": 3, "question": "Compare the effects of a cash dividend, a stock dividend and a stock split on total assets, liabilities and total shareholders' equity.", "model_answer": "- Cash dividend: at declaration Dr Retained Earnings / Cr Dividends Payable (liabilities up, equity down); at payment Dr Dividends Payable / Cr Cash (assets down, liabilities down). Overall: assets down, equity down.\n- Stock dividend: no entry at declaration; at distribution Dr Retained Earnings (shares x market price) / Cr Common Stock (par) and APIC. Retained earnings down, share capital up, total equity, assets and liabilities unchanged; share count rises.\n- Stock split: no entry at all; only the number of shares (and par per share) changes. Both stock dividends and splits aim to lower the share price for liquidity while conserving cash.", "marking": "1 mark: cash dividend effects at both dates; 1 mark: stock dividend effects (RE down, equity unchanged); 1 mark: split no entry / purpose"}, {"id": "T8-S04", "topic": "T8", "priority": 2, "question": "List the four basic rights of common shareholders and explain how preferred shareholders differ. Why might a company issue preferred shares?", "model_answer": "- Rights: (1) vote (elect the board, approve major matters), (2) share in dividends when declared, (3) share in assets on liquidation after creditors are paid, (4) pre-emption (buy a proportionate share of new issues to keep ownership %).\n- Preferred shareholders receive a fixed dividend first and rank ahead of common in liquidation, but usually have limited or no voting and pre-emption rights; cumulative preferred accumulates unpaid dividends (arrears, disclosed but not a liability until declared).
