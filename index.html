 Common shareholders are residual owners: last paid, most upside.\n- Companies issue preferred to raise money without diluting control, to keep payment flexibility (dividends can be deferred, often no maturity), and to attract investors wanting steady income.", "marking": "1 mark: four rights; 1 mark: preferred differences; 1 mark: reasons to issue preferred"}, {"id": "T8-S05", "topic": "T8", "priority": 2, "question": "Explain the basic EPS formula, why preferred dividends are subtracted, and why the denominator is a weighted average of outstanding shares.", "model_answer": "- Basic EPS = (Net income - preferred dividends) / weighted-average number of common shares outstanding. It measures the profit earned for each common share.\n- Preferred dividends are subtracted because that profit belongs to preferred holders first; only the remainder is available to common shareholders. Example: (108,000 - 3,000) / 50,000 outstanding = 2.10.\n- Shares are weighted by the fraction of the year they were outstanding (300,000 shares issued 1 July count as 150,000) because profit was earned over the whole year; outstanding excludes treasury shares, which is why buybacks raise EPS.", "marking": "1 mark: formula; 1 mark: why subtract preferred dividends with example; 1 mark: weighting and outstanding-not-issued"}, {"id": "T8-S06", "topic": "T8", "priority": 2, "question": "How is a transaction recorded when a company issues shares in exchange for a non-cash asset or for services, and what happens to total equity?", "model_answer": "- Record the asset or expense at the market value of what is received (or the shares if more reliable); credit Common Stock for par x shares and Additional Paid-in Capital for the balance (plug). With no-par shares, credit the whole amount to Share Capital.\n- Example: 5,000 shares of $1 par issued for land worth 80,000: Dr Land 80,000 / Cr Common Stock 5,000, Cr APIC 75,000. For legal services billed at 25,000: Dr Legal Expense 25,000 / Cr Common Stock and APIC.\n- Total equity rises by the market value received (80,000) with no cash involved; for services, equity rises through share capital but net income (and so retained earnings) falls by the expense.", "marking": "1 mark: market-value rule and par/APIC split; 1 mark: worked entry; 1 mark: effect on equity"}, {"id": "T9-S01", "topic": "T9", "priority": 3, "question": "Describe the three categories of cash flows in your own words, with one example of an inflow and one outflow for each.", "model_answer": "- Operating: cash from the day-to-day business of selling goods and services, linked to the income statement and current assets/liabilities. Inflow: collections from customers; outflow: payments to suppliers, employees, income taxes.\n- Investing: cash spent on or received from long-term assets and investments. Inflow: sale of equipment, collection of a loan made to another company; outflow: purchase of PP&E or another company's shares.\n- Financing: cash obtained from or returned to owners and lenders. Inflow: issuing shares, borrowing; outflow: repaying loan principal, buying back shares, paying dividends. Together CFO + CFI + CFF = the change in cash.", "marking": "1 mark per category correctly described with a valid inflow and outflow (3 marks)"}, {"id": "T9-S02", "topic": "T9", "priority": 3, "question": "What are the implications of each of the three types of cash flows for someone analysing a company?", "model_answer": "- Operating: shows whether profit turns into cash (earnings quality) and how working capital is managed; it must be positive in the long run because it is the only sustainable source. Net income rising while CFO falls is a red flag to investigate receivables and inventory.\n- Investing: shows how much is being spent on resources for future income (CapEx) and which inflows are one-off (asset sales). Free cash flow = CFO - CapEx shows what is left after reinvestment.\n- Financing: shows how the company funds itself (internal vs external) and its capital structure; growth firms show financing inflows, mature firms outflows (debt repayment, dividends, buybacks). Patterns such as + - - (mature) or + - + (growth) are clues, to be checked against amounts and trends.", "marking": "1 mark: operating implications (sustainability, earnings quality); 1 mark: investing implications (future resources, one-off, FCF); 1 mark: financing implications (funding, maturity signal)"}, {"id": "T9-S03", "topic": "T9", "priority": 3, "question": "What are non-cash investing and financing activities? Give three examples and explain how they are reported.", "model_answer": "- They are significant investing or financing transactions that involve no cash now, so they cannot appear in the body of the statement of cash flows, but users still need to know about them.\n- Examples: buying land by issuing a note payable (cash will be paid later), acquiring a building by issuing common shares, retiring bonds by issuing shares, converting preferred stock into common stock.\n- They are disclosed in a separate schedule or note to the statement of cash flows. Items with no current or future cash effect, such as stock dividends, splits and depreciation, are not reported in the statement at all.", "marking": "1 mark: definition / why not in the body; 1 mark: three valid examples; 1 mark: note disclosure and distinction from pure non-cash items"}, {"id": "T9-S04", "topic": "T9", "priority": 3, "question": "How can you tell whether a company uses the direct or the indirect method, and what difference does the choice make?", "model_answer": "- Indirect: the operating section starts with net income and adjusts it (add depreciation and losses, subtract gains, subtract increases in current assets, add increases in current liabilities). Direct: it lists actual receipts and payments (cash from customers, paid to suppliers, employees, taxes).\n- The choice affects only the presentation of OPERATING activities; investing and financing are always reported directly, and the total CFO is the same under both methods.\n- Direct is preferred by the IASB because it is clearer, but very few companies use it because it needs more computation; indirect is popular with analysts because it shows why profit differs from cash.", "marking": "1 mark: how to recognise each method; 1 mark: only operating affected, same total; 1 mark: preference vs usage"}, {"id": "T9-S05", "topic": "T9", "priority": 2, "question": "Under the indirect method, explain why depreciation is added back to net income and why a gain on the sale of PP&E is subtracted.", "model_answer": "- Depreciation (like amortisation and bad debt expense) reduced net income but used no cash, so it is added back to get from accounting profit to operating cash. It is an add-back, not a cash inflow.\n- A gain on sale is included in net income, but the entire cash proceeds of the sale are reported under investing activities; leaving the gain in operating cash would count part of the sale twice, so it is subtracted (a loss is added back for the same reason).\n- Example: NI 120 + depreciation 20 - receivables increase 50 - inventory increase 40 + payables increase 10 = CFO 60.", "marking": "1 mark: depreciation non-cash add-back; 1 mark: gain removed to avoid double counting with investing; 1 mark: example or working-capital sign rules"}, {"id": "T9-S06", "topic": "T9", "priority": 2, "question": "What is free cash flow, how is it calculated, and when can the cash-conversion ratio (CFO / net income) be misleading?", "model_answer": "- Free cash flow = cash from operating activities - cash capital expenditures (purchases of PP&E). It shows how much operating cash is left after reinvesting in the business, available for debt repayment, dividends or buybacks. Example: CFO 60 - CapEx 50 = FCF 10.\n- Do not deduct interest or tax again (already inside CFO) and do not use total investing cash flow (it includes financial investments).\n- CFO / NI shows how much operating cash each dollar of profit produces (120/100 = 1.20 is strong; 60/120 = 0.50 is weak). It is not meaningful when net income is a loss, and a missing input must be reported as a limitation rather than replaced with zero.", "marking": "1 mark: FCF definition and formula with example; 1 mark: common errors; 1 mark: cash conversion meaning and when not meaningful"}, {"id": "T7-S20", "topic": "T7", "priority": 3, "question": "Delta Inc. (year-end 31 December) borrowed $60,000 on 1 August 2026 on a 9-month, 6% note and $36,000 on 1 December 2026 on a 3-month, 9% note. Give the adjusting entries at 31 December 2026 and the entry when the $36,000 note is paid on 1 March 2027. Explain why the payment entry has two interest lines.", "model_answer": "- 31 Dec 2026 adjusting entries: Dr Interest Expense 1,500 / Cr Interest Payable 1,500 (60,000 x 6% x 5/12); Dr Interest Expense 270 / Cr Interest Payable 270 (36,000 x 9% x 1/12). Accrual accounting: the expense belongs to 2026 even though no cash has been paid.\n- 1 Mar 2027 payment: Dr Notes Payable 36,000, Dr Interest Payable 270, Dr Interest Expense 540 / Cr Cash 36,810 (540 = 36,000 x 9% x 2/12 for Jan-Feb 2027).\n- Two interest lines because the 3-month interest of 810 straddles two years: 270 was already expensed and recorded as a payable in 2026, so only the 2027 share of 540 is new expense. Trap: expensing all 810 in 2027 double counts.", "marking": "1 mark: two correct year-end accruals with month fractions; 1 mark: correct payment entry (36,810 cash); 1 mark: explanation of the payable vs expense split"}, {"id": "T7-S21", "topic": "T7", "priority": 3, "question": "Stone Ltd signs a $500,000, 8%, 10-year mortgage on 31 December 2025 with annual payments of $80,000 each 31 December. Prepare the amortisation schedule for the first two payments and show how the mortgage is presented on the balance sheet at 31 December 2026.", "model_answer": "- Schedule: Year 1 (31 Dec 2026): interest 500,000 x 8% = 40,000; principal 80,000 - 40,000 = 40,000; balance 460,000. Year 2 (31 Dec 2027): interest 460,000 x 8% = 36,800; principal 43,200; balance 416,800. Interest falls and principal rises each year because the balance shrinks.\n- Entries: 31 Dec 2025 Dr Cash 500,000 / Cr Mortgage Payable 500,000. 31 Dec 2026 Dr Interest Expense 40,000, Dr Mortgage Payable 40,000 / Cr Cash 80,000.\n- Balance sheet 31 Dec 2026: Current liabilities: current portion of mortgage payable 43,200 (the principal due in 2027); Non-current liabilities: mortgage payable 416,800 (460,000 - 43,200). Trap: do not use the 2026 principal (already paid) or the full 80,000 payment as the current portion.", "marking": "1 mark: year 1 and year 2 rows correct; 1 mark: loan and first payment entries; 1 mark: current 43,200 / non-current 416,800 with reason"}, {"id": "T7-S22", "topic": "T7", "priority": 3, "question": "For each item below, state the accounting treatment and give the journal entry if one is needed. (1) Volt Ltd sold 1,200 TVs with a one-year free repair guarantee; 5% of sets need repair at an average cost of $2,000; 40 sets were repaired this year using spare parts. (2) Volt is sued for $2,000,000; lawyers say it is 75% likely to lose and the best estimate of the payout is $800,000. (3) Volt is accused of trademark infringement; it may have to pay but the amount cannot yet be estimated.", "model_answer": "- (1) Warranty is a provision: probable, past experience gives a reliable estimate, so recognise in the year of sale (matching). Dr Warranty Expense 120,000 / Cr Warranty Provision 120,000 (1,200 x 5% x 2,000). Repairs: Dr Warranty Provision 80,000 / Cr Supplies (spare parts) 80,000 (40 x 2,000). Ending provision 40,000.\n- (2) Present obligation, probable (75% > 50%), reliable estimate: record a provision at the best estimate. Dr Lawsuit Loss 800,000 / Cr Lawsuit Provision 800,000. Not the 2,000,000 claimed and not 75% x 800,000.\n- (3) Loss is possible or even probable but cannot be reliably estimated: no journal entry. Disclose the nature of the claim and the fact that the amount cannot be estimated in the notes (contingent liability). Trap: disclosure changes no numbers on the statements.", "marking": "1 mark: warranty accrual and usage entries with 40,000 ending balance; 1 mark: provision at best estimate 800,000 with reasoning; 1 mark: no entry but disclosure for the unestimable claim"}], "matching": [{"id": "T1-X01", "topic": "T1", "priority": 3, "instruction": "Match each account to its classification.", "left": ["Allowance for Bad Debts", "Unearned Service Revenue", "Sales Discounts", "Prepaid Rent", "Retained Earnings", "Interest Receivable", "Dividends", "Salaries Payable"], "right": ["Asset", "Contra-asset", "Liability", "Equity", "Contra-equity (reduces retained earnings)", "Revenue", "Contra-revenue", "Expense"], "answer": [1, 2, 6, 0, 3, 0, 4, 2], "explanation": "Allowance for Bad Debts is a contra-asset (credit balance, deducted from A/R). Unearned revenue and salaries payable are liabilities (the company owes goods/services or cash). Sales Discounts is contra-revenue. Prepaid Rent and Interest Receivable are assets. Retained Earnings is equity. Dividends reduce retained earnings (a temporary contra-equity account), not an expense. Trap: 'Unearned Service Revenue' is a liability despite the word revenue; 'Allowance' is not a liability despite its credit balance."}, {"id": "T2-X01", "topic": "T2", "priority": 2, "instruction": "Match each item to the financial statement(s) on which it appears.", "left": ["Net income", "Ending cash balance", "Ending retained earnings", "Cash paid to buy a building", "Dividends declared and paid", "Income tax payable", "Cost of goods sold", "Share capital"], "right": ["Income statement only", "Balance sheet only", "Income statement and statement of changes in equity", "Balance sheet and statement of cash flows", "Balance sheet and statement of changes in equity", "Statement of cash flows (investing) only", "Statement of changes in equity and statement of cash flows (financing)"], "answer": [2, 3, 4, 5, 6, 1, 0, 4], "explanation": "Net income is computed on the income statement and carried into the statement of changes in equity. Ending cash is on the balance sheet and is the closing figure of the cash flow statement. Ending retained earnings and share capital appear in the statement of changes in equity and the balance sheet. Buying a building is an investing cash outflow. Dividends reduce retained earnings (statement of changes in equity) and are a financing outflow. Income tax payable is a balance sheet liability. COGS is an income statement expense. Trap: the items that appear on TWO statements are the links the professor tests."}, {"id": "T3-X01", "topic": "T3", "priority": 3, "instruction": "Classify each situation at 31 December 2026 as a prepaid expense, unearned revenue, accrued expense or accrued revenue.", "left": ["Electricity used in December 2026; the bill arrives on 12 January 2027", "A customer paid in November 2026 for consulting to be delivered in March 2027", "A 12-month insurance premium paid on 30 December 2026 covering 2027", "Interest earned on a bank deposit during November and December 2026, received on 5 January 2027", "Employee bonuses for 2026 performance, to be paid in February 2027", "Rent earned for December 2026 from a tenant who will pay on 3 January 2027", "A deposit received on 20 December 2026 for a hall booking in February 2027", "Annual software licence paid on 1 December 2026 covering 1 December 2026 to 30 November 2027 (eleven months unused)"], "right": ["Prepaid expense (cash first, expense later)", "Unearned revenue (cash first, revenue later)", "Accrued expense (expense now, cash later)", "Accrued revenue (revenue now, cash later)"], "answer": [2, 1, 0, 3, 2, 3, 1, 0], "explanation": "Ask two questions: (1) is it revenue or expense? (2) did cash move first or will it move later? Expense + cash later = accrued expense (electricity, bonuses). Revenue + cash later = accrued revenue (interest, rent earned). Expense + cash first = prepaid expense (insurance, software licence). Revenue + cash first = unearned revenue (consulting paid in advance, hall deposit). Trap: 'received' or 'paid' BEFORE the service = deferral; 'earned' or 'incurred' BEFORE the cash = accrual."}, {"id": "T5-X01", "topic": "T5", "priority": 3, "instruction": "For each item, state whether it is included in the company's inventory cost / ending inventory, or excluded.", "left": ["Freight-in paid to bring purchased goods to the warehouse", "Freight-out paid to deliver goods to customers", "Goods bought FOB shipping point, in transit at year-end", "Goods sold FOB shipping point, in transit at year-end", "Goods held on consignment for another company", "Goods sold FOB destination, still in transit at year-end", "Import duties on purchased goods", "Storage costs for finished goods awaiting sale after they arrived"], "right": ["Included in inventory", "Excluded from inventory (expense or belongs to another party)"], "answer": [0, 1, 0, 1, 1, 0, 0, 1], "explanation": "Costs needed to get goods to their present location and condition (freight-in, import duties) are capitalized; costs of selling or holding afterwards (freight-out, storage after receipt) are expensed. Ownership of in-transit goods follows the FOB term: shipping point means the buyer owns them in transit (include your purchases, exclude your sales); destination means the seller owns them until arrival (include your sales still in transit). Consigned goods belong to the consignor, so the holder excludes them. Trap: 'in my warehouse' does not mean 'mine', and 'on the truck' does not mean 'not mine'."}, {"id": "T6-X01", "topic": "T6", "priority": 3, "instruction": "Match each cost to its correct accounting treatment.", "left": ["Legal fees paid to transfer title of land purchased for a factory site", "Cost of removing an old shed from the land, net of scrap proceeds", "Architect's fees for designing the new factory building", "Interest on the construction loan during the building period", "Freight and insurance in transit on a new machine", "Installation and test runs of the new machine before it starts production", "Training production staff to operate the new machine", "Oil change and new tyres for the delivery truck"], "right": ["Capitalise as Land", "Capitalise as Building", "Capitalise as Equipment", "Expense in the current period"], "answer": [0, 0, 1, 1, 2, 2, 3, 3], "explanation": "Land takes every cost of getting the site ready (legal fees, demolition net of salvage, grading). A self-constructed building includes design fees and interest during construction. Equipment includes freight, insurance in transit, installation and testing. Training is spent on people, not the asset, and routine maintenance only keeps an asset in working order, so both are expenses."}, {"id": "T7-X01", "topic": "T7", "priority": 3, "instruction": "For each situation at year-end, choose the correct treatment under the contingent liability flowchart (IAS 37).", "left": ["Lawsuit: company clearly at fault, 70% chance of paying, best estimate $300,000", "Lawsuit: lawyers think losing is possible but not probable (about 30%), loss would be $1 million", "Former employee claim: dismissal followed the law, chance of payment remote", "Company publicly promised to clean up pollution it caused; payment probable and reliably estimated", "Company caused pollution; clean-up probable but cost cannot be reliably estimated", "Dispute over who polluted a river; company unlikely to be responsible but payment not remote", "Warranty on products sold this year; claims are estimated at 3% of sales", "Customer threatens to sue over a late delivery; lawyers say any claim would almost certainly fail"], "right": ["Record a provision (liability and expense)", "Disclose a contingent liability in the notes only", "Neither record nor disclose"], "answer": [0, 1, 2, 0, 1, 1, 0, 2], "explanation": "Record when there is a present obligation (legal or constructive, including a public promise), payment is probable (over 50%) and the amount can be estimated; warranties are a standard estimated provision. Disclose when payment is only reasonably possible, when responsibility is uncertain but not remote, or when payment is probable but no reliable estimate exists. Do nothing when the chance of payment is remote, whatever the publicity."}, {"id": "T8-X01", "topic": "T8", "priority": 3, "instruction": "For each transaction, state its effect on TOTAL shareholders' equity.", "left": ["Issue 10,000 common shares for cash", "Board declares a cash dividend (not yet paid)", "Pay the cash dividend declared last month", "Distribute a 10% stock dividend at market value", "Repurchase 2,000 of the company's own shares for cash", "Resell 1,000 treasury shares at a price below their cost", "Retire (cancel) the remaining treasury shares", "Announce a 2-for-1 stock split"], "right": ["Total equity increases", "Total equity decreases", "No change in total equity"], "answer": [0, 1, 2, 2, 1, 0, 2, 2], "explanation": "Equity rises when cash comes in from owners (share issue, treasury resale at any price). Equity falls when the company commits cash to owners: dividend declaration (Dr Retained Earnings / Cr Dividends Payable) and treasury purchase. Paying a declared dividend only reduces the liability and cash. Stock dividends move retained earnings into share capital, retirement reshuffles within equity, and a split changes only share counts, so none of these change the total."}, {"id": "T9-X01", "topic": "T9", "priority": 3, "instruction": "Classify each item for the statement of cash flows.", "left": ["Cash collected from customers", "Cash paid to purchase a delivery truck", "Cash received from issuing preferred shares", "Cash paid for income taxes", "Cash received from selling a long-term investment in another company's bonds", "Cash paid to repurchase the company's own shares", "Acquisition of a warehouse by issuing a long-term note payable to the seller", "Cash paid to repay a bank loan principal"], "right": ["Operating activity", "Investing activity", "Financing activity", "Non-cash investing and financing activity (note disclosure)"], "answer": [0, 1, 2, 0, 1, 2, 3, 2], "explanation": "Customer collections and tax payments relate to day-to-day operations. Buying a truck and selling a bond investment change long-term assets and investments (investing). Issuing shares, buying back own shares and repaying loan principal are dealings with owners and lenders (financing). A warehouse bought with a note involves no cash now, so it is disclosed in a note."}, {"id": "T9-X02", "topic": "T9", "priority": 3, "instruction": "Classify each item for the statement of cash flows.", "left": ["Cash paid to employees for salaries", "Cash lent to a supplier under a three-year loan", "Cash paid as dividends to common shareholders", "Conversion of bonds payable into common shares by the bondholders", "Cash received from the sale of an old machine", "Cash received from a five-year bank loan", "Cash paid to suppliers for inventory", "Purchase of equipment by issuing common shares to the vendor"], "right": ["Operating activity", "Investing activity", "Financing activity", "Non-cash investing and financing activity (note disclosure)"], "answer": [0, 1, 2, 3, 1, 2, 0, 3], "explanation": "Salaries and supplier payments are operating. Lending cash to others and selling a machine are investing (the full sale proceeds go here; any gain is removed from operating income under the indirect method). Dividends paid (common practice) and bank borrowing are financing. Converting bonds to shares and buying equipment with shares involve no cash and are disclosed in a note."}, {"id": "T7-X02", "topic": "T7", "priority": 2, "instruction": "Prof Lin's annotation 'who do we owe to?': match each current liability to the party the company owes.", "left": ["Accounts payable", "Short-term notes payable (signed to a bank)", "Sales tax payable", "Payroll liabilities (salaries payable)", "Unearned revenue", "Current portion of long-term debt", "Income taxes payable", "Bond interest payable"], "right": ["Suppliers / trade creditors", "Lenders / creditors / bondholders", "Government / tax authority", "Employees", "Customers"], "answer": [0, 1, 2, 3, 4, 1, 2, 1], "explanation": "Accounts payable are owed to suppliers for goods bought on account. Notes payable, the current portion of long-term debt and bond interest payable are owed to lenders, creditors or bondholders. Sales tax and income tax payable are owed to the government. Payroll liabilities are owed to employees (and partly to the government for deductions). Unearned revenue is owed to customers, settled by delivering goods or services rather than cash. Trap: unearned revenue is a liability even though no cash will be repaid."}]}</script>

/* ---------- helpers ---------- */
const ALL=[...DATA.mcq.map(q=>({...q,kind:'mcq'})),...DATA.matching.map(q=>({...q,kind:'match'})),...DATA.short.map(q=>({...q,kind:'short'}))];

function topicStats(t){const qs=ALL.filter(q=>q.topic===t);let done=0,ok=0;qs.forEach(q=>{const s=status(q.id);if(s!=='new')done++;if(s==='correct')ok++});return{n:qs.length,done,ok}}

  $('#selProfile').onchange=e=>{save();profile=e.target.value;S=lsGet(pkey(),null)||{ans:{},flags:{},sa:{},saMark:{},mocks:[]};save();home()};

  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startMode(b.dataset.mode));

}
function kindsAllowed(){return{mcq:$('#fMcq')?.checked??true,match:$('#fMatch')?.checked??true,short:$('#fShort')?.checked??true}}
function filt(list){const k=kindsAllowed();return list.filter(q=>k[q.kind])}
function startTopic(t){let list=filt(ALL.filter(q=>q.topic===t));if($('#fShuffle')?.checked)list=rnd(list);run(list,{title:t+' · '+TNAME[t]})}
function startMode(m){
  let list;
  if(m==='priority'){list=filt(ALL.filter(q=>q.priority===3));list.sort((a,b)=>(status(a.id)==='new'?0:1)-(status(b.id)==='new'?0:1));run(list,{title:'★★★ Most likely questions'})}
  else if(m==='random'){list=rnd(filt(ALL));run(list,{title:'Random mix'})}
  else if(m==='weak'){list=filt(ALL.filter(q=>q.weak_spot));run(list,{title:'Your midterm weak spots'})}
  else if(m==='wrong'){list=ALL.filter(q=>status(q.id)==='wrong');if(!list.length)return toast('No wrong answers yet. Nice.');run(list,{title:'Redo wrong answers'})}
  else if(m==='flag'){list=ALL.filter(q=>S.flags[q.id]);if(!list.length)return toast('Nothing flagged yet. Press F on a question to flag it.');run(list,{title:'Flagged questions'})}
  else if(m==='mock'){const mc=[];const want={T1:6,T2:6,T3:10,T4:6,T5:9,T6:10,T7:10,T8:7,T9:5};let pool=DATA.mcq.map(q=>({...q,kind:'mcq'}));Object.entries(want).forEach(([t,n])=>{const c=rnd(pool.filter(q=>q.topic===t));mc.push(...c.slice(0,n))});const ms=rnd(DATA.matching.map(q=>({...q,kind:'match'}))).slice(0,2);const ss=rnd(DATA.short.map(q=>({...q,kind:'short'})).filter(q=>q.priority>=2)).slice(0,5);list=[...rnd(mc).slice(0,52),...ms,...ss];run(list,{title:'Mock exam',mock:true,secs:120*60})}
}

/* ---------- RUNNER ---------- */
let R=null;
function run(list,opt){if(!list.length)return toast('No questions match these filters.');R={list,i:0,opt,picked:{},mockScore:{ok:0,n:0},start:Date.now()};if(opt.mock)startTimer(opt.secs);show()}
function show(){
  const q=R.list[R.i];const n=R.list.length;const st=status(q.id);
  const head=`<div class="meta"><span class="chip kind">${q.kind==='mcq'?'MCQ':q.kind==='match'?'Matching':'Short answer'}</span><span class="chip p${q.priority}"><span class="pri">${stars(q.priority)}</span></span>${q.weak_spot?'<span class="chip weak">Your weak spot</span>':''}<span class="chip">${q.topic} · ${esc(TNAME[q.topic])}</span>${q.template&&q.kind==='mcq'?`<span class="chip">${esc(q.template)}</span>`:''}</div>
  <div class="row" style="justify-content:space-between;margin-top:8px"><div class="eyebrow">${esc(R.opt.title)} · ${R.i+1} / ${n}</div><button class="flag ${S.flags[q.id]?'on':''}" id="btnFlag" type="button" aria-pressed="${!!S.flags[q.id]}">${S.flags[q.id]?'⚑ Flagged':'⚐ Flag to revisit'}</button></div>
  <div class="bar"><i style="width:${100*(R.i)/n}%"></i></div>`;
  let body='';
  if(q.kind==='mcq'){
    body=`<div class="stem">${esc(q.stem)}</div><div id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" type="button"><span class="l">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div>`;
  }else if(q.kind==='match'){
    body=`<div class="stem">${esc(q.instruction)}</div><div id="mrows">${q.left.map((l,i)=>`<div class="matchrow" data-i="${i}"><div>${i+1}. ${esc(l)}</div><select aria-label="Match for ${esc(l)}"><option value="">Choose…</option>${q.right.map((r,j)=>`<option value="${j}">${esc(r)}</option>`).join('')}</select></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="btnCheck" type="button">Check answers</button></div><div id="fb"></div>`;
  }else{
    body=`<div class="stem">${esc(q.question)}</div><p class="subtle" style="margin:0 0 6px">Write 3 bullets: definition · example with the journal entry or effect · why it matters. (3 marks)</p><textarea id="saText" aria-label="Your answer" placeholder="Type your answer here, then reveal the model answer and mark yourself.">${esc(S.sa[q.id]||'')}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="btnReveal" type="button">Reveal model answer</button></div><div id="fb"></div>`;
  }
  app.innerHTML=`<div class="card qcard k-${q.kind}">${head}${body}<div class="nav"><button class="btn ghost" id="btnPrev" type="button" ${R.i===0?'disabled':''}>← Back</button><span class="subtle">${st==='correct'?'Previously correct':st==='wrong'?'Previously wrong':'Not yet attempted'}</span><button class="btn" id="btnNext" type="button">${R.i===n-1?'Finish':'Next →'}</button></div></div>`;
  $('#btnFlag').onclick=()=>{S.flags[q.id]=!S.flags[q.id];save();$('#btnFlag').className='flag '+(S.flags[q.id]?'on':'');$('#btnFlag').textContent=S.flags[q.id]?'⚑ Flagged':'⚐ Flag to revisit';toast(S.flags[q.id]?'Flagged for revision':'Flag removed')};
  $('#btnPrev').onclick=()=>{R.i--;show()};
  $('#btnNext').onclick=next;
  if(q.kind==='mcq'){app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(q,+b.dataset.i))}
  if(q.kind==='match'){$('#btnCheck').onclick=()=>checkMatch(q)}
  if(q.kind==='short'){$('#saText').oninput=e=>{S.sa[q.id]=e.target.value;save()};$('#btnReveal').onclick=()=>reveal(q)}
  window.scrollTo(0,0);
}
function next(){if(R.i<R.list.length-1){R.i++;show()}else finish()}
function pick(q,i){
  if(R.picked[q.id]!==undefined)return;R.picked[q.id]=i;const ok=i===q.answer;
  const a=S.ans[q.id]||{n:0};S.ans[q.id]={c:ok,n:a.n+1,last:Date.now()};save();
  if(R.opt.mock){R.mockScore.n++;if(ok)R.mockScore.ok++}
  app.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.i;b.disabled=true;if(j===q.answer)b.classList.add('ok');else if(j===i)b.classList.add('no');else b.classList.add('dim')});
  if(R.opt.mock){$('#fb').innerHTML=`<div class="subtle" style="margin-top:10px">${ok?'Correct.':'Noted. You will see the explanation in the review.'}</div>`;return}
  const streak=R.list.slice(0,R.i+1).reverse().findIndex(x=>R.picked[x.id]!==undefined&&R.picked[x.id]!==x.answer);
  if(ok&&(streak===-1?R.i+1:streak)%5===0&&(streak===-1?R.i+1:streak)>0)confetti(120);
  $('#fb').innerHTML=`<div class="expl ${ok?'':'bad'}"><b class="lab">${ok?'Correct':'Not quite. Correct answer: '+LET[q.answer]}</b>${esc(q.explanation)}</div>${q.trap?`<div class="trap"><b>Trap:</b> ${esc(q.trap.replace(/^Trap:\s*/i,''))}</div>`:''}${q.klp?`<p class="subtle" style="margin:8px 0 0">Tests: ${esc(q.klp)}</p>`:''}`;
}
function checkMatch(q){
  const rows=[...app.querySelectorAll('.matchrow')];let ok=0;const sel=rows.map(r=>r.querySelector('select').value);
  if(sel.some(v=>v===''))return toast('Choose a match for every item first.');
  rows.forEach((r,i)=>{const good=+sel[i]===q.answer[i];r.classList.add(good?'ok':'no');if(good)ok++;r.querySelector('select').disabled=true});
  const all=ok===q.left.length;S.ans[q.id]={c:all,n:(S.ans[q.id]?.n||0)+1,last:Date.now(),score:ok};save();
  if(R.opt.mock){R.mockScore.n++;if(all)R.mockScore.ok++}
  if(all)confetti(80);
  $('#fb').innerHTML=`<div class="expl ${all?'':'bad'}"><b class="lab">${ok} of ${q.left.length} correct</b>${R.opt.mock?'':esc(q.explanation)}</div>${R.opt.mock?'':`<div class="subtle" style="margin-top:8px">Answer key: ${q.left.map((l,i)=>`${i+1} → ${esc(q.right[q.answer[i]])}`).join(' · ')}</div>`}`;
  $('#btnCheck').disabled=true;
}
function reveal(q){
  $('#fb').innerHTML=`<div class="model"><b>Model answer</b>\n${esc(q.model_answer)}<small>Marking: ${esc(q.marking||'')}</small></div><div class="sa-mark"><span class="subtle">Mark yourself:</span><button class="btn sm" id="saOk" type="button">I got it (3/3)</button><button class="btn sm ghost" id="saNo" type="button">Not yet, revisit</button></div>`;
  $('#saOk').onclick=()=>{S.saMark[q.id]=true;save();toast('Marked correct');if(R.opt.mock){R.mockScore.n++;R.mockScore.ok++}next()};
  $('#saNo').onclick=()=>{S.saMark[q.id]=false;save();toast('Added to your revisit list');if(R.opt.mock)R.mockScore.n++;next()};
}
function finish(){
  stopTimer();const list=R.list;const ok=list.filter(q=>status(q.id)==='correct').length;const done=list.filter(q=>status(q.id)!=='new').length;const pct=done?ok/done:0;
  if(pct>=.8)confetti(200);
  const wrong=list.filter(q=>status(q.id)==='wrong');
  const mins=Math.round((Date.now()-R.start)/60000);
  if(R.opt.mock){S.mocks.push({d:Date.now(),ok,n:list.length});save()}
  app.innerHTML=`<div class="card"><div class="hero">${ring(pct,'score')}<div><div class="eyebrow">${esc(R.opt.title)} finished</div><h2>${pct>=.85?'Excellent. A+ territory.':pct>=.7?'Good. A few traps left to clear.':'Keep going. Each fix is a mark gained.'}</h2><p>${ok} correct of ${done} attempted (${list.length} in set) · ${mins} min${R.opt.mock?' · mock scaled score ≈ '+Math.round(100*ok/list.length)+'/100':''}</p></div></div>
  <div class="stats"><div><div class="stat">${ok}</div><div class="k">Correct</div></div><div><div class="stat">${wrong.length}</div><div class="k">To fix</div></div><div><div class="stat">${list.filter(q=>S.flags[q.id]).length}</div><div class="k">Flagged</div></div></div>
  ${wrong.length?`<h3 style="margin-top:18px">Review these</h3><ul class="qlist">${wrong.map(q=>`<li><span>${esc((q.stem||q.instruction||q.question).slice(0,90))}…<br><span class="subtle">${q.id} · ${esc(TNAME[q.topic])}</span></span><button class="btn sm ghost" data-open="${q.id}" type="button">Open</button></li>`).join('')}</ul>`:'<p class="enc">Nothing to fix in this set. Beautiful.</p>'}
  <div class="row" style="margin-top:18px"><button class="btn" id="btnAgainWrong" type="button" ${wrong.length?'':'disabled'}>Redo the wrong ones</button><button class="btn ghost" id="btnPrintSet" type="button">Print this set with answers</button><button class="btn ghost" id="btnHome2" type="button">Home</button></div>
  <div class="tip"><span class="ic">!</span><div>${esc(ENC[Math.floor(Math.random()*ENC.length)])} ${esc(TIPS[Math.floor(Math.random()*TIPS.length)])}</div></div></div>`;
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{R={list:[byId[b.dataset.open]],i:0,opt:{title:'Review'},picked:{},mockScore:{ok:0,n:0},start:Date.now()};show()});
  $('#btnAgainWrong').onclick=()=>run(wrong,{title:'Redo wrong answers'});
  $('#btnPrintSet').onclick=()=>printList(list,'This set');
  $('#btnHome2').onclick=home;
  window.scrollTo(0,0);
}

/* ---------- timer ---------- */
let tInt=null,tEnd=0;
function startTimer(secs){tEnd=Date.now()+secs*1000;$('#timer').hidden=false;tick();tInt=setInterval(tick,1000)}
function tick(){const s=Math.max(0,Math.round((tEnd-Date.now())/1000));const m=Math.floor(s/60);$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#timer').classList.toggle('low',s<300);if(s<=0){stopTimer();toast('Time is up. Finishing the mock.');finish()}}
function stopTimer(){clearInterval(tInt);tInt=null;$('#timer').hidden=true;$('#timer').classList.remove('low')}

/* ---------- print / export ---------- */
function printView(which){
  let list=ALL.slice();const order={mcq:0,match:1,short:2};list.sort((a,b)=>a.topic.localeCompare(b.topic)||order[a.kind]-order[b.kind]||a.id.localeCompare(b.id));
  if(which==='wrong')list=list.filter(q=>status(q.id)==='wrong');
  if(which==='flag')list=list.filter(q=>S.flags[q.id]);
  if(which==='wrongflag')list=list.filter(q=>status(q.id)==='wrong'||S.flags[q.id]);
  if(!list.length)return toast('Nothing to show for that filter yet.');
  printList(list,{all:'All questions',wrong:'My wrong answers',flag:'My flagged questions',wrongflag:'My wrong and flagged questions'}[which]);
}
function qText(q,i){
  let s=`${i+1}. [${q.id} · ${TNAME[q.topic]} · ${'★'.repeat(q.priority)}${q.weak_spot?' · weak spot':''}]\n`;
  if(q.kind==='mcq'){s+=q.stem+'\n'+q.options.map((o,j)=>`   ${LET[j]}. ${o}`).join('\n')+`\n   Answer: ${LET[q.answer]}. ${q.explanation}${q.trap?' Trap: '+q.trap.replace(/^Trap:\s*/i,''):''}\n`}
  else if(q.kind==='match'){s+=q.instruction+'\n'+q.left.map((l,j)=>`   ${j+1}. ${l}`).join('\n')+'\n   Options: '+q.right.join(' | ')+'\n   Answer: '+q.left.map((l,j)=>`${j+1}→${q.right[q.answer[j]]}`).join('; ')+'\n   '+q.explanation+'\n'}
  else{s+=q.question+'\n   Model answer: '+q.model_answer.replace(/\n/g,'\n   ')+'\n   Marking: '+(q.marking||'')+'\n'}
  return s;
}
function printList(list,title){
  stopTimer();
  const txt=`ACCT689 Exam Prep Quiz · ${title} · ${profile} · ${new Date().toLocaleDateString()}\n\n`+list.map(qText).join('\n');
  let cur='';
  app.innerHTML=`<div class="card noprint"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Printable view</div><h2>${esc(title)} · ${list.length} questions</h2></div><div class="row"><button class="btn" id="btnPrint" type="button">Print / Save as PDF</button><button class="btn ghost" id="btnCopy" type="button">Copy as text</button><button class="btn ghost" id="btnDl" type="button">Download .txt</button><button class="btn ghost" id="btnBack" type="button">Back</button></div></div><p class="subtle" style="margin:8px 0 0">If Print does nothing here (inside Claude), use Copy or Download, or open the Vercel version in a browser tab.</p></div>
  <div class="card print-area"><h2 style="margin-bottom:6px">ACCT689 Exam Prep Quiz · ${esc(title)}</h2><div class="subtle">${esc(profile)} · ${new Date().toLocaleDateString()} · Answers and explanations included</div>
  ${list.map((q,i)=>{if(q.topic!==cur){cur=q.topic;return `<h3 style="margin:18px 0 4px;color:var(--accent)">${cur} · ${esc(TNAME[cur])}</h3>`+pq(q,i)}return pq(q,i)}).join('')}</div>`;
  $('#btnPrint').onclick=()=>{try{window.print()}catch(e){}toast('If no dialog opened, use Copy or Download.')};
  $('#btnCopy').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy manually')}ta.remove()})};
  $('#btnDl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='ACCT689-quiz-'+title.replace(/\W+/g,'-').toLowerCase()+'.txt';document.body.appendChild(a);a.click();a.remove();toast('Downloading… (works on the Vercel version)')}catch(e){toast('Download blocked here; use Copy.')}};
  $('#btnBack').onclick=home;
  window.scrollTo(0,0);
}
function pq(q,i){
  const st=status(q.id);const tag=`<span class="chip p${q.priority}">${stars(q.priority)}</span> ${S.flags[q.id]?'<span class="chip">⚑ flagged</span>':''} ${st==='wrong'?'<span class="chip weak">you got this wrong</span>':''}`;
  if(q.kind==='mcq')return `<div class="pq"><div class="s">${i+1}. ${esc(q.stem)}</div><ol type="A">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><div class="a"><b>Answer ${LET[q.answer]}.</b> ${esc(q.explanation)}${q.trap?`\n<b>Trap:</b> ${esc(q.trap.replace(/^Trap:\s*/i,''))}`:''}</div><div class="subtle" style="margin-top:4px">${q.id} ${tag}</div></div>`;
  if(q.kind==='match')return `<div class="pq"><div class="s">${i+1}. ${esc(q.instruction)}</div><ol>${q.left.map(l=>`<li>${esc(l)}</li>`).join('')}</ol><div class="subtle">Options: ${q.right.map(esc).join(' · ')}</div><div class="a"><b>Answer:</b> ${q.left.map((l,j)=>`${j+1} → ${esc(q.right[q.answer[j]])}`).join('; ')}\n${esc(q.explanation)}</div><div class="subtle" style="margin-top:4px">${q.id} ${tag}</div></div>`;
  return `<div class="pq"><div class="s">${i+1}. ${esc(q.question)}</div><div class="a"><b>Model answer:</b>\n${esc(q.model_answer)}\n<i>Marking: ${esc(q.marking||'')}</i></div><div class="subtle" style="margin-top:4px">${q.id} ${tag}</div></div>`;
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{if(!R||!app.querySelector('#btnNext'))return;if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const q=R.list[R.i];if(q.kind==='mcq'&&/^[1-4]$/.test(e.key)){const b=app.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}if(e.key==='ArrowRight'){$('#btnNext').click()}if(e.key==='ArrowLeft'){const b=$('#btnPrev');if(b&&!b.disabled)b.click()}if(e.key.toLowerCase()==='f'){$('#btnFlag')?.click()}});

home();

/* ---------- install as app ---------- */
let deferred=null;const ib=$('#btnInstall');
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.hidden=false});
addEventListener('appinstalled',()=>{ib.hidden=true;toast('Installed. Find it on your Home Screen.')});
if(ios&&!standalone)ib.hidden=false;
ib.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;ib.hidden=true}else $('#sheet').classList.add('show')};
$('#sheetClose').onclick=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('show')};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script>
