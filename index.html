<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143642">
<title>ACCT689 Exam Prep Quiz</title>
<meta name="description" content="Practice questions and mock exam for the ACCT689 final.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACCT689 Quiz">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ledger-paper study app. Sticky top bar, one centred column (max 760px), cards for questions. */
:root{
  --bg:#f4f7f6; --paper:#ffffff; --fg:#17282e; --muted:#5b6f76; --line:#d5dfdc;
  --accent:#1f7a6d; --accent-soft:#dcefeb; --ink:#143642; --gold:#c08a1e; --gold-soft:#fbf1dc;
  --good:#1f7a3c; --good-soft:#dff3e4; --bad:#b23a2e; --bad-soft:#fae2df; --warn:#8a5a00;
  --shadow:0 6px 24px rgba(20,54,66,.08);
  --display:"Fraunces",Georgia,serif; --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1f; --paper:#16262c; --fg:#e6eeef; --muted:#9db0b6; --line:#2a3d44;
  --accent:#4fc3b0; --accent-soft:#163a37; --ink:#dbe9ec; --gold:#e3b04b; --gold-soft:#3a2e12;
  --good:#5fd38a; --good-soft:#13381f; --bad:#ff8a7a; --bad-soft:#4a1f1a; --warn:#f2c268;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1f; --paper:#16262c; --fg:#e6eeef; --muted:#9db0b6; --line:#2a3d44;
  --accent:#4fc3b0; --accent-soft:#163a37; --ink:#dbe9ec; --gold:#e3b04b; --gold-soft:#3a2e12;
  --good:#5fd38a; --good-soft:#13381f; --bad:#ff8a7a; --bad-soft:#4a1f1a; --warn:#f2c268;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.2px}
.top .brand small{font-family:var(--body);font-weight:400;opacity:.8;font-size:.8rem;margin-left:6px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:.85rem}
.top button:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(31,122,109,.3)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.gold{background:var(--gold);color:#1a1200}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.topic{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;color:var(--fg);min-width:0}
.topic:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.topic .t{font-weight:700;font-family:var(--display);font-size:1.05rem}
.topic .m{color:var(--muted);font-size:.85rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar i.g{background:var(--good)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.chip.p3{background:var(--gold-soft);color:var(--warn);border-color:transparent}
.chip.p2{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.weak{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.kind{background:var(--ink);color:#fff;border-color:transparent}
:root[data-theme="dark"] .chip.kind{color:#0f1b1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.kind{color:#0f1b1f}}
.stem{font-size:1.12rem;font-weight:600;margin:12px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;color:var(--fg);transition:border-color .15s,background .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt .l{font-family:var(--mono);font-weight:500;color:var(--muted);flex:0 0 1.4em}
.opt.ok{background:var(--good-soft);border-color:var(--good);animation:pop .35s}
.opt.no{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}
.opt.dim{opacity:.55}
@keyframes pop{0%{transform:scale(.98)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.expl{margin-top:14px;padding:14px;border-radius:10px;background:var(--accent-soft);border-left:4px solid var(--accent);animation:fade .35s}
.expl.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.expl b.lab{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.trap{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--gold-soft);border-left:4px solid var(--gold);font-size:.95rem}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.flag{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted)}
.flag.on{background:var(--gold-soft);border-color:var(--gold);color:var(--warn)}
textarea,select,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical}
.model{margin-top:12px;padding:14px;border-radius:10px;background:var(--good-soft);border-left:4px solid var(--good);white-space:pre-wrap;animation:fade .35s}
.model small{display:block;color:var(--muted);margin-top:8px}
.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.matchrow.ok select{border-color:var(--good);background:var(--good-soft)}
.matchrow.no select{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:480px){.matchrow{grid-template-columns:1fr}}
.ring{width:84px;height:84px;flex:0 0 84px}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--mono);font-size:18px;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.tip{background:var(--paper);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;margin-top:16px;display:flex;gap:10px;align-items:flex-start;animation:fade .4s}
.tip .ic{font-family:var(--display);font-weight:700;color:var(--gold);font-size:1.2rem;line-height:1}
.stat{font-family:var(--mono);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stats .k{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:all .3s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:8px}
.timer.low{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.print{display:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters label{display:flex;gap:6px;align-items:center;font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.sa-mark{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:1.7rem}
.hero p{margin:4px 0 0;color:var(--muted)}
.profile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.profile select{width:auto;min-width:160px}
.enc{font-family:var(--display);font-size:1.25rem;color:var(--accent);margin-top:6px}
.kbd{font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.pri{display:inline-block;color:var(--gold);letter-spacing:1px}
.qlist{list-style:none;padding:0;margin:0}
.qlist li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}
.qlist li button{flex:0 0 auto}
.subtle{color:var(--muted);font-size:.9rem}

/* ===== Visual refresh ===== */
:root{--grad:linear-gradient(135deg,#143642 0%,#1a4f5a 55%,#1f7a6d 100%);--r:18px;--shadow:0 1px 2px rgba(20,54,66,.05),0 10px 30px rgba(20,54,66,.08)}
body{background:radial-gradient(1100px 520px at 50% -180px,rgba(31,122,109,.16),transparent 70%) fixed,var(--bg);-webkit-font-smoothing:antialiased}
body::before{background:#143642}
.top{background:var(--grad);box-shadow:0 4px 18px rgba(10,30,36,.18);padding-block:12px}
.top .brand{display:flex;align-items:center;gap:10px}
.top .brand small{display:none}
.top .logo{width:32px;height:32px;border-radius:9px;background:url(/icon-192.png) center/cover;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none}
.wrap,.top .in{max-width:880px}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:560px){.top:has(#timer:not([hidden])) .brand>span:not(.logo){display:none}}
.top #btnInstall{background:#e3b04b;color:#143642;border-color:transparent;font-weight:700}
.toast{background:#143642}
@media (max-width:560px){.top .in{gap:8px}.top .brand{font-size:1.05rem;margin-right:auto}.top .brand .bx,.top .sp{display:none}.top button{padding:6px 11px}}
.card{border-radius:var(--r);border-color:color-mix(in srgb,var(--line) 70%,transparent);padding:24px}
.eyebrow{color:var(--accent);letter-spacing:.1em}
.btn{border-radius:12px}
.btn.ghost:hover{background:var(--accent-soft);box-shadow:none}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
/* hero */
.hero-card{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden;padding:26px}
.hero-card::before,.hero-card::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero-card::before{width:320px;height:320px;right:-110px;top:-140px;background:rgba(255,255,255,.06)}
.hero-card::after{width:200px;height:200px;left:-80px;bottom:-120px;background:rgba(227,176,75,.10)}
.hero-card>*{position:relative;z-index:1}
.hero-card .eyebrow{color:#e3b04b}
.hero-card h1{font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.1;margin:4px 0 12px}
.hero-card .ring{width:112px;height:112px;flex-basis:112px}
.hero-card .ring .bgc{stroke:rgba(255,255,255,.18)}.hero-card .ring .fgc{stroke:#e3b04b}.hero-card .ring text{fill:#fff}
.hero-card .enc{color:#fff;opacity:.92;font-size:1.1rem;margin-top:12px;font-style:italic}
.hstats{display:flex;gap:8px;flex-wrap:wrap}
.hstats div{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 14px;font-size:.8rem;color:rgba(255,255,255,.85);white-space:nowrap}
.hstats b{display:block;font-family:var(--display);font-size:1.45rem;color:#fff;line-height:1.15}
.hstats b small{font-size:.9rem;opacity:.7}
.hero-card .profile{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.hero-card .subtle{color:rgba(255,255,255,.75)}
.hero-card .profile select{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.hero-card .profile select option{color:#000}
.hero-card .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}.hero-card .btn.ghost:hover{background:rgba(255,255,255,.14)}
.hero-card input[type=text]{background:rgba(255,255,255,.95);color:#143642}
@media (max-width:520px){.hero-card .hero{flex-direction:column-reverse;align-items:flex-start}.hero-card .ring{position:absolute;top:0;right:0;width:76px;height:76px;flex-basis:76px}.hero-card h1{padding-right:80px}.hstats div{flex:1 1 0;padding:8px 10px}}
/* section heads */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{font-size:1.25rem}
/* practice modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:14px;color:var(--fg);transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.mode:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.mode .mi{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .mi svg{width:22px;height:22px}
.mode b{display:block;font-family:var(--display);font-size:1.05rem}
.mode small{display:block;color:var(--muted);font-size:.84rem;line-height:1.3}
.mode.hot{background:linear-gradient(135deg,#e3b04b,#c08a1e);border-color:transparent;color:#1a1200}
.mode.hot .mi{background:rgba(255,255,255,.35);color:#1a1200}.mode.hot small{color:#3a2800}
.mode.dark{background:var(--grad);border-color:transparent;color:#fff}
.mode.dark .mi{background:rgba(255,255,255,.14);color:#e3b04b}.mode.dark small{color:rgba(255,255,255,.75)}
.filters{margin-top:14px}
.filters label{padding:6px 12px;transition:all .15s;user-select:none}
.filters label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.filters input{accent-color:var(--accent)}
/* topics */
.topic{display:flex;gap:12px;align-items:flex-start;border-radius:16px}
.topic:hover{border-color:var(--accent)}
.topic .badge{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-weight:700;background:var(--accent-soft);color:var(--accent)}
.topic.started .badge{background:var(--gold-soft);color:var(--warn)}
.topic.complete .badge{background:var(--good);color:#fff}
.topic.complete .bar i{background:var(--good)}
.topic .tb2{flex:1;min-width:0}.topic .bar{height:6px}
.tip{border-style:solid;border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-soft);border-radius:16px}
.tip .ic{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:1rem;flex:none}
/* question card */
.qcard{border-top:5px solid var(--accent)}
.qcard.k-match{border-top-color:var(--gold)}
.qcard.k-short{border-top-color:#5b6fd6}
.qcard .stem{font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,3.6vw,1.35rem);line-height:1.4;margin:16px 0 16px}
.opt{border-radius:14px;padding:12px 14px;align-items:center;background:var(--paper);box-shadow:0 1px 2px rgba(20,54,66,.05)}
.opt .l{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);color:var(--accent);font-weight:700}
.opt:hover:not(:disabled) .l{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.ok .l{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.expl,.trap,.model{border-radius:14px}
.flag{border-radius:999px;padding:6px 12px}
.qcard .bar{height:6px}
@media (max-width:640px){
  .card{padding:20px}
  .qcard .nav{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;margin:18px -10px 0;padding:10px;border-radius:16px;
    background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .qcard .nav .subtle{display:none}
  .qcard .nav .btn{flex:1}
}
/* install help sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(5,15,18,.5);padding:16px}
.sheet.show{display:flex}
.sheet .box{background:var(--paper);color:var(--fg);border-radius:20px;padding:22px;max-width:420px;width:100%;margin-bottom:env(safe-area-inset-bottom,0px);animation:fade .25s}
.sheet ol{padding-left:1.2em;margin:10px 0 16px}.sheet li{margin:6px 0}
@media (display-mode:standalone){#btnInstall{display:none!important}}
@media print{.sheet{display:none!important}.qcard{border-top:1px solid #999}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .top,.nav,.tip,.toast,canvas#confetti,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .print{display:block}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;page-break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
.pq{border-bottom:1px solid var(--line);padding:12px 0;break-inside:avoid}
.pq .s{font-weight:600}
.pq ol{margin:6px 0 6px 20px;padding:0}
.pq .a{background:var(--good-soft);padding:8px 10px;border-radius:8px;margin-top:6px;white-space:pre-wrap}
</style>
</head>
<body>


<div class="top"><div class="in">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>ACCT689<span class="bx"> Exam Prep</span> Quiz</span> <small>SMU · Final 12 Nov 2026</small></div>
  <div class="sp"></div>
  <span id="timer" class="timer" hidden>120:00</span>
  <button id="btnInstall" type="button" hidden>Install app</button>

<script id="qdata" type="application/json">{"mcq": [{"id": "T1-M01", "topic": "T1", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Why must the accounting equation (Assets = Liabilities + Equity) hold after every single transaction?", "explanation": "Double-entry means each transaction is recorded with equal debits and credits, which keeps A = L + E. 'Always changes assets and liabilities equally' is wrong because many transactions change assets and equity, or swap one asset for another. 'Involves cash' is wrong because credit sales and purchases on account involve no cash. 'Only one account' is the opposite of double-entry.", "trap": "Trap: 'two equal effects' does not mean 'assets and liabilities both move'; a sale on account moves assets and equity.", "klp": "T1: Accounting equation must always hold", "source": "Sample midterm SM1 style / original", "options": ["Every transaction involves cash, and cash is always balanced by the bank.", "Every transaction changes assets and liabilities by exactly the same amount.", "Every transaction affects only one account, so nothing can go out of balance.", "Every transaction has two equal effects, so the two sides of the equation always change by the same net amount."], "answer": 3}, {"id": "T1-M02", "topic": "T1", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which of the following statements about the balance sheet elements is FALSE?", "explanation": "Assets are the resources; liabilities and equity are the sources of funding for those resources. The false option swaps the two sides. The other three are the textbook definitions.", "trap": "Trap: 'resources' always belongs on the asset side; 'sources of funding' on the right side.", "klp": "T1: Assets = resources; liabilities and equity = sources of funding", "source": "Sample midterm SM2 / practice AP1 style, original", "options": ["Assets are economic resources that are expected to generate future benefits.", "Liabilities are claims on the company's assets held by creditors.", "Liabilities and equity together show how the company's assets were financed.", "Liabilities and equity are the economic resources a company uses to earn revenue."], "answer": 3}, {"id": "T1-M03", "topic": "T1", "priority": 2, "template": "formula", "weak_spot": false, "stem": "Which expression correctly gives net income?", "explanation": "Net income = all revenues and gains minus all expenses and losses. 'Plus losses' adds something that reduces income. 'Minus gains, plus losses' flips both peripheral items. 'Minus dividends' is wrong because dividends are a distribution to owners, not an expense; they reduce retained earnings, not net income.", "trap": "Trap: dividends never appear in the net income formula.", "klp": "T1: Net income = revenue and gains - expenses and losses", "source": "Sample midterm SM3 style, original", "options": ["Revenues + gains - expenses - losses", "Revenues - expenses + gains + losses", "Revenues + losses - expenses - gains", "Revenues - expenses - dividends"], "answer": 0}, {"id": "T1-M04", "topic": "T1", "priority": 2, "template": "classification", "weak_spot": false, "stem": "A furniture retailer sells a dining table from its showroom for $900 (cost $600). The same month it sells an old delivery van used by its warehouse for $5,000 when the van's book value was $4,200. How should the $900 and the $800 excess on the van be reported, respectively?", "explanation": "Selling furniture is the retailer's primary business, so the full $900 is sales revenue (the $600 cost is COGS). Selling a used van is peripheral, so only the excess of the price over book value ($800) is a gain. 'Gain of $300' nets the table's cost against revenue, which is wrong for a primary activity. 'Both revenue' treats the van sale as a core activity. 'Both gains' treats the table sale as peripheral.", "trap": "Trap: revenue is the gross selling price of core goods; a gain is only the excess over book value on a peripheral sale.", "klp": "T1: Main difference between revenue and gains", "source": "Sample final Q43 / practice AP2 style, original", "options": ["Table: gain of $300; van: revenue of $5,000", "Both amounts are revenue", "Both amounts are gains", "Table: revenue of $900; van: gain of $800"], "answer": 3}, {"id": "T1-M05", "topic": "T1", "priority": 1, "template": "classification", "weak_spot": false, "stem": "A bakery pays $3,000 of monthly rent for its shop. In the same month a storm damages uninsured equipment with a book value of $7,000, which is scrapped for nothing. How are the two amounts classified on the income statement?", "explanation": "Rent is a cost of the bakery's primary operations, so it is an expense. The storm damage is a peripheral, non-operating event, so it is a loss. The other options either swap the two or treat both the same way.", "trap": "Trap: expense = cost of running the main business; loss = cost from something outside normal operations.", "klp": "T1: Main difference between expenses and losses", "source": "original", "options": ["Rent: expense; storm damage: loss", "Rent: loss; storm damage: expense", "Both are expenses", "Both are losses"], "answer": 0}, {"id": "T1-M06", "topic": "T1", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Which of the following is NOT one of the four major financial statements?", "explanation": "The four major statements are the balance sheet, income statement, statement of changes in equity and statement of cash flows. The trial balance is an internal worksheet used to check that debits equal credits; it is not published to outside users.", "trap": "Trap: the trial balance and the ledger are tools inside the accounting cycle, not financial statements.", "klp": "T1: Can you name the four major financial statements?", "source": "Sample midterm SM5 style, original", "options": ["Statement of cash flows", "Statement of changes in equity", "Balance sheet", "Trial balance"], "answer": 3}, {"id": "T1-M07", "topic": "T1", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which statement about how the financial statements are linked is FALSE?", "explanation": "Net income increases retained earnings, not cash. Cash on the balance sheet is explained by the statement of cash flows, not by net income (accrual income differs from cash). The three true statements are the three standard links taught in Week 1.", "trap": "Trap: net income links to retained earnings, never directly to cash.", "klp": "T1: How are the four major financial statements linked together?", "source": "Sample final Q49 / sample midterm SM6 style, original", "options": ["Net income from the income statement is added directly to the cash balance on the balance sheet.", "Net income from the income statement flows into retained earnings in the statement of changes in equity.", "Ending retained earnings in the statement of changes in equity is reported in the equity section of the balance sheet.", "The ending cash balance on the statement of cash flows equals cash reported on the balance sheet."], "answer": 0}, {"id": "T1-M08", "topic": "T1", "priority": 2, "template": "classification", "weak_spot": false, "stem": "On which financial statement(s) does the ending balance of retained earnings appear?", "explanation": "Ending retained earnings is computed in the statement of changes in equity and then reported in the equity section of the balance sheet. It is not on the income statement (which ends at net income) or the cash flow statement.", "trap": "Trap: items that appear on two statements (net income, ending RE, ending cash, dividends) are the professor's favourite 'link' questions.", "klp": "T1: How are the four statements linked (items that appear in multiple statements)", "source": "Week 1 in-class exercise 1 item (j), original", "options": ["Income statement only", "Balance sheet and statement of cash flows", "Statement of changes in equity only", "Balance sheet and statement of changes in equity"], "answer": 3}, {"id": "T1-M09", "topic": "T1", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which statement about balance sheet classification is FALSE?", "explanation": "Payment frequency does not decide classification; the due date does. Only the principal due within 12 months is current; the rest of the mortgage is non-current. The other three statements are correct descriptions of current/non-current classification and liquidity ordering.", "trap": "Trap: 'paid monthly' or 'interest paid monthly' does not make a long-term loan current.", "klp": "T1: Current vs non-current classification and order of assets/liabilities", "source": "Sample final Q44 / sample midterm SM7 style, original", "options": ["A 10-year mortgage is reported entirely as a current liability because the company makes monthly payments on it.", "An asset expected to be used up or converted to cash within one year (or the operating cycle if longer) is a current asset.", "Current assets are usually listed in order of liquidity, starting with cash.", "Only the portion of long-term debt that is due within the next 12 months is reclassified as a current liability."], "answer": 0}, {"id": "T1-M10", "topic": "T1", "priority": 1, "template": "plug", "weak_spot": false, "stem": "Rosewood Ltd reports for 2026: sales $250,000; cost of goods sold $140,000; operating expenses $60,000; interest expense $5,000; gain on sale of equipment $8,000. What is Rosewood's operating income?", "explanation": "Operating income = sales - COGS - operating expenses = 250,000 - 140,000 - 60,000 = 50,000. $110,000 is gross profit (stops before operating expenses). $53,000 is income before tax (it includes the non-operating interest and gain). $58,000 wrongly adds the peripheral gain into operating income.", "trap": "Trap: interest and gains/losses sit below operating income.", "klp": "T1: Income statement layers (slide 11); revenue vs gains", "source": "Midterm MT32 style, original numbers", "options": ["$50,000", "$53,000", "$58,000", "$110,000"], "answer": 0}, {"id": "T1-M11", "topic": "T1", "priority": 3, "template": "plug", "weak_spot": false, "stem": "Cedar Corp began 2026 with retained earnings of $180,000. During 2026 it earned revenue of $420,000, incurred expenses of $350,000, recorded a loss of $10,000 on the sale of a van, and declared dividends of $25,000. What is ending retained earnings?", "explanation": "Net income = 420,000 - 350,000 - 10,000 = 60,000. Ending RE = 180,000 + 60,000 - 25,000 = 215,000. $225,000 ignores the loss. $240,000 forgets to deduct dividends. $250,000 makes both mistakes.", "trap": "Trap: losses reduce net income; dividends reduce retained earnings but are not an expense.", "klp": "T1: Ending RE = Beginning RE + Net income - Dividends", "source": "Sample final Q47 style, original numbers", "options": ["$215,000", "$225,000", "$240,000", "$250,000"], "answer": 0}, {"id": "T1-M12", "topic": "T1", "priority": 3, "template": "plug", "weak_spot": false, "stem": "Larkspur Ltd reported service revenue of $640,000, paid dividends of $30,000, and reported net income of $190,000 for the year. What were total expenses for the year?", "explanation": "Expenses = revenue - net income = 640,000 - 190,000 = 450,000. Dividends are not an expense, so they are ignored. $420,000 wrongly treats dividends as an expense already inside net income. $480,000 wrongly adds dividends to expenses. $220,000 is net income plus dividends, which has no meaning here.", "trap": "Trap: dividends never enter the net income calculation.", "klp": "T1: Net income = revenues - expenses; RE formula", "source": "Practice AP3 style, original numbers", "options": ["$220,000", "$420,000", "$450,000", "$480,000"], "answer": 2}, {"id": "T1-M13", "topic": "T1", "priority": 2, "template": "false-statement", "weak_spot": false, "stem": "Which statement about retained earnings is FALSE?", "explanation": "Retained earnings is an equity claim, not a pile of cash; the earnings have usually been reinvested in inventory, equipment and so on. The other three statements are correct: RE accumulates undistributed profits, owner contributions go to share capital, and losses reduce RE.", "trap": "Trap: retained earnings is not cash and does not increase when shareholders invest.", "klp": "T1: Explain what Retained Earnings means in your own words", "source": "Practice AP4 / midterm MT18 style, original", "options": ["Retained earnings is the cumulative net income the company has kept rather than paid out as dividends.", "Retained earnings is the amount of cash the company has saved up since it was formed.", "A cash investment by shareholders increases share capital, not retained earnings.", "A net loss for the year reduces retained earnings."], "answer": 1}, {"id": "T1-M14", "topic": "T1", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which statement about generally accepted accounting principles (GAAP) is FALSE?", "explanation": "GAAP still allows judgment and choices (for example FIFO vs average cost, useful lives of assets), so two similar companies can report different profits. GAAP improves comparability and credibility; it does not guarantee identical results or an error-free audit.", "trap": "Trap: GAAP and an audit give reasonable assurance and comparability, never a guarantee.", "klp": "T1: What is GAAP and why is it important?", "source": "Sample final Q3 / sample midterm SM9 style, original", "options": ["GAAP is a common set of standards that guides how financial statements are prepared.", "GAAP makes financial statements more comparable across companies and over time.", "GAAP reduces the information gap between managers and outside investors.", "Because GAAP is a set of fixed rules, two companies that follow GAAP will always report identical profits for identical businesses."], "answer": 3}, {"id": "T1-M15", "topic": "T1", "priority": 3, "template": "principle", "weak_spot": true, "stem": "Which accounting assumption states that a business is expected to keep operating into the foreseeable future, so its assets are not reported at liquidation (forced-sale) values?", "explanation": "Going concern = the company will continue to operate, which justifies recording assets at cost rather than at what they would fetch in a quick sale. Time period = report in regular intervals. Monetary unit = record only what can be measured in money. Economic entity = keep the business separate from its owners.", "trap": "Trap: 'continue to operate' always points to going concern; 'regular intervals' points to time period.", "klp": "T1: GAAP concepts (Week 1 slide 32)", "source": "Midterm MT11 (student error), original", "options": ["Going-concern assumption", "Time-period assumption", "Monetary unit assumption", "Economic entity assumption"], "answer": 0}, {"id": "T1-M16", "topic": "T1", "priority": 3, "template": "principle", "weak_spot": true, "stem": "Harbor Ltd's auditors conclude that the company will almost certainly be liquidated within the next few months. Which accounting assumption is no longer valid, and what is the consequence?", "explanation": "Historical cost only makes sense if the business will keep using its assets. If liquidation is near, going concern fails and assets are shown at net realizable (liquidation) values. The other options misdescribe the other three assumptions.", "trap": "Trap: the going-concern assumption is the reason we can use historical cost at all.", "klp": "T1: GAAP concepts - going concern", "source": "original (student weak spot: going concern)", "options": ["Time period; the company no longer needs to prepare annual financial statements.", "Going concern; assets should now be measured at the amounts they will fetch on liquidation rather than at historical cost.", "Monetary unit; the company must now report in a foreign currency.", "Economic entity; the owners' personal assets must be added to the balance sheet."], "answer": 1}, {"id": "T1-M17", "topic": "T1", "priority": 3, "template": "false-statement", "weak_spot": true, "stem": "Which statement about the basic accounting assumptions is FALSE?", "explanation": "The false statement describes the time-period assumption but labels it going concern. Going concern means the business will continue operating for the foreseeable future. The other three are correct pairings.", "trap": "Trap: do not confuse going concern (continues to operate) with time period (regular reporting intervals).", "klp": "T1: GAAP concepts", "source": "original (student weak spot: going concern)", "options": ["The economic entity assumption keeps the owner's personal transactions out of the business's records.", "The monetary unit assumption means that only items measurable in money are recorded.", "The time-period assumption is the reason accrual accounting and adjusting entries are needed.", "The going-concern assumption means that a company reports its results at regular intervals such as quarters and years."], "answer": 3}, {"id": "T1-M18", "topic": "T1", "priority": 3, "template": "classification", "weak_spot": true, "stem": "On a corporate balance sheet, which items together represent the owners' (shareholders') claims on the company's assets?", "explanation": "Owners' claims = shareholders' equity = share capital (what owners invested) + retained earnings (profits kept in the business). 'Liabilities and equity' includes creditors' claims as well, so it is total claims, not owners' claims. Revenues and expenses are income statement items. Assets less current liabilities is working-capital style arithmetic, not equity.", "trap": "Trap: liabilities are creditors' claims; only equity is the owners' claim.", "klp": "T1: Accounting equation; equity = share capital + retained earnings", "source": "Midterm MT12 (student error), original", "options": ["Share capital and retained earnings", "Liabilities and shareholders' equity", "Revenues and expenses", "Total assets less current liabilities"], "answer": 0}, {"id": "T1-M19", "topic": "T1", "priority": 3, "template": "false-statement", "weak_spot": true, "stem": "Which statement about shareholders' equity on the balance sheet is FALSE?", "explanation": "Equity is the residual: Assets - Liabilities. Adding liabilities is wrong. The other three are correct: equity is the residual claim, and it is made up of contributed capital (share capital) and earned capital (retained earnings).", "trap": "Trap: equity = assets MINUS liabilities; creditors rank ahead of owners.", "klp": "T1: Accounting equation; owners' claims", "source": "original (student weak spot: owners' claims)", "options": ["Shareholders' equity equals total assets minus total liabilities.", "Shareholders' equity equals total assets plus total liabilities.", "The two main equity accounts are share capital and retained earnings.", "Shareholders' equity represents the owners' residual claim after creditors have been paid."], "answer": 1}, {"id": "T1-M20", "topic": "T1", "priority": 3, "template": "plug", "weak_spot": true, "stem": "Bluefin Ltd has total assets of $500,000, total liabilities of $320,000 and share capital of $100,000. What is the total amount of the owners' claims on Bluefin's assets?", "explanation": "Owners' claims = equity = assets - liabilities = 500,000 - 320,000 = 180,000, made up of share capital 100,000 + retained earnings 80,000. $80,000 is only retained earnings (forgets share capital). $320,000 is the creditors' claim. $500,000 is the total resources, claimed by creditors and owners together.", "trap": "Trap: owners' claims include BOTH share capital and retained earnings.", "klp": "T1: Accounting equation; equity components", "source": "original (student weak spot: owners' claims)", "options": ["$80,000", "$180,000", "$320,000", "$500,000"], "answer": 1}, {"id": "T2-M01", "topic": "T2", "priority": 3, "template": "false-statement", "weak_spot": false, "stem": "Which statement about the rules of debit and credit is FALSE?", "explanation": "Supplies is an asset, and assets increase with debits. What the asset will become later does not change its debit/credit rule. The other three follow DEA|LER: payables (liability) increase with credits, dividends and expenses increase with debits.", "trap": "Trap: prepaid and supplies are assets today; an asset increase is always a debit.", "klp": "T2: Debit/credit rules (DEA|LER)", "source": "Sample final Q39 style, original", "options": ["An increase in Accounts Payable is recorded with a credit.", "An increase in Dividends is recorded with a debit because dividends reduce retained earnings.", "An increase in Supplies is recorded with a credit because supplies will eventually be used up and become an expense.", "Expense accounts normally carry debit balances."], "answer": 2}, {"id": "T2-M02", "topic": "T2", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which group of accounts all have the SAME normal balance?", "explanation": "Dividends, Expenses and Assets (the DEA of DEA|LER) all have debit balances. The other groups mix debit and credit accounts: receivables (debit) with share capital and revenue (credit); dividends (debit) with retained earnings and notes payable (credit); rent expense (debit) with unearned revenue and share capital (credit).", "trap": "Trap: DEA = debit; LER = credit. Memorize it.", "klp": "T2: Debit/credit rules", "source": "Practice AP7 style, original", "options": ["Accounts Receivable, Share Capital, Service Revenue", "Retained Earnings, Dividends, Notes Payable", "Rent Expense, Unearned Revenue, Share Capital", "Dividends, Rent Expense, Accounts Receivable"], "answer": 3}, {"id": "T2-M03", "topic": "T2", "priority": 3, "template": "principle", "weak_spot": false, "stem": "Which of the following is CORRECT under the rules of debits and credits?", "explanation": "Revenue raises equity, and equity increases are credits, so revenue is credited. Liabilities increase with credits, assets increase with debits, and expenses (which reduce equity) increase with debits. The 'expense is a credit because it reduces equity' option gets the logic backwards: reducing equity means a debit.", "trap": "Trap: 'reduces equity' = debit, 'increases equity' = credit.", "klp": "T2: We credit revenue, debit expenses and dividends", "source": "Sample midterm SM11 style, original", "options": ["An increase in revenue is recorded with a credit because revenue increases retained earnings.", "An increase in a liability is recorded with a debit.", "An increase in an expense is recorded with a credit because expenses reduce equity.", "An increase in an asset is recorded with a credit."], "answer": 0}, {"id": "T2-M04", "topic": "T2", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "A bookkeeper records: Dr Cash 50,000 / Cr Notes Payable 50,000. What transaction most likely happened?", "explanation": "Cash goes up (debit) and a liability goes up (credit): the company borrowed. Repaying a loan would be Dr Notes Payable / Cr Cash. A shareholder investment credits Share Capital, not Notes Payable. Buying equipment on credit debits Equipment, not Cash.", "trap": "Trap: read the debit first (what came in), then the credit (where it came from).", "klp": "T2: Analyze impact, determine accounts, record journal entry", "source": "Sample midterm SM12 style, original", "options": ["The company repaid a $50,000 bank loan.", "The company borrowed $50,000 from a bank.", "Shareholders invested $50,000 in the company.", "The company bought equipment for $50,000 on credit."], "answer": 1}, {"id": "T2-M05", "topic": "T2", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A law firm finishes work for a client and sends an invoice for $6,000 due in 30 days. What is the effect on the accounting equation today?", "explanation": "Accounts Receivable (asset) rises and Service Revenue raises retained earnings (equity). 'Liabilities increase' is wrong because the firm owes nothing. 'No effect until paid' is the cash-basis mistake; revenue is recognized when earned. 'Asset up, asset down' describes collecting the receivable later, not the sale.", "trap": "Trap: a credit sale changes equity now; the later collection is just an asset swap.", "klp": "T2: Analyze impact on the accounting equation", "source": "Sample final Q13 style, original", "options": ["Assets increase $6,000; liabilities increase $6,000", "No effect until the client pays", "Assets increase $6,000; equity increases $6,000", "One asset increases $6,000 and another asset decreases $6,000"], "answer": 2}, {"id": "T2-M06", "topic": "T2", "priority": 3, "template": "principle", "weak_spot": false, "stem": "All else equal, which combination of effects CANNOT result from a single transaction?", "explanation": "If assets go up while equity goes down (and nothing else changes), A = L + E breaks. Paying a supplier (assets down, liabilities down), borrowing (assets up, liabilities up) and buying equipment for cash (asset swap) are all valid.", "trap": "Trap: test each option by checking whether both sides of A = L + E still move together.", "klp": "T2: Accounting equation must stay balanced", "source": "Midterm MT25 style, original", "options": ["Assets decrease and liabilities decrease", "Assets increase and liabilities increase", "One asset increases and another asset decreases", "Assets increase and equity decreases"], "answer": 3}, {"id": "T2-M07", "topic": "T2", "priority": 2, "template": "principle", "weak_spot": false, "stem": "A company pays $4,000 cash to a supplier for goods bought on credit last month. Which describes the entry?", "explanation": "Settling a payable reduces the liability (debit) and reduces cash (credit). 'Debit Cash' reverses the entry. Recording an expense double-counts the purchase, which was recorded when the goods were received. Crediting retained earnings is wrong because paying a debt does not create income.", "trap": "Trap: paying off a payable has no effect on equity or expenses.", "klp": "T2: Journal entries and debit/credit rules", "source": "Midterm MT26 style, original", "options": ["Debit Accounts Payable (liability decreases) and credit Cash (asset decreases)", "Debit Cash (asset decreases) and credit Accounts Payable (liability decreases)", "Debit Purchases Expense (expense increases) and credit Cash (asset decreases)", "Debit Accounts Payable (liability decreases) and credit Retained Earnings (equity increases)"], "answer": 0}, {"id": "T2-M08", "topic": "T2", "priority": 3, "template": "transaction-je", "weak_spot": false, "stem": "A company buys a machine for $50,000. It pays $15,000 cash and signs a note payable for the rest. Which journal entry is correct?", "explanation": "The asset is recorded at its full cost of 50,000; cash falls by 15,000 and a liability of 35,000 is created. The option that debits Cash treats cash as coming in. 'Cr Notes Payable 50,000' ignores the cash paid. The last option is the whole entry reversed.", "trap": "Trap: record the asset at full cost, then split the credits between cash and the note.", "klp": "T2: Compound journal entries", "source": "Sample final Q29 style, original numbers", "options": ["Dr Machine 35,000 / Dr Cash 15,000 / Cr Notes Payable 50,000", "Dr Machine 50,000 / Cr Cash 15,000 / Cr Notes Payable 35,000", "Dr Machine 50,000 / Cr Notes Payable 50,000", "Dr Notes Payable 35,000 / Dr Cash 15,000 / Cr Machine 50,000"], "answer": 1}, {"id": "T2-M09", "topic": "T2", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "Willow Traders purchases $60,000 of inventory, paying one-third in cash and signing a note payable for the balance. The correct entry is:", "explanation": "One-third of 60,000 = 20,000 cash; the remaining 40,000 is a note payable. 'Cr Accounts Payable' is wrong because a signed note is Notes Payable, not a trade payable. Recording only 20,000 ignores the note. 'Dr Purchases' is the periodic system; under perpetual we debit Inventory.", "trap": "Trap: a signed note = Notes Payable; a plain credit purchase = Accounts Payable.", "klp": "T2: Compound journal entries; T5: perpetual purchase", "source": "Practice AP21 style, original numbers", "options": ["Dr Inventory 60,000 / Cr Accounts Payable 60,000", "Dr Inventory 20,000 / Cr Cash 20,000", "Dr Inventory 60,000 / Cr Cash 20,000 / Cr Notes Payable 40,000", "Dr Purchases 60,000 / Cr Cash 20,000 / Cr Notes Payable 40,000"], "answer": 2}, {"id": "T2-M10", "topic": "T2", "priority": 3, "template": "principle", "weak_spot": false, "stem": "A trial balance shows total debits equal to total credits. Which error would the trial balance FAIL to detect?", "explanation": "Debiting the wrong expense account keeps debits equal to credits, so the trial balance still balances and does not reveal it. The other three create unequal totals: a $700/$70 mismatch, a missing debit, and a debit posted as a credit.", "trap": "Trap: the trial balance only proves Dr = Cr; it cannot see wrong-account errors, omitted transactions, or equal-and-opposite errors.", "klp": "T2: What is the purpose of the trial balance?", "source": "Sample final Q4 style, original", "options": ["A $700 credit sale was posted as a $700 debit to Accounts Receivable and a $70 credit to Sales Revenue.", "A $1,500 payment to a supplier was posted only as a credit to Cash; the debit was not posted.", "A $250 debit to Supplies was posted as a credit to Supplies.", "A $900 payment for advertising was debited to Utilities Expense and credited to Cash."], "answer": 3}, {"id": "T2-M11", "topic": "T2", "priority": 3, "template": "principle", "weak_spot": false, "stem": "What is the main purpose of preparing a trial balance?", "explanation": "The trial balance is an internal check of mathematical equality. It cannot confirm the correct account was used. Reporting to shareholders is the job of the financial statements. Transferring temporary balances is done by closing entries.", "trap": "Trap: a balanced trial balance does not mean error-free books.", "klp": "T2: What is the purpose of the trial balance?", "source": "Sample midterm SM14 style, original", "options": ["To check that total debit balances equal total credit balances in the ledger before statements are prepared.", "To prove that every transaction was recorded in the correct account.", "To report the company's financial position to shareholders.", "To transfer the balances of revenue and expense accounts to retained earnings."], "answer": 0}, {"id": "T2-M12", "topic": "T2", "priority": 2, "template": "principle", "weak_spot": false, "stem": "What is the primary purpose of the general ledger?", "explanation": "The journal records transactions in date order; posting then transfers them into the ledger, where each account (T-account) accumulates its balance. Presenting information to outsiders is the role of the financial statements. Customer and supplier detail is a subsidiary ledger, not the general ledger's main purpose.", "trap": "Trap: journal = chronological record; ledger = summary by account.", "klp": "T2: Post to T-accounts to summarize the effects of transactions", "source": "Midterm MT21 style, original", "options": ["To record each transaction in chronological order as it happens.", "To collect and summarize, account by account, the effects of all transactions that were journalized.", "To present financial information to external users.", "To list only the receivable and payable balances for each customer and supplier."], "answer": 1}, {"id": "T2-M13", "topic": "T2", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Which sequence correctly shows the flow of accounting data in the recording process?", "explanation": "Analysis comes first, then journalizing, then posting to ledger accounts, then the trial balance to check Dr = Cr. The other sequences put posting before journalizing or the trial balance before the records it summarizes.", "trap": "Trap: you cannot post what has not been journalized, and you cannot balance what has not been posted.", "klp": "T2: Flow of accounting data (Week 1 slide 76)", "source": "original", "options": ["Record in the journal, analyze the transaction, prepare the trial balance, post to the ledger", "Post to the ledger, record in the journal, analyze the transaction, prepare the trial balance", "Analyze the transaction, record it in the journal, post to the ledger, prepare the trial balance", "Prepare the trial balance, record in the journal, post to the ledger, analyze the transaction"], "answer": 2}, {"id": "T2-M14", "topic": "T2", "priority": 3, "template": "plug", "weak_spot": false, "stem": "Accounts Payable had a credit balance of $25,000 at the start of the month. During the month the company bought $70,000 of inventory on account, returned $4,000 of damaged goods to suppliers, and paid suppliers $63,000. What is the ending Accounts Payable balance?", "explanation": "Ending A/P = 25,000 + 70,000 - 4,000 - 63,000 = 28,000 credit. $32,000 forgets the returns. $3,000 ignores the opening balance. 'Debit' is wrong because a payable's normal balance is a credit.", "trap": "Trap: returns reduce what you owe just as payments do.", "klp": "T2: T-accounts summarize transactions", "source": "Sample final Q42 style, original numbers", "options": ["$32,000 credit", "$3,000 credit", "$28,000 debit", "$28,000 credit"], "answer": 3}, {"id": "T2-M15", "topic": "T2", "priority": 2, "template": "plug", "weak_spot": false, "stem": "Accounts Receivable began the year at $40,000 and ended at $46,000. Credit sales for the year were $210,000. How much cash was collected from customers?", "explanation": "Beginning + credit sales - collections = ending, so collections = 40,000 + 210,000 - 46,000 = 204,000. $216,000 adds the change instead of subtracting. $210,000 assumes all sales were collected. $250,000 forgets to deduct the ending balance.", "trap": "Trap: A/R rose by 6,000, so collections must be 6,000 LESS than sales.", "klp": "T2: T-account analysis", "source": "E4-12 style, original numbers", "options": ["$204,000", "$210,000", "$216,000", "$250,000"], "answer": 0}, {"id": "T2-M16", "topic": "T2", "priority": 2, "template": "plug", "weak_spot": false, "stem": "Pico Ltd's first trial balance lists: Cash $8,000; Accounts Receivable $4,000; Supplies ?; Equipment $12,000; Accounts Payable $3,000; Notes Payable $6,000; Share Capital $10,000; Dividends $1,000; Revenue $20,000; Expenses $13,000. What is the Supplies balance?", "explanation": "Debits: 8,000 + 4,000 + 12,000 + 1,000 + 13,000 + Supplies = 38,000 + Supplies. Credits: 3,000 + 6,000 + 10,000 + 20,000 = 39,000. Supplies = 1,000. $2,000 forgets Dividends is a debit-balance account. $3,000 puts Dividends on the credit side. $0 assumes the trial balance already balances.", "trap": "Trap: Dividends and Expenses sit on the debit side of the trial balance.", "klp": "T2: Trial balance; normal balances", "source": "Practice AP16 style, original numbers", "options": ["$0", "$1,000", "$2,000", "$3,000"], "answer": 1}, {"id": "T2-M17", "topic": "T2", "priority": 2, "template": "plug", "weak_spot": false, "stem": "In its first month, Nova Ltd: issued shares for $60,000 cash; bought equipment costing $30,000 by paying $10,000 cash and signing a note for the rest; bought $5,000 of supplies on credit; performed $25,000 of services on account; collected $15,000 from those customers; and paid $8,000 to suppliers. What are total assets at month-end?", "explanation": "Assets = 60,000 cash + 20,000 net equipment effect (equipment 30,000 less cash 10,000) + 5,000 supplies + 25,000 receivables - 8,000 cash paid = 102,000. Collecting 15,000 just swaps A/R for cash. $82,000 ignores the note-financed part of the equipment. $117,000 double counts the collection. $110,000 forgets the payment to suppliers.", "trap": "Trap: collecting a receivable does not change total assets.", "klp": "T2: Analyze the impact of transactions on the accounting equation", "source": "Practice AP23 style, original numbers", "options": ["$82,000", "$102,000", "$110,000", "$117,000"], "answer": 1}, {"id": "T2-M18", "topic": "T2", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Why must total debits equal total credits in every journal entry?", "explanation": "Equal debits and credits are the mechanical form of double-entry: every transaction's two effects keep A = L + E. The rule has nothing to do with cash balances, depreciation or skipping the trial balance.", "trap": "Trap: 'debit' and 'credit' only mean left and right; the equality is what protects the equation.", "klp": "T2: Total debits must equal total credits", "source": "Sample midterm SM13 style, original", "options": ["So that the accounting equation stays in balance after each transaction.", "So that the cash account always has a positive balance.", "So that depreciation can be computed correctly.", "So that the company can skip preparing a trial balance."], "answer": 0}, {"id": "T2-M19", "topic": "T2", "priority": 3, "template": "classification", "weak_spot": false, "stem": "Which of the following accounts is a LIABILITY?", "explanation": "Unearned revenue is cash received before the work is done, so the company owes goods or services: a liability. Prepaid Rent and Interest Receivable are assets. Sales Returns and Allowances is a contra-revenue account.", "trap": "Trap: 'unearned' or 'payable' or 'provision' in the name signals a liability, even when the word 'revenue' appears.", "klp": "T2: Can you tell whether an account is an asset, liability or equity?", "source": "Sample midterm SM10 style, original", "options": ["Prepaid Rent", "Unearned Service Revenue", "Interest Receivable", "Sales Returns and Allowances"], "answer": 1}, {"id": "T2-M20", "topic": "T2", "priority": 2, "template": "classification", "weak_spot": false, "stem": "Which of the following is an ASSET account?", "explanation": "Prepaid insurance is a future benefit the company has paid for, so it is a current asset. Salaries Payable and Unearned Rent Revenue are liabilities. Dividends is a temporary equity-reducing account.", "trap": "Trap: a one-year policy paid on the last day of the year is still a current ASSET at that date, not an expense.", "klp": "T2: Identify account type from its name", "source": "Midterm MT20 style, original", "options": ["Salaries Payable", "Dividends", "Prepaid Insurance", "Unearned Rent Revenue"], "answer": 2}, {"id": "T2-M21", "topic": "T2", "priority": 2, "template": "principle", "weak_spot": false, "stem": "Why is an increase in the Dividends account recorded with a DEBIT?", "explanation": "Dividends lower retained earnings; equity decreases are debits. Dividends are not an expense (they do not appear on the income statement). The cash paid is credited, not debited. Equity increases are credits, not debits.", "trap": "Trap: dividends and expenses both get debited, but for different reasons: dividends are a distribution, not an expense.", "klp": "T2: Debit/credit rules for revenue, expenses and dividends", "source": "Week 1 Kahoot 'special case', original", "options": ["Because dividends are an expense, and expenses are debited.", "Because dividends are paid in cash, and cash is a debit-balance account.", "Because dividends increase equity, and equity increases are debited.", "Because dividends reduce retained earnings, and a reduction in equity is recorded with a debit."], "answer": 3}, {"id": "T2-M22", "topic": "T2", "priority": 2, "template": "transaction-je", "weak_spot": false, "stem": "A company sells a plot of land that cost $30,000 for $34,000 cash. Which journal entry is correct?", "explanation": "Remove the land at its cost (30,000), record the cash received (34,000), and the difference (4,000) is a gain. Crediting Land for 34,000 overstates the removal. 'Sales Revenue' treats a peripheral asset sale as core revenue. A loss arises only when proceeds are below cost.", "trap": "Trap: remove the asset at book value, not at selling price.", "klp": "T1/T2: Gains vs revenue; journal entries", "source": "Week 1 RedLotus item 9 style, original numbers", "options": ["Dr Cash 34,000 / Cr Land 30,000 / Cr Gain on Sale of Land 4,000", "Dr Cash 34,000 / Cr Land 34,000", "Dr Cash 34,000 / Cr Sales Revenue 34,000", "Dr Cash 34,000 / Dr Loss on Sale 4,000 / Cr Land 30,000"], "answer": 0}, {"id": "T3-M01", "topic": "T3", "priority": 3, "template": "missed-adjustment", "weak_spot": false, "stem": "Trent Consulting finished $4,000 of work for a client in December but will only send the invoice in January. If no adjusting entry is made at December 31, which is correct for the current year?", "explanation": "The missing entry is Dr Accounts Receivable 4,000 / Cr Service Revenue 4,000 (accrued revenue). Without it, receivables (assets), revenue, net income and equity are all too low. 'Assets overstated' describes a missed prepaid-expense adjustment. The liability options are wrong because accrued revenue involves no liability.", "trap": "Trap: an accrued revenue that is missed makes everything on the revenue side too LOW.", "klp": "T3: What happens to balances if adjustments are not made?", "source": "Sample final Q11 style, original", "options": ["Assets overstated; revenue overstated", "Assets understated; revenue understated; equity understated", "Liabilities understated; revenue overstated", "Liabilities overstated; equity understated"], "answer": 1}, {"id": "T3-M02", "topic": "T3", "priority": 3, "template": "missed-adjustment", "weak_spot": false, "stem": "A company forgets to record the adjusting entry for insurance that expired during the year. Which is the effect on the current year's statements?", "explanation": "The missing entry is Dr Insurance Expense / Cr Prepaid Insurance. Without it, prepaid insurance (asset) stays too high, expense is too low, so net income and equity are too high. 'Expenses overstated' is the opposite direction. 'Assets understated with NI overstated' is impossible for this error. Liabilities are not involved in a prepaid adjustment.", "trap": "Trap: a missed prepaid adjustment leaves an ASSET overstated; a missed accrued expense leaves a LIABILITY understated.", "klp": "T3: Over/understatement when adjustments are not made", "source": "Midterm MT24 style, original", "options": ["Expenses overstated; assets understated; net income understated", "Assets understated; net income overstated", "Expenses understated; assets overstated; net income overstated", "Liabilities understated; expenses understated"], "answer": 2}, {"id": "T3-M03", "topic": "T3", "priority": 3, "template": "missed-adjustment", "weak_spot": false, "stem": "Employees earned $9,000 of wages in the last week of December that will be paid on January 4. If the year-end adjusting entry is NOT recorded, the effect on the December 31 statements is:", "explanation": "The missing entry is Dr Wages Expense 9,000 / Cr Wages Payable 9,000. Without it the payable is missing (liabilities too low), expense is too low, and net income and equity are too high. 'Liabilities overstated' has the wrong direction. The asset options are wrong because no asset is involved in an accrued expense.", "trap": "Trap: missed accrued expense = liabilities AND expenses both understated.", "klp": "T3: Accrued expenses; effect of missing adjustments", "source": "Sample midterm SM19 style, original", "options": ["Liabilities overstated $9,000; expenses understated $9,000", "Assets overstated $9,000; expenses overstated $9,000", "Assets understated $9,000; net income understated $9,000", "Liabilities understated $9,000; expenses understated $9,000; net income overstated $9,000"], "answer": 3}, {"id": "T3-M04", "topic": "T3", "priority": 3, "template": "missed-adjustment", "weak_spot": false, "stem": "Supplies had a $400 balance on March 1. During March the company bought $1,900 of supplies (debited to Supplies) and a count on March 31 shows $700 still on hand. If no adjusting entry is made for March, which statement is correct?", "explanation": "Supplies used = 400 + 1,900 - 700 = 1,600. The missing entry is Dr Supplies Expense 1,600 / Cr Supplies 1,600, so expenses are understated by 1,600 and net income, equity and assets are overstated by 1,600. 'Expenses understated 1,900' uses purchases instead of usage. 'Assets understated' is the wrong direction (supplies are too high). 'Net income understated' is the wrong direction.", "trap": "Trap: the adjustment is for supplies USED, not supplies bought or supplies left.", "klp": "T3: Prepaid expenses (supplies) adjustment", "source": "Practice AP9 style, original numbers", "options": ["Equity is overstated by $1,600", "Expenses are understated by $1,900", "Assets are understated by $700", "Net income is understated by $1,600"], "answer": 0}, {"id": "T3-M05", "topic": "T3", "priority": 3, "template": "missed-adjustment", "weak_spot": false, "stem": "On December 1 a landlord received $6,000 for three months' rent and credited Unearned Rent Revenue. No adjusting entry is made at December 31. Which is correct?", "explanation": "One month (6,000 x 1/3 = 2,000) has been earned. The missing entry is Dr Unearned Rent Revenue 2,000 / Cr Rent Revenue 2,000, so the liability is too high and revenue, net income and equity are too low by 2,000. 'Liabilities understated' is backwards. Assets are not affected (cash was recorded correctly on December 1). The 6,000 option forgets that only one of three months has passed.", "trap": "Trap: a missed unearned-revenue adjustment leaves a LIABILITY too high, not an asset.", "klp": "T3: Unearned revenue adjustment", "source": "E4-13 item 4 style, original numbers", "options": ["Liabilities understated $2,000; revenue overstated $2,000", "Liabilities overstated $2,000; revenue understated $2,000", "Assets overstated $2,000; revenue understated $2,000", "Liabilities overstated $6,000; revenue understated $6,000"], "answer": 1}, {"id": "T3-M06", "topic": "T3", "priority": 2, "template": "missed-adjustment", "weak_spot": false, "stem": "A company has a bank loan on which interest for November and December has not been paid or recorded by December 31. If the accrual is omitted, which combination is correct?", "explanation": "The missing entry is Dr Interest Expense / Cr Interest Payable. Expense and the payable are both too low, so net income is too high. 'Assets overstated' confuses this with a prepaid adjustment. 'Expenses overstated' is the wrong direction. 'No effect' is the cash-basis error; accrual accounting records the expense when incurred.", "trap": "Trap: 'will be paid next year' never excuses leaving out this year's expense.", "klp": "T3: Accrued expenses; cash-later transactions", "source": "Sample final Q50 / KLP, original", "options": ["Expenses understated; assets overstated; net income overstated", "Expenses overstated; liabilities overstated; net income understated", "Expenses understated; liabilities understated; net income overstated", "No effect on net income because the interest will be paid next year"], "answer": 2}, {"id": "T3-M07", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "On September 1, 2026 a company paid $12,000 for a one-year insurance policy and debited Prepaid Insurance. Its year ends December 31. What adjusting entry is needed on December 31, 2026?", "explanation": "September to December is 4 months: 12,000 x 4/12 = 4,000 has expired. The 8,000 option is the unexpired 8 months. The reversed entry would increase the asset. Crediting Cash is wrong because cash was paid on September 1; adjusting entries never touch cash.", "trap": "Trap: adjust for the months USED, and never put Cash in an adjusting entry.", "klp": "T3: Adjusting entries for prepaid expenses", "source": "Sample final Q32 style, original numbers", "options": ["Dr Insurance Expense 8,000 / Cr Prepaid Insurance 8,000", "Dr Prepaid Insurance 4,000 / Cr Insurance Expense 4,000", "Dr Insurance Expense 4,000 / Cr Cash 4,000", "Dr Insurance Expense 4,000 / Cr Prepaid Insurance 4,000"], "answer": 3}, {"id": "T3-M08", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "On March 1, 2026 a company placed $60,000 in a one-year bank deposit earning 5% interest, with all interest to be received on February 28, 2027. What adjusting entry is required on December 31, 2026?", "explanation": "March to December is 10 months: 60,000 x 5% x 10/12 = 2,500 earned but not yet received (accrued revenue). $3,000 is the full year's interest. Debiting Cash is wrong because no cash has been received. The last option is reversed.", "trap": "Trap: count only the months that have passed in THIS year.", "klp": "T3: Accrued revenue adjusting entry", "source": "Week 2 self-practice item 1 style, original numbers", "options": ["Dr Interest Receivable 2,500 / Cr Interest Revenue 2,500", "Dr Interest Receivable 3,000 / Cr Interest Revenue 3,000", "Dr Cash 2,500 / Cr Interest Revenue 2,500", "Dr Interest Revenue 2,500 / Cr Interest Receivable 2,500"], "answer": 0}, {"id": "T3-M09", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": false, "stem": "A company pays its staff $10,000 every Friday for a five-day working week. December 31 falls on a Wednesday. What adjusting entry is needed on December 31?", "explanation": "Three of five working days (Mon-Wed) belong to December: 10,000 x 3/5 = 6,000 is accrued. The 10,000 option accrues the whole week. The 4,000 option accrues the two January days instead. The last option is reversed.", "trap": "Trap: accrue only the days worked up to the balance sheet date.", "klp": "T3: Accrued expenses adjusting entry", "source": "Week 2 slide 49-50 style, original numbers", "options": ["Dr Salaries Expense 10,000 / Cr Salaries Payable 10,000", "Dr Salaries Expense 6,000 / Cr Salaries Payable 6,000", "Dr Salaries Expense 4,000 / Cr Salaries Payable 4,000", "Dr Salaries Payable 6,000 / Cr Salaries Expense 6,000"], "answer": 1}, {"id": "T3-M10", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "On May 1, 2026 Orbit Ltd paid $36,000 for a three-year insurance policy covering May 1, 2026 to April 30, 2029, and debited Prepaid Insurance. What adjusting entry is required on December 31, 2026?", "explanation": "The policy covers 36 months; 8 months (May-Dec) have expired: 36,000 x 8/36 = 8,000. $12,000 is one full year of cover. $24,000 wrongly treats the 36,000 as a one-year premium and takes 8/12. $28,000 is the unexpired balance that should remain in Prepaid Insurance.", "trap": "Trap: pro-rate over the TOTAL months of the policy, not over 12.", "klp": "T3: Prepaid expense adjustment", "source": "Midterm MT30 (student error), original numbers", "options": ["Dr Insurance Expense 12,000 / Cr Prepaid Insurance 12,000", "Dr Insurance Expense 24,000 / Cr Prepaid Insurance 24,000", "Dr Insurance Expense 8,000 / Cr Prepaid Insurance 8,000", "Dr Insurance Expense 28,000 / Cr Prepaid Insurance 28,000"], "answer": 2}, {"id": "T3-M11", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "On October 1, 2026 a company paid $27,000 rent in advance for an 18-month lease starting that day and debited Prepaid Rent. What is the rent expense that should be recognized for the year ended December 31, 2026?", "explanation": "Monthly rent = 27,000 / 18 = 1,500; three months (Oct-Dec) = 4,500. $6,750 takes 3/12 of the total as if it were a one-year lease. $18,000 is a full year of rent. $22,500 is the prepaid balance still on the balance sheet.", "trap": "Trap: first find the cost per month using the full lease length.", "klp": "T3: Prepaid expense adjustment", "source": "original (student weak spot: multi-year prepaid)", "options": ["$4,500", "$6,750", "$18,000", "$22,500"], "answer": 0}, {"id": "T3-M12", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "Sable Co paid $48,000 on April 1, 2026 for a two-year maintenance contract (April 1, 2026 to March 31, 2028) and recorded it as Prepaid Maintenance. What balance should Prepaid Maintenance show on the December 31, 2026 balance sheet after adjustment?", "explanation": "Used: 9 months of 24 = 48,000 x 9/24 = 18,000 expense. Remaining asset = 48,000 - 18,000 = 30,000. $18,000 is the expense, not the asset. $24,000 assumes exactly one year has passed. $12,000 wrongly expenses 9/12 of the whole contract.", "trap": "Trap: read whether the question asks for the EXPENSE or the remaining ASSET.", "klp": "T3: Prepaid expense adjustment", "source": "original (student weak spot: multi-year prepaid)", "options": ["$12,000", "$18,000", "$24,000", "$30,000"], "answer": 3}, {"id": "T3-M13", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "On November 1, 2026 Pixel Design collected $9,000 from a client for six months of design services and credited Unearned Service Revenue. What adjusting entry is needed on December 31, 2026?", "explanation": "Two of six months are earned: 9,000 x 2/6 = 3,000. The liability is reduced (debit) and revenue is recognized (credit). The first wrong option is reversed and would increase the liability. Cash was already received on November 1, so it cannot appear again. Accounts Receivable is for revenue not yet billed, not for cash already collected.", "trap": "Trap: to move unearned revenue to earned revenue, DEBIT the liability and CREDIT revenue.", "klp": "T3: Unearned revenue adjusting entry", "source": "Midterm MT7 (student error), original numbers", "options": ["Dr Service Revenue 3,000 / Cr Unearned Service Revenue 3,000", "Dr Cash 3,000 / Cr Service Revenue 3,000", "Dr Accounts Receivable 3,000 / Cr Service Revenue 3,000", "Dr Unearned Service Revenue 3,000 / Cr Service Revenue 3,000"], "answer": 3}, {"id": "T3-M14", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "A magazine publisher received $2,400 on October 1, 2026 for a 12-month subscription and credited Unearned Subscription Revenue. Which entry correctly adjusts the accounts at December 31, 2026?", "explanation": "Three months (Oct-Dec) of twelve have been delivered: 2,400 x 3/12 = 600 earned; 1,800 stays as a liability. The 1,800 option recognizes the unearned portion as revenue. The reversed entry would increase the liability. Cash is never part of an adjusting entry.", "trap": "Trap: the amount earned goes to revenue; the rest STAYS in the liability.", "klp": "T3: Unearned revenue adjusting entry", "source": "E4-5 style, original numbers", "options": ["Dr Unearned Subscription Revenue 600 / Cr Subscription Revenue 600", "Dr Unearned Subscription Revenue 1,800 / Cr Subscription Revenue 1,800", "Dr Subscription Revenue 600 / Cr Unearned Subscription Revenue 600", "Dr Cash 600 / Cr Subscription Revenue 600"], "answer": 0}, {"id": "T3-M15", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "What is the effect of the adjusting entry that recognizes revenue from services that were paid for in advance by a customer?", "explanation": "The entry Dr Unearned Revenue / Cr Revenue moves an amount from a liability to revenue. Assets were affected only when the cash came in earlier. 'Assets decrease' confuses this with using up a prepaid. 'Liabilities increase' is the reverse. 'No effect on revenue' misses the whole point of the entry.", "trap": "Trap: unearned revenue adjustments touch a liability and revenue only.", "klp": "T3: Unearned revenue (cash first)", "source": "original (student weak spot: unearned to earned)", "options": ["Assets decrease and revenue increases", "Liabilities decrease and revenue increases; total assets are unchanged", "Liabilities increase and revenue increases", "Assets increase and liabilities decrease; no effect on revenue"], "answer": 1}, {"id": "T3-M16", "topic": "T3", "priority": 3, "template": "classification", "weak_spot": true, "stem": "The entry to close Service Revenue at year-end will include a:", "explanation": "Revenue has a credit balance, so to bring it to zero we DEBIT revenue and credit Retained Earnings. 'Credit to Service Revenue' would increase it. 'Debit to Retained Earnings' happens when closing expenses or dividends, not revenue. 'Credit to Salaries Expense' belongs to the expense closing entry.", "trap": "Trap: to close an account, do the OPPOSITE of its normal balance.", "klp": "T3: How to close temporary accounts to Retained Earnings", "source": "Midterm MT15 (student error), original", "options": ["Credit to Service Revenue", "Debit to Retained Earnings", "Debit to Service Revenue", "Credit to Salaries Expense"], "answer": 2}, {"id": "T3-M17", "topic": "T3", "priority": 3, "template": "adjusting-je", "weak_spot": true, "stem": "At year-end Juno Ltd has Service Revenue $90,000, Rent Expense $30,000, Salaries Expense $40,000 and Dividends $5,000. Which single entry correctly closes the revenue and expense accounts?", "explanation": "Revenue (credit balance) is debited to zero; expenses (debit balances) are credited to zero; the net income of 20,000 is credited to Retained Earnings. The first wrong option is the entire entry reversed. The second wrongly closes Dividends inside the income entry (Dividends is closed separately, Dr RE / Cr Dividends) and understates the NI transferred. The last option only moves revenue and in the wrong direction.", "trap": "Trap: dividends are closed in a separate entry directly against Retained Earnings; they are not part of net income.", "klp": "T3: Closing entries", "source": "P4-7 style, original numbers", "options": ["Dr Retained Earnings 20,000 / Dr Rent Expense 30,000 / Dr Salaries Expense 40,000 / Cr Service Revenue 90,000", "Dr Service Revenue 90,000 / Cr Rent Expense 30,000 / Cr Salaries Expense 40,000 / Cr Dividends 5,000 / Cr Retained Earnings 15,000", "Dr Retained Earnings 90,000 / Cr Service Revenue 90,
